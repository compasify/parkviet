name: Backend CI

# Every branch, whenever the API changes. Run it by hand from the Actions tab
# (or `gh workflow run backend-ci.yml --ref <branch>`) to test a branch at will.
on:
  push:
    paths:
      - server/**
      - .github/workflows/backend-ci.yml
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rspec:
    name: rspec (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          # The Spree initializer queries the database while Rails boots, so
          # db:prepare cannot create it; the image creates it instead.
          POSTGRES_DB: spree_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # database.yml builds the test config from these. Not DATABASE_URL: it
      # would override database.yml for every Rails env.
      DATABASE_HOST: localhost
      DATABASE_USERNAME: postgres
      RAILS_ENV: test
      # Each shard sees a quarter of the code, so its coverage report means
      # nothing on its own. Run locally with COVERAGE=1 for a report.
      SPREE_DEV_TOOLS_DISABLE_SIMPLECOV: '1'

    steps:
      - uses: actions/checkout@v7
        with:
          # spree_vietqr is a git submodule under vendor/gems; bundler needs it.
          submodules: true

      # libvips, as in the Docker image: uploads and image variants run
      # through it. libvips-tools pulls in the library under whatever name
      # the runner's Ubuntu release gives it.
      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-tools

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: server
          bundler-cache: true

      - name: Prepare database
        run: bin/rails db:prepare

      - name: Precompile assets
        run: bin/rake assets:precompile

      # Files are dealt largest first to the shard with the least so far, so
      # the four shards finish close together. The split depends only on the
      # files, so a failing shard reruns the same files.
      - name: Pick this shard's spec files
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          find spec -name '*_spec.rb' -printf '%s %p\n' | sort -k1,1nr -k2,2 |
            awk -v n=4 -v shard="$SHARD" '{
              best = 0
              for (k = 1; k < n; k++) if (load[k] < load[best]) best = k
              load[best] += $1
              if (best == shard - 1) print $2
            }' > "$RUNNER_TEMP/shard-files"
          echo "$(wc -l < "$RUNNER_TEMP/shard-files") spec files in this shard"

      - name: Run tests
        run: xargs bundle exec rspec < "$RUNNER_TEMP/shard-files"

  security:
    name: Brakeman and bundle audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: server
          bundler-cache: true

      - name: Brakeman security scan
        run: bundle exec brakeman --no-pager -q

      - name: Bundle audit
        run: bundle exec bundle-audit check --update
