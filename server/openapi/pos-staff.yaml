          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PrintJob'
  /api/v3/admin/pos/print_jobs/{id}/reprint:
    post:
      operationId: posPrintJobReprint
      description: >
        A new job for the same document. A pre-bill needs an approval for
        `workspace.reprint_prebill` bound to the workspace and its revision,
        and answers `approval_required` without one.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                approval_id:
                  type: string
      responses:
        '201':
          description: The new job
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PrintJobResult'
        '409':
          description: Refused; `error.details.reason` says why
  /api/v3/admin/pos/print_jobs/{id}/cancel:
    post:
      operationId: posPrintJobCancel
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: Idempotency-Key
          in: header
          required: true
