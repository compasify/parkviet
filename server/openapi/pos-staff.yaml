openapi: 3.1.0
info:
  title: Parkviet POS staff API
  version: '1'
  description: >
    Staff contract for context, catalog, workspaces and approvals, and the
    device channel. A paired device reaches the /admin/pos paths with
    `Authorization: Device <token>` and `X-Pos-Staff-Session`.
x-realtime:
  transport: Action Cable
  path: /cable
  channel: Spree::Pos::BranchChannel
  subscribeParams:
    branch_id: Prefixed id of the branch
  stream: pos:branch:<branch_prefixed_id>
  message:
    $ref: '#/components/schemas/RealtimeEvent'
  authentication:
    staff: Query `token` holding the Admin API JWT. Needs an allowed Origin.
    device: >
      Subprotocol `pos-device.<token>` or query `device_token`, and for a staff
      session subprotocol `pos-staff-session.<token>` or query
      `staff_session_token`. Origin may be absent. A native client offering
      subprotocols must also offer `actioncable-v1-json`, or the server selects
      no protocol for the socket.
  delivery: >
    Events only announce a change; read it through the API. Refetch every open
    query after a reconnect, because events sent while offline are not replayed.
paths:
  /api/v3/admin/pos/context:
    get:
      operationId: posContext
      parameters:
        - name: branch_id
          in: query
          description: The branch whose capabilities to list.
          schema:
            type: string
        - name: register_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Staff context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Context'
  /api/v3/admin/pos/catalog:
    get:
      operationId: posCatalog
      responses:
        '200':
          description: Products the branch may sell
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CatalogItem'
  /api/v3/admin/pos/workspaces:
    get:
      operationId: posWorkspaceList
      description: >
        Orders visible to the person. A bar's tab list asks for
        `service_mode=tab&status=editing,parked` and finds tabs by guest name,
        table or call number with `q`.
      parameters:
        - name: branch_id
          in: query
          schema:
            type: string
        - name: service_mode
          in: query
          schema:
            type: string
            enum: [counter, dine_in, takeaway, delivery, tab, timed]
        - name: status
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
            maxLength: 60
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: The orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceSummaryList'
    post:
      operationId: posWorkspaceCreate
      description: >
        A draft order. With `service_mode: tab` and a `tab_name` it opens a
        bar tab (`fnb.postpay`) that everyone at the branch adds to;
        `tab_name_taken` when an open tab already has the name.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceCreateInput'
      responses:
        '201':
          description: Draft workspace
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Workspace'
  /api/v3/admin/pos/workspaces/{id}:
    get:
      operationId: posWorkspaceShow
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Workspace
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Workspace'
  /api/v3/admin/pos/workspaces/{id}/items:
    post:
      operationId: posWorkspaceAddItem
      description: >
        Adds a line. A menu item at a branch running `fnb.menu` is priced by
        the server from its options: send `modifiers` ([ModifierSelection],
        omitted for the item's default options) and `note`, never a price.
        Two lines merge (`merge: true`) only with the same options and note.
        Refused with 409 `menu_item_sold_out`, `menu_item_hidden`,
        `modifier_min`, `modifier_max`, `modifier_unknown`, or
        `module_disabled` when options are sent where the menu is off.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Workspace after the line change
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Workspace'
  /api/v3/admin/pos/workspaces/{workspace_id}/items/{id}/modifiers:
    patch:
      operationId: posWorkspaceLineModifiers
      description: >
        Replaces the options and note of a menu line. The line keeps its base
        price; a line that ends up with the same options as another merges
        into it. Refused with 409 `module_disabled`, `modifier_min`,
        `modifier_max`, `modifier_unknown` or `snapshot_locked`.
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_revision, lease_generation, editor_id, modifiers]
              properties:
                expected_revision:
                  type: integer
                lease_generation:
                  type: integer
                editor_id:
                  type: string
                  format: uuid
                modifiers:
                  type: array
                  items:
                    $ref: '#/components/schemas/ModifierSelection'
                note:
                  type: string
                  maxLength: 200
      responses:
        '200':
          description: Workspace after the change
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Workspace'
        '409':
          description: Refused; `error.details.reason` says why
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/menu:
    get:
      operationId: posMenu
      description: >
        The menu a branch sells from now: a running time-of-day menu applied,
        hidden items left out, today's sold-out items marked. Send the last
        `etag` as `If-None-Match` to get 304 when nothing changed. Read again
        on `menu.sold_out`.
      parameters:
        - name: branch_id
          in: query
          required: true
          schema:
            type: string
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        '200':
          description: Menu
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Menu'
        '304':
          description: Unchanged since the etag sent
  /api/v3/admin/pos/menu_availabilities:
    put:
      operationId: posMenuSoldOut
      description: >
        Marks a menu item sold out at a branch for the current business day,
        or back on sale. Needs `pos.menu.sold_out`, `pos.menu.manage`, or a
        kitchen screen (device mode `kds`) of the branch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch_id, menu_item_id, sold_out]
              properties:
                branch_id:
                  type: string
                menu_item_id:
                  type: string
                sold_out:
                  type: boolean
      responses:
        '200':
          description: Sold-out state
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/MenuAvailability'
        '409':
          description: Refused; `error.details.reason` says why
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/menu_favorites:
    put:
      operationId: posMenuFavorites
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch_id, menu_item_ids]
              properties:
                branch_id:
                  type: string
                menu_item_ids:
                  type: array
                  maxItems: 20
                  items:
                    type: string
      responses:
        '200':
          description: The branch's favourites, in order
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [branch_id, menu_item_ids]
                    properties:
                      branch_id:
                        type: string
                      menu_item_ids:
                        type: array
                        items:
                          type: string
  /api/v3/admin/pos/menu_categories:
    get:
      operationId: posMenuCategories
      responses:
        '200':
          description: Categories of the store's menu
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MenuCategory'
  /api/v3/admin/pos/menu_items:
    get:
      operationId: posMenuItems
      responses:
        '200':
          description: Items of the store's menu, inactive ones included
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MenuItemConfig'
                  meta:
                    $ref: '#/components/schemas/MenuItemsMeta'
  /api/v3/admin/pos/modifier_groups:
    get:
      operationId: posModifierGroups
      responses:
        '200':
          description: Modifier groups of the store with their options
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ModifierGroup'
  /api/v3/admin/pos/recipes:
    get:
      operationId: posRecipe
      description: >
        The recipe of one menu size (`variant_id`) or one modifier option
        (`modifier_option_id`): the active version with its estimated cost at
        today's cost prices, and every version, newest first.
      parameters:
        - name: variant_id
          in: query
          schema:
            type: string
        - name: modifier_option_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Recipe and history
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/RecipeOwner'
    put:
      operationId: posRecipeSave
      description: >
        Saves a new version and retires the active one; an empty list retires
        the recipe. Quantities must be a whole number of the ingredient's stock
        unit. A size with a recipe stops tracking its own stock, so a size with
        stock on hand needs `confirm_stock_write_off` (409
        `recipe_variant_has_stock` otherwise). Needs `pos.inventory.manage`
        and `fnb.recipes` on at a branch of the store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ingredients]
              properties:
                variant_id:
                  type: string
                modifier_option_id:
                  type: string
                confirm_stock_write_off:
                  type: boolean
                ingredients:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    required: [variant_id, quantity, unit_code]
                    properties:
                      variant_id:
                        type: string
                      quantity:
                        type: string
                        pattern: '^\d+(\.\d{1,4})?$'
                      unit_code:
                        type: string
      responses:
        '200':
          description: Recipe and history after the change
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/RecipeOwner'
        '409':
          description: >
            Refused; `error.details.reason` is one of `recipe_ingredient_tracked`,
            `recipe_unit_dimension`, `recipe_unit_unknown`, `recipe_quantity_inexact`,
            `recipe_quantity_invalid`, `recipe_ingredient_duplicate`, `recipe_ingredient_self`,
            `recipe_variant_has_stock`, `recipe_rows_limit` or `module_disabled`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/stock_alerts:
    get:
      operationId: posStockAlerts
      description: Low-stock thresholds of a branch with its shelf now, low ones first.
      parameters:
        - name: branch_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thresholds
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StockAlert'
    put:
      operationId: posStockAlertSet
      description: >
        Sets the threshold of one variant at a branch, in its stock unit, or
        removes it when `min_quantity` is null. Needs `pos.inventory.manage`
        at the branch and `fnb.recipes` on there. Answers with the branch's list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch_id, variant_id]
              properties:
                branch_id:
                  type: string
                variant_id:
                  type: string
                min_quantity:
                  type: [integer, 'null']
                  minimum: 1
      responses:
        '200':
          description: Thresholds after the change
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StockAlert'
        '409':
          description: Refused; `error.details.reason` is `stock_alert_invalid` or `module_disabled`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/reports/ingredient_usage:
    get:
      operationId: posReportIngredientUsage
      description: >
        Ingredients completed sales used, by business date, ingredient and
        menu item, in stock units, at the cost copied at completion.
      parameters:
        - $ref: '#/components/parameters/ReportBranch'
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
      responses:
        '200':
          description: One page of rows
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/IngredientUsageRow'
                  meta:
                    type: object
  /api/v3/admin/pos/reports/menu_margin:
    get:
      operationId: posReportMenuMargin
      description: >
        Gross margin by menu size over completed sales: line revenue after
        line promotions and before added tax, less what the recipes consumed.
      parameters:
        - $ref: '#/components/parameters/ReportBranch'
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
      responses:
        '200':
          description: One page of rows
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MenuMarginRow'
                  meta:
                    type: object
  /api/v3/admin/pos/reports/platforms:
    get:
      operationId: posReportPlatforms
      description: >
        Completed delivery platform orders by business date and platform:
        gross, commission, what the platform pays (net) and the part not paid
        yet, with estimated and settled commission apart.
      parameters:
        - $ref: '#/components/parameters/ReportBranch'
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
        - name: platform
          in: query
          required: false
          schema:
            type: string
            enum: [grabfood, shopeefood]
      responses:
        '200':
          description: One page of rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformReportRows'
  /api/v3/admin/pos/einvoice_settings:
    get:
      operationId: posEinvoiceSettings
      description: >
        Which e-invoice the store issues, the providers it may pick (only those
        with an adapter), and its settings rows (store default first, then
        branch rows). Credentials are never returned, only which fields are
        set. Store administration (`write_pos_topology`) only.
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/EinvoiceSettings'
    put:
      operationId: posEinvoiceSettingsSave
      description: >
        Sets the store's e-invoice type and/or one settings row: the store
        default (no `branch_id`) or a branch's own row (`status: disabled`
        makes the branch use the default). `setting.credentials` replaces the
        stored credentials when present and is write-only. Issuing (`einvoice_type`
        other than `none`) needs an active store default.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                einvoice_type:
                  type: string
                  enum: [none, cash_register, coded]
                branch_id:
                  type: string
                setting:
                  $ref: '#/components/schemas/EinvoiceSettingInput'
      responses:
        '200':
          description: Settings after the change
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/EinvoiceSettings'
        '409':
          description: >
            Refused; `error.details.reason` is `einvoice_provider_unknown`,
            `einvoice_setting_invalid` (with `details.field`), `einvoice_type_invalid`,
            `einvoice_not_configured` or `store_profile_required`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/einvoice_settings/test:
    post:
      operationId: posEinvoiceSample
      description: >
        Issues one made-up invoice through a sandbox provider with the store
        default (or `branch_id`'s) settings and saves nothing. Refused for a
        real provider (`einvoice_sample_sandbox_only`).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                branch_id:
                  type: string
      responses:
        '200':
          description: What the provider answered
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/EinvoiceSample'
        '409':
          description: Refused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/einvoices:
    get:
      operationId: posEinvoices
      description: >
        E-invoices of completed orders, newest first, at the branches where the
        person has `pos.einvoice.manage` (every branch for POS administration).
        `status=outstanding` lists orders without an issued invoice yet
        (pending, issuing, failed).
      parameters:
        - name: branch_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [outstanding, pending, issuing, issued, failed, canceled, replaced, adjusted]
        - name: q
          in: query
          description: Part of the order number
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: One page of invoices
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Einvoice'
                  meta:
                    type: object
  /api/v3/admin/pos/einvoices/summary:
    get:
      operationId: posEinvoiceSummary
      description: >
        Invoices still waiting, by status, and the store's turnover of the
        year so far against the 1 billion VND mark (`level` is `warning` from
        80% and `reached` from 100%).
      parameters:
        - name: branch_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/EinvoiceSummary'
  /api/v3/admin/pos/einvoices/retry:
    post:
      operationId: posEinvoiceRetry
      description: >
        Queues `ids` (up to 100), or every failed invoice of `branch_id`, for
        an immediate try. Invoices that are not pending or failed are skipped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  maxItems: 100
                  items:
                    type: string
                branch_id:
                  type: string
      responses:
        '200':
          description: What was queued
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [queued, skipped]
                    properties:
                      queued:
                        type: array
                        items:
                          type: string
                      skipped:
                        type: integer
  /api/v3/admin/pos/einvoices/{id}:
    get:
      operationId: posEinvoice
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The invoice
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Einvoice'
  /api/v3/admin/pos/einvoices/{id}/buyer:
    put:
      operationId: posEinvoiceBuyer
      description: >
        Sets the buyer an invoice that has not gone to the provider will carry
        (empty: a sale to a consumer). A failed invoice is queued again.
        Refused with `einvoice_already_issued` once issued: request a replacement.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [buyer]
              properties:
                buyer:
                  $ref: '#/components/schemas/EinvoiceBuyer'
      responses:
        '200':
          description: The invoice
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Einvoice'
        '409':
          description: >
            Refused; `error.details.reason` is `einvoice_buyer_invalid` (with
            `details.field`), `einvoice_issuing` or `einvoice_already_issued`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/einvoices/{id}/cancel:
    post:
      operationId: posEinvoiceCancel
      description: Stops an invoice that never reached the provider. An issued invoice is replaced instead.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  maxLength: 200
      responses:
        '200':
          description: The cancelled invoice
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Einvoice'
        '409':
          description: Refused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/einvoices/{id}/replace:
    post:
      operationId: posEinvoiceReplace
      description: >
        Requests a replacement of an issued invoice with a new buyer, for
        example company details the buyer asked for later. The replacement is
        issued through the queue; the original becomes `replaced` then.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [buyer, reason]
              properties:
                buyer:
                  $ref: '#/components/schemas/EinvoiceBuyer'
                reason:
                  type: string
                  maxLength: 200
      responses:
        '201':
          description: The replacement invoice
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Einvoice'
        '409':
          description: >
            Refused; `error.details.reason` is `einvoice_not_issued`,
            `einvoice_replacement_pending`, `einvoice_reason_required` or `einvoice_buyer_invalid`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/approvals:
    post:
      operationId: posApprovalCreate
      description: >
        An approver grants one action. With `workspace_id` it is bound to an
        order's revision (`buffet.override_round` lets a buffet round past
        its limits); with `reservation_id` to a booking's revision, for
        `reservation.refund_deposit` or `reservation.forfeit_deposit` and
        the deposit's `amount`.
      responses:
        '201':
          description: Approval
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Approval'
  /api/v3/admin/pos/reservations:
    get:
      operationId: posReservationList
      description: >
        A branch's bookings overlapping a day (`date`, the branch's day,
        today by default) or a window (`from`, `to`, at most 31 days).
        Needs `fnb.reservations` to book; reading is for the branch's staff.
      parameters:
        - $ref: '#/components/parameters/ReportBranch'
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: status
          in: query
          schema:
            type: array
            items:
              type: string
              enum: [booked, seated, completed, no_show, canceled]
      responses:
        '200':
          description: The bookings, earliest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationList'
    post:
      operationId: posReservationCreate
      description: >
        Books tables for a party; `pos.reservation.manage`. A table already
        held for an overlapping time is refused.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationInput'
      responses:
        '201':
          description: The booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResult'
        '409':
          description: >
            Refused; `error.details.reason` is `reservation_overlap` (with
            `resource_ids`), `reservation_capacity`, `reservation_time_invalid`,
            `reservation_invalid`, `reservation_resources_invalid`,
            `table_archived` or `module_disabled`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/reservations/availability:
    get:
      operationId: posReservationAvailability
      description: >
        Tables free for a party at a time: active, available, seating the
        party (unknown capacity last) and held by no overlapping booking;
        smallest that fits first. The end defaults to the branch's booking
        length.
      parameters:
        - $ref: '#/components/parameters/ReportBranch'
        - name: starts_at
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: ends_at
          in: query
          schema:
            type: string
            format: date-time
        - name: party_size
          in: query
          schema:
            type: integer
            minimum: 1
        - name: except_id
          in: query
          description: A booking being changed keeps its own tables.
          schema:
            type: string
      responses:
        '200':
          description: The free tables
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationAvailabilityResult'
  /api/v3/admin/pos/reservations/{id}:
    get:
      operationId: posReservationShow
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResult'
  /api/v3/admin/pos/reservations/{id}/seat:
    post:
      operationId: posReservationSeat
      description: >
        The party arrived: opens a dine-in order on the booking's first
        table, as any table opening, and the booking becomes seated. Its
        deposits are taken off the bill when the order is paid.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationSeatInput'
      responses:
        '201':
          description: The booking and its order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationSeatResult'
        '409':
          description: >
            Refused; `error.details.reason` is `reservation_not_booked`,
            `table_unavailable` or `module_disabled`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/reservations/{id}/cancel:
    post:
      operationId: posReservationCancel
      description: >
        Ends a waiting booking: `canceled` (default) or `no_show`. Its tables
        are let go; deposits stay held until refunded or kept.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationCancelInput'
      responses:
        '200':
          description: The booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResult'
        '409':
          description: Refused; `error.details.reason` is `reservation_not_booked`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/reservations/deposits/{deposit_id}/refund:
    post:
      operationId: posReservationDepositRefund
      description: >
        Gives a deposit back to the guest as a payout from what is left on its
        receipt. Needs an approval (`reservation.refund_deposit`) unless the
        person may grant one.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/DepositId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationDepositResolveInput'
      responses:
        '200':
          description: The booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResult'
        '409':
          description: >
            Refused; `error.details.reason` is `approval_required`,
            `deposit_settled` or `module_disabled`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/reservations/deposits/{deposit_id}/forfeit:
    post:
      operationId: posReservationDepositForfeit
      description: >
        Keeps the deposit of a canceled or no-show booking as a taxed
        holding-fee sale. Needs an approval (`reservation.forfeit_deposit`)
        unless the person may grant one.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/DepositId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationDepositResolveInput'
      responses:
        '200':
          description: The booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResult'
        '409':
          description: >
            Refused; `error.details.reason` is `approval_required`,
            `reservation_not_ended`, `reservation_fee_product_missing`,
            `deposit_settled` or `module_disabled`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/buffet_tiers:
    get:
      operationId: posBuffetTierList
      description: The active buffet tiers of a branch (`status=all` for archived ones too).
      parameters:
        - $ref: '#/components/parameters/ReportBranch'
        - name: status
          in: query
          schema:
            type: string
            enum: [all]
      responses:
        '200':
          description: The tiers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuffetTierList'
  /api/v3/admin/pos/workspaces/{workspace_id}/courses/{course}/fire:
    post:
      operationId: posCourseFire
      description: >
        "Fire" a held course of a table order: its held dishes go to the
        kitchen as any send, only the difference. The same key fires once.
        Whoever serves the order or `pos.expo.operate`.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/CourseNumber'
      responses:
        '201':
          description: The order, with the tickets in `meta`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KitchenSendResult'
        '200':
          description: Nothing new reached the kitchen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KitchenSendResult'
        '409':
          description: >
            Refused; `error.details.reason` is `course_not_held`,
            `course_invalid`, `buffet_round_limit` or `module_disabled`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/pos_device/kitchen/workspaces/{workspace_id}/courses/{course}/fire:
    post:
      operationId: posDeviceCourseFire
      description: The pass screen fires a held course; the same as posCourseFire, by the screen.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/CourseNumber'
      responses:
        '200':
          description: The order, with the tickets in `meta`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KitchenSendResult'
        '409':
          $ref: '#/components/responses/KitchenRefused'
  /api/v3/pos_device/pair:
    post:
      operationId: posDevicePair
      description: >
        Exchanges a single-use pairing code. Unauthenticated and rate limited
        per client address; an unknown or expired code answers 404
        `pairing_invalid`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, platform, name]
              properties:
                code:
                  type: string
                platform:
                  type: string
                  enum: [android, ios, web]
                name:
                  type: string
                  maxLength: 80
                app_version:
                  type: string
      responses:
        '201':
          description: Device token, shown once
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/DevicePairResult'
        '404':
          description: The code is invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many attempts from this address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/pos_device/me:
    get:
      operationId: posDeviceMe
      responses:
        '200':
          description: Paired device
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/DeviceSession'
  /api/v3/pos_device/staff:
    get:
      operationId: posDeviceStaff
      responses:
        '200':
          description: Names at the branch
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeviceStaffMember'
  /api/v3/pos_device/staff_sessions:
    post:
      operationId: posDeviceStaffSignIn
      description: >
        Five wrong PINs in 15 minutes lock that person on this device (429
        `pin_locked`); the device as a whole has a cap (429 `pin_rate_limited`).
        A wrong PIN answers 401 `pin_incorrect`, a person without a PIN 401
        `pin_not_set`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [membership_id, pin]
              properties:
                membership_id:
                  type: string
                pin:
                  type: string
      responses:
        '201':
          description: Staff session token, shown once
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/DeviceStaffSignIn'
        '401':
          description: Refused; `error.code` says why
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Locked; `error.code` says why
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: posDeviceStaffSignOut
      responses:
        '204':
          description: Signed out
  /api/v3/admin/pos/printers:
    get:
      operationId: posPrinters
      parameters:
        - name: branch_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Printers of the branch
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Printer'
    post:
      operationId: posPrinterCreate
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch_id, name, connection]
              properties:
                branch_id:
                  type: string
                name:
                  type: string
                  maxLength: 80
                connection:
                  type: string
                  enum: [escpos_lan, escpos_bluetooth, sunmi_builtin, epson_epos, star_webprnt, browser]
                address:
                  type: [string, 'null']
                  description: Host or IP with an optional port; no scheme or path.
                bluetooth_id:
                  type: [string, 'null']
                paper:
                  type: string
                  enum: [58mm, 80mm]
                command_language:
                  type: string
                  enum: [escpos, tspl]
                roles:
                  type: array
                  items:
                    type: string
                print_station_device_id:
                  type: [string, 'null']
                register_id:
                  type: [string, 'null']
                status:
                  type: string
                  enum: [active, disabled]
                settings:
                  type: object
      responses:
        '201':
          description: The new printer
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Printer'
  /api/v3/admin/pos/printers/stations:
    get:
      operationId: posPrinterStations
      parameters:
        - name: branch_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Active print station devices of the branch
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      properties:
                        id:
                          type: string
                        name:
                          type: string
  /api/v3/admin/pos/printers/{id}:
    patch:
      operationId: posPrinterUpdate
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 80
                connection:
                  type: string
                  enum: [escpos_lan, escpos_bluetooth, sunmi_builtin, epson_epos, star_webprnt, browser]
                address:
                  type: [string, 'null']
                  description: Host or IP with an optional port; no scheme or path.
                bluetooth_id:
                  type: [string, 'null']
                paper:
                  type: string
                  enum: [58mm, 80mm]
                command_language:
                  type: string
                  enum: [escpos, tspl]
                roles:
                  type: array
                  items:
                    type: string
                print_station_device_id:
                  type: [string, 'null']
                register_id:
                  type: [string, 'null']
                status:
                  type: string
                  enum: [active, disabled]
                settings:
                  type: object
      responses:
        '200':
          description: The changed printer
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Printer'
    delete:
      operationId: posPrinterDelete
      description: Refused with `printer_in_use` once the printer has print jobs; disable it instead.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 200
      responses:
        '200':
          description: The removed printer id
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id]
                    properties:
                      id:
                        type: string
        '409':
          description: Refused; `error.details.reason` says why
  /api/v3/admin/pos/printers/{id}/test:
    post:
      operationId: posPrinterTest
      description: >
        A print station printer gets a queued test job. A printer the browser
        drives gets the test document back, to print from the browser.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 200
      responses:
        '200':
          description: The test job or document
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [print_job, document]
                    properties:
                      print_job:
                        oneOf:
                          - $ref: '#/components/schemas/PrintJob'
                          - type: 'null'
                      document:
                        oneOf:
                          - $ref: '#/components/schemas/PrintDocument'
                          - type: 'null'
        '409':
          description: Refused; `error.details.reason` says why
  /api/v3/admin/pos/print_jobs:
    get:
      operationId: posPrintJobs
      parameters:
        - name: branch_id
          in: query
          required: true
          schema:
            type: string
        - name: status
          in: query
          description: Comma-separated statuses
          schema:
            type: string
      responses:
        '200':
          description: The print queue of the branch, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PrintJob'
    post:
      operationId: posPrintJobCreate
      description: >
        Queues a receipt (recording its print) or a pre-bill. A pre-bill of a
        revision already issued is refused with `prebill_already_printed`.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, printer_id]
              properties:
                kind:
                  type: string
                  enum: [receipt, prebill]
                printer_id:
                  type: string
                receipt_id:
                  type: string
                workspace_id:
                  type: string
                receipt_template_id:
                  type: string
                template_version:
                  type: string
                paper:
                  type: string
      responses:
        '201':
          description: The queued job
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PrintJobResult'
        '409':
          description: Refused; `error.details.reason` says why
  /api/v3/admin/pos/print_jobs/prebills:
    get:
      operationId: posPrintJobPrebills
      parameters:
        - name: branch_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The latest printed pre-bill of each open order, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PrintJob'
  /api/v3/admin/pos/print_jobs/{id}/reprint:
    post:
      operationId: posPrintJobReprint
      description: >
        A new job for the same document. A pre-bill needs an approval for
        `workspace.reprint_prebill` bound to the workspace and its revision,
        and answers `approval_required` without one.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                approval_id:
                  type: string
      responses:
        '201':
          description: The new job
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PrintJobResult'
        '409':
          description: Refused; `error.details.reason` says why
  /api/v3/admin/pos/print_jobs/{id}/cancel:
    post:
      operationId: posPrintJobCancel
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 200
      responses:
        '200':
          description: The canceled job
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PrintJob'
        '409':
          description: Refused; `error.details.reason` says why
  /api/v3/admin/pos/receipts/{id}/prints/{print_id}/void:
    post:
      operationId: posReceiptPrintVoid
      description: >
        Takes back the caller's latest print recorded for a LAN printer, when
        delivery certainly failed, so it does not count as printed.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: print_id
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [mixed_content, no_address, printer_error, not_sent]
      responses:
        '200':
          description: The voided print
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [print, receipt]
                    properties:
                      print:
                        type: object
                      receipt:
                        type: object
        '409':
          description: Refused; `error.details.reason` says why
  /api/v3/pos_device/print_jobs/claim:
    post:
      operationId: posDevicePrintClaim
      description: >
        The next job of a printer bound to this print station, or null. A
        printer has one job out at a time, in id order. Printing is
        at-least-once: deliver the report of an attempt before claiming again,
        because an attempt whose lease ran out and whose job was claimed again
        can no longer be reported.
      responses:
        '200':
          description: A claimed job or null
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/PrintJobClaim'
                      - type: 'null'
  /api/v3/pos_device/print_jobs/{id}/report:
    post:
      operationId: posDevicePrintReport
      parameters:
        - $ref: '#/components/parameters/Id'
      description: >
        How one attempt ended. Repeating the same report is safe. A report for
        an attempt that is no longer current answers `print_claim_stale`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attempt, status]
              properties:
                attempt:
                  type: integer
                  minimum: 1
                status:
                  type: string
                  enum: [printed, failed]
                error:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: The job after the report
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PrintJob'
        '409':
          description: Refused; `error.details.reason` says why
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/kitchen_stations:
    get:
      operationId: posKitchenStations
      description: The kitchen and bar stations of a branch.
      parameters:
        - $ref: '#/components/parameters/ReportBranch'
      responses:
        '200':
          description: Stations by position
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KitchenStationList'
    post:
      operationId: posKitchenStationCreate
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
      description: Adds a station. Needs `pos.kitchen.manage` and `fnb.kitchen` on at the branch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/KitchenStationInput'
                - type: object
                  required: [branch_id, name]
                  properties:
                    branch_id:
                      type: string
      responses:
        '201':
          description: The station
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KitchenStationResult'
        '409':
          description: Refused; `error.details.reason` says why
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/kitchen_stations/{id}:
    patch:
      operationId: posKitchenStationUpdate
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/Id'
      description: Changes a station. Naming a default clears the previous default of the branch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KitchenStationInput'
      responses:
        '200':
          description: The station
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KitchenStationResult'
    delete:
      operationId: posKitchenStationDestroy
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/Id'
      description: Removes a station without tickets; one with tickets answers `kitchen_station_in_use` (switch it off instead).
      responses:
        '200':
          description: Removed
        '409':
          description: Refused; `error.details.reason` says why
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/station_routes:
    get:
      operationId: posStationRoutes
      description: Which station makes what at a branch.
      parameters:
        - $ref: '#/components/parameters/ReportBranch'
      responses:
        '200':
          description: Routes
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StationRoute'
    post:
      operationId: posStationRouteCreate
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
      description: >
        Sends a product, or every menu item of a kitchen category, to a station,
        for one service mode or (without one) every mode. One of `product_id` and
        `kitchen_category`. A second route for the same target and mode answers
        `station_route_taken`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/StationRouteInput'
                - type: object
                  required: [branch_id, kitchen_station_id]
                  properties:
                    branch_id:
                      type: string
      responses:
        '201':
          description: The route
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/StationRoute'
        '409':
          description: Refused; `error.details.reason` says why
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/station_routes/{id}:
    patch:
      operationId: posStationRouteUpdate
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StationRouteInput'
      responses:
        '200':
          description: The route
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/StationRoute'
    delete:
      operationId: posStationRouteDestroy
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Removed
  /api/v3/admin/pos/hardware_status:
    get:
      operationId: posHardwareStatus
      description: >
        The hardware checklist of a branch, read from what the server knows:
        printers whose latest job printed, kitchen stations with a screen or
        a printer, print stations seen in the last minutes, paired customer
        displays, the server address and work waiting for the internet, and
        the e-invoice settings. Needs `read_pos_topology`, or
        `pos.topology.manage` at the branch.
      parameters:
        - $ref: '#/components/parameters/ReportBranch'
      responses:
        '200':
          description: The checklist
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/HardwareStatus'
  /api/v3/admin/pos/kitchen_settings:
    get:
      operationId: posKitchenSettings
      parameters:
        - $ref: '#/components/parameters/ReportBranch'
      responses:
        '200':
          description: When the branch sends orders to the kitchen
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/KitchenSettings'
    put:
      operationId: posKitchenSettingsUpdate
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: One change per call; `void_reasons` when sent, else `kitchen_send_trigger`.
              required: [branch_id]
              properties:
                branch_id:
                  type: string
                kitchen_send_trigger:
                  type: string
                  enum: [on_complete, manual]
                void_reasons:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    pattern: '^[a-z0-9_]{1,40}$'
      responses:
        '200':
          description: The settings
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/KitchenSettings'
  /api/v3/admin/pos/kitchen/board:
    get:
      operationId: posKitchenBoard
      description: >
        Open tickets of a station (late first, then oldest), those finished
        in the last 30 minutes, the open items by dish and the ready items at
        the pass. Without `station_id` or `station_ids`, every station of
        the branch. Needs `pos.kitchen.operate`; a kitchen screen uses
        /pos_device/kitchen/board.
      parameters:
        - $ref: '#/components/parameters/ReportBranch'
        - name: station_id
          in: query
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/KitchenStationIds'
        - $ref: '#/components/parameters/KitchenServiceMode'
      responses:
        '200':
          description: The board
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KitchenBoardResult'
  /api/v3/admin/pos/kitchen/items/{id}/start:
    post:
      operationId: posKitchenItemStart
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/KitchenTicketChanged'
        '409':
          $ref: '#/components/responses/KitchenRefused'
  /api/v3/admin/pos/kitchen/items/{id}/ready:
    post:
      operationId: posKitchenItemReady
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/KitchenTicketChanged'
        '409':
          $ref: '#/components/responses/KitchenRefused'
  /api/v3/admin/pos/kitchen/items/{id}/serve:
    post:
      operationId: posKitchenItemServe
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/KitchenTicketChanged'
        '409':
          $ref: '#/components/responses/KitchenRefused'
  /api/v3/admin/pos/kitchen/items/{id}/recall:
    post:
      operationId: posKitchenItemRecall
      description: >
        A ready or served item back to preparing, within 30 minutes of being
        ready or served; counted on the item and audited.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/KitchenTicketChanged'
        '409':
          $ref: '#/components/responses/KitchenRefused'
  /api/v3/admin/pos/kitchen/tickets/{id}/bump:
    post:
      operationId: posKitchenTicketBump
      description: Every new or preparing item of the ticket becomes ready.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/KitchenTicketChanged'
  /api/v3/admin/pos/kitchen/all_day/bump:
    post:
      operationId: posKitchenAllDayBump
      description: >
        One dish on the "by dish" tab (`key` of a KitchenAllDayRow): its
        oldest open items at the stations become ready, first sent first,
        until `quantity` units are covered. Answers the tickets that moved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KitchenAllDayBumpInput'
      responses:
        '200':
          description: The tickets that moved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KitchenTicketList'
        '409':
          $ref: '#/components/responses/KitchenRefused'
  /api/v3/admin/pos/kitchen/orders:
    get:
      operationId: posKitchenOrders
      description: >
        The counter's pickup queue: call numbers of today's business date still
        being made, and those ready to hand over (newest first). Needs
        `pos.kitchen.operate` or the cashier's `pos.payment.collect`.
      parameters:
        - $ref: '#/components/parameters/ReportBranch'
      responses:
        '200':
          description: The queue
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/CallBoard'
  /api/v3/admin/pos/kitchen/orders/{workspace_id}/serve:
    post:
      operationId: posKitchenOrderServe
      description: >
        "Handed over": every ready item of the order becomes served and its
        call number leaves the board. Repeating it changes nothing.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          $ref: '#/components/responses/KitchenOrderServed'
  /api/v3/admin/pos/cup_label_settings:
    get:
      operationId: posCupLabelSettings
      parameters:
        - $ref: '#/components/parameters/ReportBranch'
      responses:
        '200':
          description: The branch's cup label setup
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/CupLabelSettings'
    put:
      operationId: posCupLabelSettingsUpdate
      description: Fields left out keep their value; a blank `printer_id` removes the printer.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch_id]
              properties:
                branch_id:
                  type: string
                printer_id:
                  type: [string, 'null']
                size:
                  type: string
                  enum: ['40x30', '50x30', '58x40']
                fields:
                  type: array
                  items:
                    type: string
                    enum: [call_number, options, note, guest_name, time, store_name]
                pickup_minutes:
                  type: integer
                  minimum: 1
                  maximum: 120
      responses:
        '200':
          description: The settings
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/CupLabelSettings'
        '409':
          description: Refused; `error.details.reason` is `cup_label_settings_invalid` or `printer_not_queued`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/cup_label_settings/test:
    post:
      operationId: posCupLabelTest
      description: A sample label on the branch's cup label printer.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch_id]
              properties:
                branch_id:
                  type: string
      responses:
        '201':
          description: The queued job
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PrintJob'
        '409':
          description: Refused; `error.details.reason` is `cup_label_printer_missing` or a printer reason
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/platform_orders:
    get:
      operationId: posPlatformOrders
      description: >
        Delivery platform orders of a branch. `open` (the default) lists
        accepted and ready orders oldest first for the counter; the others
        list newest first. Dates are the sale's business date, both ends
        included.
      parameters:
        - $ref: '#/components/parameters/ReportBranch'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, completed, canceled, unsettled]
        - name: platform
          in: query
          required: false
          schema:
            type: string
            enum: [grabfood, shopeefood]
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: One page of orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformOrderList'
        '422':
          description: An unknown filter value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: posPlatformOrderEnter
      description: >
        Enters a platform order read off the platform's tablet: a delivery
        sale on the cashier's open shift with the platform as its order
        source, menu lines only, each at the platform's price when given
        (audited as a price override with the reason `platform_price`). It
        gets its call number and goes to the kitchen at once. Needs
        `fnb.delivery_platforms` and the platform turned on at the branch.
        One order per platform code at a branch.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformOrderInput'
      responses:
        '201':
          description: The order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformOrderResult'
        '409':
          description: >
            Refused; `error.details.reason` is `platform_disabled`,
            `platform_order_duplicate` (with `platform_order_id`),
            `platform_item_not_menu`, `platform_price_invalid`,
            `platform_order_ref_invalid`, `platform_order_empty`,
            `module_disabled` or a workspace reason
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/platform_orders/{id}/ready:
    post:
      operationId: posPlatformOrderReady
      description: >
        Marks the order ready for the driver by hand. The kitchen marks it
        ready by itself when its last item is ready; a second tap changes
        nothing.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformOrderResult'
        '409':
          description: Refused; `error.details.reason` is `platform_order_completed` or `platform_order_canceled`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/platform_orders/{id}/complete:
    post:
      operationId: posPlatformOrderComplete
      description: >
        The driver took the order. The sale is paid with one
        `platform_receivable` tender for its total (received funds with the
        platform order as evidence, no drawer movement) and completed, which
        issues the receipt. Shift owner with `pos.payment.collect`.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformOrderEditor'
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformOrderResult'
        '409':
          description: Refused; `error.details.reason` is `platform_order_completed`, `platform_order_canceled` or a tender reason
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/platform_orders/{id}/cancel:
    post:
      operationId: posPlatformOrderCancel
      description: >
        The platform canceled the order. Items the kitchen still has are
        voided with the reason `platform_canceled`, which needs an approval
        (`approval_id`) or a cashier with `pos.approve`; then the sale is
        canceled.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformOrderCancelInput'
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformOrderResult'
        '409':
          description: >
            Refused; `error.details.reason` is `approval_required`,
            `platform_order_completed` or `platform_order_canceled`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/platform_orders/settle:
    post:
      operationId: posPlatformOrdersSettle
      description: >
        Records that the platform paid for completed orders, with the
        commission it actually kept where it differs from the estimate. Only
        the platform orders change; the sales and their receipts do not.
        Store administration or `pos.discrepancy.resolve`.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformSettleInput'
      responses:
        '200':
          description: The settled orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformOrderSettled'
        '409':
          description: >
            Refused; `error.details.reason` is `platform_order_open`,
            `platform_order_settled`, `platform_commission_invalid` or
            `platform_settle_empty`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/platform_settings:
    get:
      operationId: posPlatformSettings
      parameters:
        - $ref: '#/components/parameters/ReportBranch'
      responses:
        '200':
          description: Every platform of the branch, configured or not
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformSettingsResult'
    put:
      operationId: posPlatformSettingUpdate
      description: >
        Turns one platform on or off at the branch and sets the percent it
        keeps. Entered orders keep the rate they were entered with. Turning
        one on needs `fnb.delivery_platforms`. Audited as
        `platform_setting.change`.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformSettingInput'
      responses:
        '200':
          description: The platform's setting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformSettingResult'
        '409':
          description: Refused; `error.details.reason` is `platform_invalid`, `platform_rate_invalid` or `module_disabled`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/workspaces/{workspace_id}/guest_name:
    post:
      operationId: posWorkspaceGuestName
      description: >
        The name called out with the call number. Same editor rules as the
        order source; it moves no money, so it can change while a payment is
        under way. Blank clears it. Needs `fnb.order_number` or `fnb.cup_label`.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_revision, lease_generation, editor_id, guest_name]
              properties:
                expected_revision:
                  type: integer
                lease_generation:
                  type: integer
                editor_id:
                  type: string
                guest_name:
                  type: [string, 'null']
                  maxLength: 60
      responses:
        '200':
          description: The workspace
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Workspace'
        '409':
          description: Refused; `error.details.reason` says why
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/workspaces/{workspace_id}/cup_labels:
    post:
      operationId: posWorkspaceCupLabelsReprint
      description: >
        Prints the cup labels of one line (`sale_line_id`), or of the whole
        order, again: only cups that already had a label. Needs
        `pos.payment.collect`; audited as `cup_label.reprint`.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sale_line_id:
                  type: string
      responses:
        '201':
          description: The queued jobs, one per cup
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [jobs]
                    properties:
                      jobs:
                        type: array
                        items:
                          $ref: '#/components/schemas/PrintJob'
        '409':
          description: >
            Refused; `error.details.reason` is `cup_label_printer_missing`,
            `cup_label_nothing`, `workspace_canceled` or a printer reason
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/workspaces/{workspace_id}/kitchen_sends:
    post:
      operationId: posKitchenSend
      description: >
        "Send to kitchen": one ticket per station for the part of every menu
        line not sent yet, recorded as one numbered send. A table order
        (`fnb.tables`) is sent by anyone who may edit it, without a lease or
        revision, even once a payment locked its lines; other orders follow
        the usual editor rules. The same key
        again answers the same send. Answers the workspace, with the tickets
        of this send in `meta.tickets`; 200 with `ticket_count` 0 when
        nothing was left to send.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KitchenSendInput'
      responses:
        '201':
          description: The workspace after the send
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KitchenSendResult'
        '200':
          description: Nothing was left to send
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KitchenSendResult'
        '409':
          description: Refused; `error.details.reason` says why
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/workspaces/{workspace_id}/kitchen_tickets:
    get:
      operationId: posWorkspaceKitchenTickets
      description: What the kitchen was told about an order, send by send.
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tickets by sequence
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/KitchenTicket'
  /api/v3/admin/pos/workspaces/{workspace_id}/kitchen_history:
    get:
      operationId: posWorkspaceKitchenHistory
      description: >
        An order's kitchen history, oldest first: every send (when, who,
        which items to which station) and every void (when, who, what came
        back, the reason, who approved it, whether it was waste).
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: The history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KitchenHistoryResult'
  /api/v3/admin/pos/workspaces/{workspace_id}/items/append:
    post:
      operationId: posWorkspaceAppendItems
      description: >
        Adds one batch of items to a table order (`fnb.tables`) without a
        lease or revision, so several waiters and the cashier add at once.
        Needs `pos.table.serve` or the order's shift. A batch writes new
        lines; an item joins only an unsent line of the same batch. Refused
        once a payment locked the order: further items go to another order of
        the table (`tables/{resource_id}/open` with `add_order`).
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppendItemsInput'
      responses:
        '200':
          description: The order, with the lines of the batch in `meta`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppendItemsResult'
        '409':
          description: >
            Refused; `error.details.reason` is `not_table_order`,
            `module_disabled`, `workspace_closed`, `snapshot_locked`,
            `append_items_invalid` or a menu reason such as `menu_sold_out`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/workspaces/{workspace_id}/sale_lines/{id}:
    patch:
      operationId: posWorkspaceEditUnsentLine
      description: >
        Changes the quantity of a table order's line the kitchen has not been
        told about, without a lease, checked against the line's
        `row_version`.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/WorkspaceId'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditUnsentLineInput'
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResult'
        '409':
          description: >
            Refused; `error.details.reason` is `line_changed` (with the line
            as it is now in `error.details.sale_line`), `line_sent` (void the
            sent part instead), `not_table_order`, `module_disabled` or
            `snapshot_locked`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: posWorkspaceRemoveUnsentLine
      description: >
        Takes a table order's line the kitchen has not been told about off
        the order, without a lease, checked against its `row_version`.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/WorkspaceId'
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: row_version
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResult'
        '409':
          description: Refused; the same reasons as the edit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/workspaces/{workspace_id}/sale_lines/{sale_line_id}/kitchen_voids:
    post:
      operationId: posKitchenVoid
      description: >
        Takes back part of a line the kitchen was told about. Needs a reason
        from the branch's `void_reasons` (or `khac` with a note) and, unless
        the person has `pos.kitchen.void`, an approval of `kitchen.void_sent`
        for the order at its current revision. The line and its sent
        quantity go down together; the station gets a `void` ticket and its
        printer a `void_ticket` job. An item the kitchen had made is marked
        `wasted`; nothing goes back to stock. A table order needs no lease;
        other orders send the editor fields.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/WorkspaceId'
        - name: sale_line_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KitchenVoidInput'
      responses:
        '201':
          description: The order, with the void in `meta`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KitchenVoidResult'
        '409':
          description: >
            Refused; `error.details.reason` is `approval_required` (with
            `details.action` `kitchen.void_sent`), `void_reason_invalid`, `void_note_required`,
            `void_quantity_invalid`, `snapshot_locked` or `lease_stale`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/pos_device/kitchen/stations:
    get:
      operationId: posDeviceKitchenStations
      description: Active stations of the screen's branch. Device modes `kds` and `expo`.
      responses:
        '200':
          description: Stations by position
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KitchenStationList'
  /api/v3/pos_device/kitchen/station:
    put:
      operationId: posDeviceKitchenSelectStation
      description: The station this screen shows; blank or absent `station_id` for every station.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                station_id:
                  type: [string, 'null']
      responses:
        '200':
          description: The device
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Device'
  /api/v3/pos_device/kitchen/board:
    get:
      operationId: posDeviceKitchenBoard
      description: >
        The board of the screen's station (or `station_id`; empty for every
        station; `station_ids` for several). Poll it when the socket is down.
      parameters:
        - name: station_id
          in: query
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/KitchenStationIds'
        - $ref: '#/components/parameters/KitchenServiceMode'
      responses:
        '200':
          description: The board
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KitchenBoardResult'
  /api/v3/pos_device/kitchen/menu_items:
    get:
      operationId: posDeviceKitchenMenuItems
      description: >
        Menu items the station makes and whether each is sold out today. Marking
        one sold out names a person: PUT /admin/pos/menu_availabilities with a
        staff session on the device.
      parameters:
        - name: station_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Items
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/KitchenMenuItem'
  /api/v3/pos_device/kitchen/items/{id}/start:
    post:
      operationId: posDeviceKitchenItemStart
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/KitchenTicketChanged'
        '409':
          $ref: '#/components/responses/KitchenRefused'
  /api/v3/pos_device/kitchen/items/{id}/ready:
    post:
      operationId: posDeviceKitchenItemReady
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/KitchenTicketChanged'
        '409':
          $ref: '#/components/responses/KitchenRefused'
  /api/v3/pos_device/kitchen/items/{id}/serve:
    post:
      operationId: posDeviceKitchenItemServe
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/KitchenTicketChanged'
        '409':
          $ref: '#/components/responses/KitchenRefused'
  /api/v3/pos_device/kitchen/items/{id}/recall:
    post:
      operationId: posDeviceKitchenItemRecall
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/KitchenTicketChanged'
        '409':
          $ref: '#/components/responses/KitchenRefused'
  /api/v3/pos_device/kitchen/tickets/{id}/bump:
    post:
      operationId: posDeviceKitchenTicketBump
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/KitchenTicketChanged'
  /api/v3/pos_device/kitchen/all_day/bump:
    post:
      operationId: posDeviceKitchenAllDayBump
      description: >
        The kitchen screen's all-day bump; without `station_ids` the
        screen's own station, or every station.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KitchenAllDayBumpInput'
      responses:
        '200':
          description: The tickets that moved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KitchenTicketList'
        '409':
          $ref: '#/components/responses/KitchenRefused'
  /api/v3/pos_device/kitchen/orders/{workspace_id}/serve:
    post:
      operationId: posDeviceKitchenOrderServe
      description: >
        "Handed over" from the finished tickets: every ready item of the order
        becomes served and its call number leaves the board.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          $ref: '#/components/responses/KitchenOrderServed'
  /api/v3/admin/pos/system_status:
    get:
      operationId: posSystemStatus
      description: >
        Server health for store administrators (`read_pos_topology` or
        `write_pos_topology`). Store-wide counts, ages and timestamps only.
      responses:
        '200':
          description: The server's address, TLS mode and health
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/SystemStatus'
        '403':
          description: Not a store administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/areas:
    get:
      operationId: posAreas
      description: >
        The areas (floors, rooms) of a branch's floor plan, by position.
        Archived ones only with `status=all`. Needs `resources` at the branch.
      parameters:
        - $ref: '#/components/parameters/ReportBranch'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all]
      responses:
        '200':
          description: The areas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaList'
    post:
      operationId: posAreaCreate
      description: Adds an area. Needs `pos.resource.manage` or store topology administration.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AreaInput'
      responses:
        '201':
          description: The area
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaResult'
        '409':
          description: Refused; `error.details.reason` is `module_disabled` or `area_archived`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/areas/{id}:
    patch:
      operationId: posAreaUpdate
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AreaInput'
      responses:
        '200':
          description: The area
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaResult'
        '409':
          description: Refused; `error.details.reason` is `module_disabled` or `area_archived`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/areas/{id}/archive:
    post:
      operationId: posAreaArchive
      description: Archives an area whose tables are all archived.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The area
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaResult'
        '409':
          description: Refused; `error.details.reason` is `area_in_use` or `module_disabled`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/resources:
    get:
      operationId: posResources
      description: >
        The tables (rooms, billiard tables) of a branch's floor plan, by
        position. Archived ones only with `status=all`. Needs `resources`.
      parameters:
        - $ref: '#/components/parameters/ReportBranch'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all]
      responses:
        '200':
          description: The tables
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceList'
    post:
      operationId: posResourceCreate
      description: >
        Adds a table to an area. It must fit inside the area's grid. Needs
        `pos.resource.manage` or store topology administration.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceInput'
      responses:
        '201':
          description: The table
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceResult'
        '409':
          description: >
            Refused; `error.details.reason` is `resource_outside_area`,
            `area_archived`, `table_archived` or `module_disabled`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/resources/{id}:
    patch:
      operationId: posResourceUpdate
      description: Moves, resizes or renames a table; only the fields sent change.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceInput'
      responses:
        '200':
          description: The table
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceResult'
        '409':
          description: >
            Refused; `error.details.reason` is `resource_outside_area`,
            `area_archived`, `table_archived` or `module_disabled`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/resources/{id}/archive:
    post:
      operationId: posResourceArchive
      description: Archives a table without an open order; its name can be used again.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The table
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceResult'
        '409':
          description: Refused; `error.details.reason` is `table_in_use` or `module_disabled`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/resources/{id}/manual_status:
    post:
      operationId: posResourceManualStatus
      description: >
        Marks a table being cleaned, out of service or available again.
        People serving tables and cashiers may do it; out of service only
        without an open order.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceManualStatusInput'
      responses:
        '200':
          description: The table
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceResult'
        '409':
          description: >
            Refused; `error.details.reason` is `manual_status_invalid`,
            `table_archived`, `table_in_use` or `module_disabled`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/resource_board:
    get:
      operationId: posResourceBoard
      description: >
        The live floor of a branch: every active area and table with the
        table's state computed from its open orders. A fixed number of
        queries whatever the number of tables. Refetch on `resource.updated`,
        `workspace.updated` and `payment.requested`.
      parameters:
        - $ref: '#/components/parameters/ReportBranch'
      responses:
        '200':
          description: The floor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceBoardResult'
  /api/v3/admin/pos/table_settings:
    get:
      operationId: posTableSettings
      parameters:
        - $ref: '#/components/parameters/ReportBranch'
      responses:
        '200':
          description: The branch's table service settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableSettingsResult'
    put:
      operationId: posTableSettingsUpdate
      description: >
        The register table orders are booked on and the service charge.
        Only the fields sent change; `null` clears a field. Needs
        `pos.branch.manage` or store topology administration.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableSettingsInput'
      responses:
        '200':
          description: The settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableSettingsResult'
  /api/v3/admin/pos/tables/{resource_id}/open:
    post:
      operationId: posTableOpen
      description: >
        Seats guests: a dine-in draft at the table, booked on the open shift
        of the branch's table register, its lease held by the caller. A
        table has one open order unless `add_order` opens another one beside
        it (lettered A, B…). Needs `fnb.tables` and `pos.table.serve` or
        `pos.shift.open`.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - name: resource_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableOpenInput'
      responses:
        '201':
          description: The new order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResult'
        '409':
          description: >
            Refused; `error.details.reason` is `table_occupied` (with
            `workspace_ids`), `table_unavailable`, `table_archived`,
            `table_register_missing`, `no_open_shift`, `guest_count_invalid`,
            `table_full` or `module_disabled`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/workspaces/{workspace_id}/move:
    post:
      operationId: posTableMove
      description: Moves a table order to another table with its lines, kitchen tickets and shift.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableMoveInput'
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResult'
        '409':
          description: >
            Refused; `error.details.reason` is `same_table`,
            `table_unavailable`, `not_table_order`, `snapshot_locked`,
            `lease_stale` or `module_disabled`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/workspaces/{workspace_id}/merge:
    post:
      operationId: posTableMerge
      description: >
        Moves every line of this table order into another one and cancels
        this one; guest counts add up. Refused while either order is locked
        by a payment or holds a discount.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableMergeInput'
      responses:
        '200':
          description: The order the lines joined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResult'
        '409':
          description: >
            Refused; `error.details.reason` is `snapshot_locked`,
            `discount_present`, `traced_line`, `same_order`,
            `not_table_order`, `workspace_closed`, `lease_stale` or
            `module_disabled`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/workspaces/{workspace_id}/split:
    post:
      operationId: posTableSplit
      description: >
        Moves the chosen lines, whole, to a new order at the same or another
        table, on the same shift. At least one line stays. With `by: seat`,
        every seat's dishes go to a bill of their own at the table.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableSplitInput'
      responses:
        '200':
          description: Both orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableSplitResult'
        '409':
          description: >
            Refused; `error.details.reason` is `split_lines_invalid`,
            `split_seats_invalid`, `split_all_lines`, `discount_present`, `traced_line`,
            `table_unavailable`, `snapshot_locked`, `lease_stale` or
            `module_disabled`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/workspaces/{workspace_id}/prebill:
    post:
      operationId: posPrebill
      description: >
        Records a pre-bill of an open order and answers its print document;
        with `printer_id` it also queues it there. Takes no money and locks
        nothing. The first pre-bill is free; another one needs an approval
        for `workspace.reprint_prebill` bound to the order's revision. Needs
        `fnb.postpay`.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrebillInput'
      responses:
        '201':
          description: The pre-bill
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrebillResult'
        '409':
          description: >
            Refused; `error.details.reason` is `approval_required` (with
            `action`), `workspace_closed` or `module_disabled`, or an
            approval or printer reason
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/workspaces/{workspace_id}/prebill/cancel:
    post:
      operationId: posPrebillCancel
      description: Takes the pre-bill back; needs an approval for `workspace.cancel_prebill`.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrebillInput'
      responses:
        '200':
          description: The canceled pre-bill
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrebillResult'
        '409':
          description: Refused; `error.details.reason` is `approval_required`, `prebill_missing` or `module_disabled`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/workspaces/{workspace_id}/payment_request:
    post:
      operationId: posPaymentRequest
      description: >
        A table asks for the bill: tells the cashiers (`payment.requested`).
        No lease, no money. Asking again while a request is open answers it.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequestInput'
      responses:
        '201':
          description: The order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResult'
        '409':
          description: Refused; `error.details.reason` is `not_table_order`, `note_too_long`, `workspace_closed` or `module_disabled`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/workspaces/{workspace_id}/payment_request/resolve:
    post:
      operationId: posPaymentRequestResolve
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequestResolveInput'
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResult'
        '409':
          description: Refused; `error.details.reason` is `payment_request_status_invalid`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/workspaces/{workspace_id}/service_charge:
    post:
      operationId: posServiceChargeWaive
      description: >
        Takes the service charge off one order (`waived: true`) or puts it
        back. Needs `pos.discount.apply`; audited.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceChargeWaiveInput'
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResult'
        '409':
          description: Refused; `error.details.reason` is `snapshot_locked`, `lease_stale` or `module_disabled`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/workspaces/{id}/lease:
    post:
      operationId: posWorkspaceClaimLease
      description: >
        Takes the editing lease of an order for this screen (`editor_id`),
        as move and merge of a table order need. Whoever may edit the order or
        collect the table may take it; with strict editing locks a lease held
        elsewhere answers 409 `lease_busy`.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaseClaimInput'
      responses:
        '200':
          description: The order, with its lease generation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResult'
        '409':
          description: Refused; `error.details.reason` is `lease_busy` (with `retry_after_seconds`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/workspaces/{workspace_id}/checklist:
    post:
      operationId: posWorkspaceChecklist
      description: >
        The checklist of a table order: each line with how much came out of
        the kitchen and how much is still to come. Answers the print document
        (a waiter's Bluetooth printer prints it); with `printer_id` it is
        also queued there. Changes nothing. Needs `fnb.tables`.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChecklistInput'
      responses:
        '201':
          description: The checklist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistResult'
        '409':
          description: Refused; `error.details.reason` is `not_table_order`, `module_disabled` or a printer reason
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/devices/current/ready_feed:
    get:
      operationId: posDeviceReadyFeed
      description: >
        The waiter device's dishes: items of open table orders that became
        ready or were served in the last 30 minutes, on the tables its person
        added to and the tables it follows; with `area_id` every table of
        that area. Read it on every `kitchen_ticket.updated` and when the
        app opens. Only a `waiter` device signed in by someone with
        `pos.table.serve`.
      parameters:
        - name: area_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The feed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyFeedResult'
        '403':
          description: Not a waiter device (`device_mode_forbidden`) or no `pos.table.serve`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/devices/current/table_pins:
    get:
      operationId: posDeviceTablePins
      description: The tables the waiter device follows, and those its signed-in person serves.
      responses:
        '200':
          description: The tables
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TablePinsResult'
    post:
      operationId: posDeviceTablePin
      description: Follows a table; following it again changes nothing.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TablePinInput'
      responses:
        '200':
          description: The tables
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TablePinsResult'
  /api/v3/admin/pos/devices/current/table_pins/{resource_id}:
    delete:
      operationId: posDeviceTableUnpin
      description: Stops following a table.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - name: resource_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The tables
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TablePinsResult'
  /api/v3/admin/pos/bottle_keeps:
    get:
      operationId: posBottleKeepList
      description: >
        The bottle-keeping book of a branch (`fnb.bottle_keep`): kept bottles
        by default, `status=all` for every one. `q` finds a bottle by its
        label code, the guest's phone or name. At most 50, soonest to expire
        first. For the branch's staff.
      parameters:
        - $ref: '#/components/parameters/ReportBranch'
        - name: status
          in: query
          schema:
            type: string
            enum: [kept, finished, expired, returned, all]
        - name: q
          in: query
          schema:
            type: string
            maxLength: 120
      responses:
        '200':
          description: The bottles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BottleKeepList'
  /api/v3/admin/pos/bottle_keeps/{id}:
    get:
      operationId: posBottleKeepShow
      description: One kept bottle with its whole history.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The bottle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BottleKeepResult'
  /api/v3/admin/pos/bottle_keeps/{id}/pour:
    post:
      operationId: posBottleKeepPour
      description: >
        Pours from a kept bottle: its new level (never above the old one),
        optionally the ml, the order it is drunk at and a new photo. Nothing
        is added to any bill; a level of 0 finishes the bottle. Whoever sells
        or serves tables at the branch.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BottleKeepPourInput'
      responses:
        '200':
          description: The bottle after the pour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BottleKeepResult'
        '409':
          description: >
            Refused; `error.details.reason` is `bottle_level_raised`,
            `bottle_level_invalid`, `bottle_ml_invalid`, `bottle_photo_invalid`,
            `bottle_keep_closed` or `module_disabled`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/bottle_keeps/{id}/label:
    post:
      operationId: posBottleKeepLabel
      description: >
        The bottle's label as a receipt-kind print document (the device's own
        printer prints it); with `printer_id` it is also queued there.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChecklistInput'
      responses:
        '200':
          description: The label
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistResult'
  /api/v3/admin/pos/meal_accounts/resolve:
    get:
      operationId: posMealAccountResolve
      description: >
        Finds a canteen eater (`fnb.meal_accounts`): `q` is an exact employee
        code (any case) or part of a name, which returns at most 8
        suggestions. Only accounts of the current store. Rate limited per
        staff member (429 `meal_resolve_rate_limited`). For the branch's
        cashiers and meal account managers.
      parameters:
        - $ref: '#/components/parameters/ReportBranch'
        - name: q
          in: query
          required: true
          schema:
            type: string
            maxLength: 120
      responses:
        '200':
          description: The match, or suggestions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealResolveResult'
        '429':
          description: Too many lookups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/workspaces/{workspace_id}/meal:
    get:
      operationId: posWorkspaceMeal
      description: The eater recorded on a canteen order and who pays what.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: The meal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMealResult'
  /api/v3/admin/pos/workspaces/{workspace_id}/meal_swipes:
    post:
      operationId: posWorkspaceMealSwipe
      description: >
        Records one meal on the order by employee code (or account id) and
        puts the eater on the order. The server checks the account, a repeat
        within 60 seconds, the meal times and the daily limit under the
        account lock; every attempt is recorded. With `override_limit` (or an
        `approval_id` of `meal_account.override_limit`) a meal-time or limit
        refusal goes through.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealSwipeInput'
      responses:
        '201':
          description: The meal was recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealSwipeResult'
        '409':
          description: >
            Refused; `error.details.reason` is `meal_account_locked`,
            `meal_account_unknown`, `meal_duplicate_swipe`, `meal_daily_limit`,
            `meal_outside_window`, `approval_required` or `module_disabled`,
            and `error.details.result` the recorded result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/workspaces/{workspace_id}/meal_wallet:
    post:
      operationId: posWorkspaceMealWalletPay
      description: >
        Pays the eater's part of the order from their meal wallet: top-up
        receipts are allocated oldest first. `amount` defaults to the eater's
        unpaid part. The sponsor's part is charged as the order completes
        (`meal_sponsor: true` on complete).
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealWalletPayInput'
      responses:
        '200':
          description: The order and the wallet after the payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealWalletPayResult'
        '409':
          description: >
            Refused; `error.details.reason` is `stored_value_insufficient`,
            `meal_account_missing`, `meal_account_locked`,
            `meal_wallet_nothing_due` or `meal_amount_invalid`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/vehicle_visits:
    get:
      operationId: posVehicleVisitList
      description: >
        A rest stop's coach visits at a branch (`fnb.vehicle_commission`),
        newest first. `status` takes one or several of open, closed, paid,
        voided (comma separated); `q` part of a plate. The driver's phone and
        transfer references are masked unless the reader manages visits
        (`pos.vehicle_visit.manage`).
      parameters:
        - $ref: '#/components/parameters/ReportBranch'
        - name: status
          in: query
          schema:
            type: string
        - name: business_date
          in: query
          schema:
            type: string
            format: date
        - name: q
          in: query
          schema:
            type: string
            maxLength: 20
      responses:
        '200':
          description: The visits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleVisitList'
    post:
      operationId: posVehicleVisitOpen
      description: >
        A coach arrived: opens its visit. It closes by itself after the
        branch's visit window. The same plate already open today is allowed
        and answered with the warning `plate_open_today`.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleVisitOpenInput'
      responses:
        '201':
          description: The visit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleVisitResult'
        '409':
          description: >
            Refused; `error.details.reason` is `vehicle_plate_invalid`,
            `vehicle_type_invalid`, `vehicle_guests_invalid`,
            `bus_operator_archived` or `module_disabled`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/vehicle_visits/{id}:
    get:
      operationId: posVehicleVisitShow
      description: One coach visit with its commission snapshot.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The visit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleVisitResult'
    patch:
      operationId: posVehicleVisitUpdate
      description: >
        Changes an open visit: guests, plate, type, operator, driver. A
        closed visit is corrected with `adjust`.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleVisitUpdateInput'
      responses:
        '200':
          description: The visit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleVisitResult'
        '409':
          description: Refused; `error.details.reason` is `vehicle_visit_changed`, `vehicle_visit_closed` or a field reason
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/vehicle_visits/{id}/close:
    post:
      operationId: posVehicleVisitClose
      description: >
        "The coach left": closes the visit and keeps its commission, worked
        out from the rule in force, the guests and the revenue of its
        completed orders. Editing the rule later changes nothing here.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The closed visit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleVisitResult'
  /api/v3/admin/pos/vehicle_visits/{id}/pay:
    post:
      operationId: posVehicleVisitPay
      description: >
        Pays the commission once. `cash` asks for a cash out on the payer's
        own open shift, confirmed by a second person; `transfer` records the
        bank reference. A visit whose cash out was canceled can be paid again.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleVisitPayInput'
      responses:
        '200':
          description: The paid visit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleVisitResult'
        '409':
          description: >
            Refused; `error.details.reason` is `vehicle_visit_paid`,
            `vehicle_visit_open`, `vehicle_commission_zero`, `shift_required`,
            `insufficient_cash`, `transfer_reference_required` or
            `feature_disabled`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/vehicle_visits/{id}/adjust:
    post:
      operationId: posVehicleVisitAdjust
      description: >
        Corrects a closed, unpaid visit's guests (commission worked out again
        with the rule it closed with) or its commission, with a note. Always
        needs an `approval_id` of `vehicle_visit.adjust` granted by someone
        else on this visit's revision.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleVisitAdjustInput'
      responses:
        '200':
          description: The corrected visit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleVisitResult'
        '409':
          description: Refused; `error.details.reason` is `approval_required`, `vehicle_visit_changed` or `vehicle_visit_paid`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/vehicle_visits/{id}/void:
    post:
      operationId: posVehicleVisitVoid
      description: Cancels an unpaid visit with a reason.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleVisitVoidInput'
      responses:
        '200':
          description: The voided visit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleVisitResult'
  /api/v3/admin/pos/workspaces/{workspace_id}/vehicle_visit:
    put:
      operationId: posWorkspaceVehicleVisit
      description: >
        Puts the order on an open coach visit of its branch, or takes it off
        (`visit_id` empty). Only before the order completes; the order's
        price does not change.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceVehicleVisitInput'
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResult'
        '409':
          description: Refused; `error.details.reason` is `workspace_completed`, `vehicle_visit_closed`, `lease_stale` or `module_disabled`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/resources/{resource_id}/timed_sessions:
    post:
      operationId: posTimedSessionStart
      description: >
        Starts the clock of a karaoke room or billiard table on the server's
        clock; the request carries no time. A room without an open order gets
        a `timed` order, its lease held by `editor_id`. A room with several
        open orders needs `workspace_id`. Needs `timed_billing` and
        `pos.timed.operate`.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - name: resource_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimedSessionStartInput'
      responses:
        '201':
          description: The room's order and its running clock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimedSessionCommandResult'
        '409':
          description: >
            Refused; `error.details.reason` is `timed_session_running`,
            `rate_plan_missing`, `workspace_required` (with `workspace_ids`),
            `planned_end_invalid`, `timed_package_unknown`,
            `stored_value_card_unknown`, `stored_value_closed`,
            `stored_value_insufficient`, `table_unavailable`, `workspace_closed` or
            `module_disabled`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/timed_sessions/{id}:
    get:
      operationId: posTimedSessionShow
      description: A clock with its stretches and, while it runs, its quote up to now on the server's clock.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The clock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimedSessionResult'
  /api/v3/admin/pos/timed_sessions/{id}/quote:
    get:
      operationId: posTimedSessionQuote
      description: The same as reading the clock, for screens that refresh the price every minute.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The clock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimedSessionResult'
  /api/v3/admin/pos/timed_sessions/{id}/stop:
    post:
      operationId: posTimedSessionStop
      description: >
        Stops a clock now on the server's clock and bills its line. A clock
        that already stopped is answered as it is. Needs no lease.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimedSessionApprovalInput'
      responses:
        '200':
          description: The order and the stopped clock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimedSessionCommandResult'
        '409':
          description: >
            Refused; `error.details.reason` is `workspace_closed`,
            `snapshot_locked`, `approval_required` (a pause longer than the
            branch allows, as for resuming), `stored_value_insufficient` or
            `stored_value_changed` (the minutes card changed while stopping)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/timed_sessions/{id}/move:
    post:
      operationId: posTimedSessionMove
      description: >
        Moves a running clock and the room's order to a free room. The
        stretch on the old room keeps its price; the next one runs at the
        new room's plan. Needs no lease.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimedSessionMoveInput'
      responses:
        '200':
          description: The order and the clock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimedSessionCommandResult'
        '409':
          description: >
            Refused; `error.details.reason` is `same_table`, `table_occupied`,
            `table_unavailable`, `timed_session_running`, `timed_session_stopped`,
            `rate_plan_missing`, `workspace_closed` or `module_disabled`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/timed_sessions/{id}/segments/{segment_id}:
    patch:
      operationId: posTimedSegmentUpdate
      description: >
        Corrects when a stretch started or ended, with a reason. Needs
        `pos.timed.edit` or a manager's approval for `timed.edit_segment`
        bound to the order's revision. The running stretch only moves its
        start. A stopped clock is billed again.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/Id'
        - name: segment_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimedSegmentEditInput'
      responses:
        '200':
          description: The order and the clock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimedSessionCommandResult'
        '409':
          description: >
            Refused; `error.details.reason` is `approval_required` (with
            `action`), `reason_required`, `time_required`, `time_invalid`,
            `time_in_future`, `segment_open`, `segment_overlap` or
            `workspace_closed`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/timed_sessions/{id}/pause:
    post:
      operationId: posTimedSessionPause
      description: >
        Pauses a running clock now on the server's clock; a pause is never
        billed. Needs `pos.timed.operate` and no lease.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The order and the paused clock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimedSessionCommandResult'
        '409':
          description: >
            Refused; `error.details.reason` is `timed_session_paused`,
            `timed_session_stopped`, `workspace_closed` or `module_disabled`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/timed_sessions/{id}/resume:
    post:
      operationId: posTimedSessionResume
      description: >
        Plays on a paused clock at the room's plan. A pause longer than the
        branch's `max_pause_minutes` needs `pos.timed.edit` or a manager's
        approval for `timed.long_pause` bound to the order's revision.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimedSessionApprovalInput'
      responses:
        '200':
          description: The order and the running clock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimedSessionCommandResult'
        '409':
          description: >
            Refused; `error.details.reason` is `timed_session_not_paused`,
            `approval_required` (with `action`, `paused_minutes` and
            `max_pause_minutes`), `rate_plan_missing`, `workspace_closed` or
            `module_disabled`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/attendant_assignments:
    get:
      operationId: posAttendantAssignmentList
      description: >
        The attendants book of a branch: the open turns, or with `date` the
        turns of that business day. Needs `pos.timed.operate`.
      parameters:
        - name: branch_id
          in: query
          required: true
          schema:
            type: string
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: resource_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The turns
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendantAssignmentList'
    post:
      operationId: posAttendantAssignmentStart
      description: >
        Starts a turn now: a staff member of the branch serves a room. A
        turn on a room with a clock ends when the clock stops. No money.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendantAssignmentStartInput'
      responses:
        '201':
          description: The turn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendantAssignmentResult'
        '409':
          description: >
            Refused; `error.details.reason` is `attendant_busy`,
            `attendant_not_member`, `attendant_invalid` or `module_disabled`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/attendant_assignments/{id}/stop:
    post:
      operationId: posAttendantAssignmentStop
      description: Ends a turn now; a turn already ended is answered as it is.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The turn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendantAssignmentResult'
  /api/v3/admin/pos/guest_orders:
    get:
      operationId: posGuestOrderList
      description: >
        Guests' orders from the table QR at a branch: pending ones (whose
        table order is still open) by default, or those decided in the last
        day with `status`. Needs `pos.guest_order.decide`, `pos.table.serve`
        or `pos.shift.open` at the branch.
      parameters:
        - name: branch_id
          in: query
          required: true
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, accepted, rejected, expired]
        - name: workspace_id
          in: query
          required: false
          schema:
            type: string
        - name: area_id
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: The guest orders, oldest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestOrderList'
  /api/v3/admin/pos/guest_orders/{id}/accept:
    post:
      operationId: posGuestOrderAccept
      description: >
        Adds the items to the table's order as the caller, through the same
        add command as a waiter (no lease, priced again), and sends the new
        lines to the kitchen. Items sold out or closed to guests since are
        left out with their reason; with nothing left the order is rejected.
        Needs `pos.guest_order.decide`.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The decided guest order, the table's order and how many kitchen tickets were sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestOrderAcceptResult'
        '409':
          description: >
            Refused; `error.details.reason` is `guest_order_decided`,
            `qr_order_unavailable`, `snapshot_locked` or a reason of adding items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/guest_orders/{id}/reject:
    post:
      operationId: posGuestOrderReject
      description: Turns a guest's order down; the guest reads the reason. Needs `pos.guest_order.decide`.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestOrderRejectInput'
      responses:
        '200':
          description: The rejected guest order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestOrderResult'
        '409':
          description: Refused; `error.details.reason` is `guest_order_decided`, `reason_required` or `reason_invalid`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/guest_requests:
    get:
      operationId: posGuestRequestList
      description: >
        Open calls for staff and bill requests from the table QR at a branch,
        oldest first. Same access as the guest orders.
      parameters:
        - name: branch_id
          in: query
          required: true
          schema:
            type: string
        - name: area_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The open requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestRequestList'
  /api/v3/admin/pos/guest_requests/{id}/done:
    post:
      operationId: posGuestRequestDone
      description: Marks a request taken care of; a request already done is answered as it is.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestRequestResult'
  /api/v3/admin/pos/table_codes:
    get:
      operationId: posTableCodeList
      description: >
        The active tables of a branch with their QR code, if any. Needs
        `write_pos_topology`, `pos.resource.manage` or `pos.topology.manage`.
      parameters:
        - name: branch_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The tables
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableCodeList'
    post:
      operationId: posTableCodeIssue
      description: >
        Issues a new QR code for a table and revokes the old one with every
        guest session it opened. `meta.token` and `meta.url` are answered
        only by the request that issued them; a replay answers null. With
        `printer_id` the sticker is queued to that printer (`table_qr`).
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableCodeIssueInput'
      responses:
        '201':
          description: The new code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableCodeIssueResult'
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    ReportBranch:
      name: branch_id
      in: query
      required: true
      schema:
        type: string
    KitchenStationIds:
      name: station_ids
      in: query
      required: false
      description: Several stations, comma separated.
      schema:
        type: string
    KitchenServiceMode:
      name: service_mode
      in: query
      required: false
      schema:
        type: string
        enum: [counter, dine_in, takeaway, delivery, tab, timed]
    WorkspaceId:
      name: workspace_id
      in: path
      required: true
      schema:
        type: string
    CourseNumber:
      name: course
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 9
    DepositId:
      name: deposit_id
      in: path
      required: true
      schema:
        type: string
    KitchenIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 200
    ReportFrom:
      name: from
      in: query
      description: First business date, YYYY-MM-DD; today by default
      schema:
        type: string
        format: date
    ReportTo:
      name: to
      in: query
      description: Last business date, YYYY-MM-DD; the start date by default
      schema:
        type: string
        format: date
  responses:
    KitchenTicketChanged:
      description: The ticket after the change; repeating a change answers the same ticket
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/KitchenTicketResult'
    KitchenOrderServed:
      description: The tickets whose items were served; empty when nothing was ready
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/KitchenOrderServedResult'
    KitchenRefused:
      description: >
        Refused; `error.details.reason` is `kitchen_status_invalid`,
        `kitchen_action_invalid` or `kitchen_recall_expired`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    RealtimeEvent:
      type: object
      additionalProperties: false
      required: [event, id, branch_id, at, refs]
      properties:
        event:
          type: string
          enum:
            - workspace.updated
            - kitchen_ticket.updated
            - menu.sold_out
            - payment.requested
            - print_job.created
            - resource.updated
            - approval.requested
            - guest_order.created
            - guest_order.updated
            - guest_request.created
            - guest_request.updated
        id:
          type: string
        branch_id:
          type: string
        revision:
          type: integer
        lease_generation:
          type: integer
        at:
          type: string
          format: date-time
        alert:
          type: string
          enum: [ending_soon, ended_package, pause_too_long]
          description: >
            Only on `resource.updated`, sent once per deadline: a clock is ten
            minutes from its planned end, a package's minutes are played, or a
            pause ran longer than the branch allows.
        refs:
          type: object
          additionalProperties:
            type: string
    Context:
      type: object
      additionalProperties: true
      required: [staff, store, administration, capabilities]
      properties:
        capabilities:
          type: array
          description: What the signed-in person may do at the selected branch, such as `pos.device.manage`.
          items:
            type: string
        staff:
          type: object
          additionalProperties: true
          required: [id, email]
          properties:
            id:
              type: string
            email:
              type: string
        store:
          type: object
          additionalProperties: true
          required: [id, currency]
          properties:
            id:
              type: string
            currency:
              type: string
        administration:
          type: object
          additionalProperties: true
          required: [read, write]
          properties:
            read:
              type: boolean
            write:
              type: boolean
        einvoice_type:
          type: string
          enum: [none, cash_register, coded]
          description: E-invoice the store issues for completed orders; the counter offers buyer details unless it is none.
        modules:
          type: object
          nullable: true
          description: The selected branch's POS modules by key (such as `fnb.bottle_keep`), on or off.
          additionalProperties:
            type: boolean
        branches:
          type: array
          description: Branches this person may see, with what their screens need.
          items:
            $ref: '#/components/schemas/ContextBranch'
    ContextBranch:
      type: object
      additionalProperties: true
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        void_reasons:
          type: array
          description: Reasons a sent item may be voided for; `khac` with a note is always offered.
          items:
            type: string
    CatalogItem:
      type: object
      additionalProperties: true
      required: [product_id, price, stock_on_hand]
      properties:
        product_id:
          type: string
        price:
          type: string
        stock_on_hand:
          type: number
    TaxRow:
      type: object
      additionalProperties: true
      required: [rate, label, amount]
      properties:
        rate:
          type: string
        label:
          type: string
        amount:
          type: string
    Workspace:
      type: object
      additionalProperties: true
      required: [id, revision, operational_status, service_mode, business_date, totals]
      properties:
        id:
          type: string
        revision:
          type: integer
        lease_generation:
          type: integer
          description: Sent back with commands that need the editing lease (move, merge).
        operational_status:
          type: string
        service_mode:
          type: string
          enum: [counter, dine_in, takeaway, delivery, tab, timed]
        business_date:
          type: string
          format: date
        order_number:
          type: [integer, 'null']
          description: >
            Call number (`fnb.order_number`), 1, 2, 3… per branch and business
            date, given at the first kitchen send or at completion and kept.
        guest_name:
          type: [string, 'null']
          maxLength: 60
          description: The name the counter calls out with the call number.
        tab_name:
          type: [string, 'null']
          maxLength: 60
          description: The guest's name of a bar tab (`service_mode` tab).
        vehicle_visit_id:
          type: [string, 'null']
          description: The coach visit of a rest stop the order is sold to (`fnb.vehicle_commission`).
        minimum_spend:
          description: A VIP table's minimum spend and the fee making up the shortfall.
          oneOf:
            - $ref: '#/components/schemas/WorkspaceMinimumSpend'
            - type: 'null'
        drink_credit:
          description: The drink credit of the order's door tickets.
          oneOf:
            - $ref: '#/components/schemas/WorkspaceDrinkCredit'
            - type: 'null'
        resource:
          description: The table of a table order (`fnb.tables`).
          oneOf:
            - $ref: '#/components/schemas/ResourceRef'
            - type: 'null'
        guest_count:
          type: [integer, 'null']
        table_label:
          type: [string, 'null']
          description: A, B… when a table has several open orders.
        service_charge:
          description: Present when the branch has a service charge rate.
          oneOf:
            - $ref: '#/components/schemas/WorkspaceServiceCharge'
            - type: 'null'
        prebill:
          description: The latest pre-bill of a table order.
          oneOf:
            - $ref: '#/components/schemas/WorkspacePrebill'
            - type: 'null'
        payment_request:
          description: The table's open request for the bill.
          oneOf:
            - $ref: '#/components/schemas/PaymentRequest'
            - type: 'null'
        reservation:
          description: The booking seated at this table order, with its deposits.
          oneOf:
            - $ref: '#/components/schemas/WorkspaceReservation'
            - type: 'null'
        kitchen_sends:
          description: Every kitchen send of a table order; null for other orders.
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/KitchenSendSummary'
        line_items:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceLine'
        totals:
          type: object
          additionalProperties: true
          required: [taxes]
          properties:
            taxes:
              type: array
              items:
                type: object
                additionalProperties: true
                required: [rate, label, amount]
                properties:
                  rate:
                    type: string
                  label:
                    type: string
                  amount:
                    type: string
    WorkspaceLine:
      type: object
      additionalProperties: true
      required: [id, variant_id, name, quantity, price, amount, sale_line_id]
      properties:
        id:
          type: string
        variant_id:
          type: string
        name:
          type: string
        quantity:
          type: integer
        price:
          type: string
        amount:
          type: string
        sale_line_id:
          type: [string, 'null']
        kind:
          type: string
          enum: [ordinary, measured, tracked, menu, timed, cover]
        unit_price:
          type: string
        price_label:
          type: [string, 'null']
          description: The time-of-day menu the price came from ("Happy hour").
        note:
          type: [string, 'null']
        modifiers:
          type: array
          items:
            $ref: '#/components/schemas/LineModifier'
        components:
          type: array
          items:
            $ref: '#/components/schemas/LineComponent'
        kitchen_sent_quantity:
          type: string
          description: >
            How much of the line the kitchen has been told about. The line
            goes lower only by a kitchen void.
        pending_kitchen_quantity:
          type: string
          description: What the next kitchen send would send of a menu line.
        row_version:
          type: integer
          description: Moves on every change of the line; unsent-line edits send it back.
        added_by:
          description: Who added the line.
          oneOf:
            - $ref: '#/components/schemas/StaffRef'
            - type: 'null'
        kitchen_status:
          description: Table orders only, how far the kitchen got with what was sent of the line.
          $ref: '#/components/schemas/LineKitchenStatus'
        course:
          type: [integer, 'null']
          description: The course of a table dish (1 starter, 2 main, 3 dessert…; names in table settings).
        course_status:
          type: string
          enum: [none, held, fired]
          description: >
            `held` keeps the dish off the kitchen until its course is fired;
            `fired` once it was. A held line sends nothing.
        seat:
          type: [integer, 'null']
          description: The seat that ordered it; a bill can be split by seat.
        buffet_tier_id:
          type: [string, 'null']
          description: On a `cover` line, the buffet tier its ticket is for.
        buffet_cover_line_id:
          type: [string, 'null']
          description: On a free buffet dish, the cover line it is eaten on.
    StaffRef:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: [string, 'null']
    KitchenSendSummary:
      type: object
      additionalProperties: false
      description: One kitchen send of an order that told the kitchen something.
      required: [id, sequence, sent_at, staff_id, staff_name, device_id]
      properties:
        id:
          type: string
        sequence:
          type: integer
        sent_at:
          type: string
          format: date-time
        staff_id:
          type: [string, 'null']
        staff_name:
          type: [string, 'null']
        device_id:
          type: [string, 'null']
    LineModifier:
      type: object
      additionalProperties: false
      description: An option a line was sold with, copied at the time of sale.
      required: [id, option_id, name, group_name, price_delta, quantity]
      properties:
        id:
          type: string
        option_id:
          type: [string, 'null']
          description: Null once the option itself was deleted.
        name:
          type: string
        group_name:
          type: string
        price_delta:
          type: string
        quantity:
          type: integer
          minimum: 1
    LineComponent:
      type: object
      additionalProperties: false
      description: What one unit of a combo line contained when it was sold.
      required: [id, variant_id, name, quantity]
      properties:
        id:
          type: string
