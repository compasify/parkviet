          type: string
          description: As sold; tax included when `price_includes_tax`
        discount:
          type: string
        tax_rate:
          type: [string, 'null']
          description: Percent, e.g. "8" or "10"; null when the line carries no tax line
        tax_amount:
          type: string
        amount_before_tax:
          type: string
        amount:
          type: string
          description: Paid amount with tax
        price_includes_tax:
          type: boolean
