        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch_id, name, connection]
              properties:
                branch_id:
                  type: string
                name:
                  type: string
                  maxLength: 80
                connection:
                  type: string
                  enum: [escpos_lan, escpos_bluetooth, sunmi_builtin, epson_epos, star_webprnt, browser]
                address:
                  type: [string, 'null']
                  description: Host or IP with an optional port; no scheme or path.
                bluetooth_id:
                  type: [string, 'null']
                paper:
                  type: string
                  enum: [58mm, 80mm]
                command_language:
                  type: string
                  enum: [escpos, tspl]
                roles:
                  type: array
                  items:
                    type: string
                print_station_device_id:
                  type: [string, 'null']
                register_id:
                  type: [string, 'null']
                status:
                  type: string
                  enum: [active, disabled]
                settings:
                  type: object
      responses:
        '201':
          description: The new printer
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Printer'
  /api/v3/admin/pos/printers/stations:
    get:
      operationId: posPrinterStations
      parameters:
        - name: branch_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Active print station devices of the branch
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      properties:
                        id:
                          type: string
                        name:
                          type: string
  /api/v3/admin/pos/printers/{id}:
    patch:
      operationId: posPrinterUpdate
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 80
                connection:
                  type: string
                  enum: [escpos_lan, escpos_bluetooth, sunmi_builtin, epson_epos, star_webprnt, browser]
                address:
                  type: [string, 'null']
                  description: Host or IP with an optional port; no scheme or path.
                bluetooth_id:
                  type: [string, 'null']
                paper:
                  type: string
                  enum: [58mm, 80mm]
                command_language:
                  type: string
                  enum: [escpos, tspl]
                roles:
                  type: array
                  items:
                    type: string
                print_station_device_id:
                  type: [string, 'null']
                register_id:
                  type: [string, 'null']
                status:
                  type: string
                  enum: [active, disabled]
                settings:
                  type: object
      responses:
        '200':
          description: The changed printer
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Printer'
    delete:
      operationId: posPrinterDelete
      description: Refused with `printer_in_use` once the printer has print jobs; disable it instead.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 200
      responses:
        '200':
          description: The removed printer id
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id]
