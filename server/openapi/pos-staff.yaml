                    type: [string, 'null']
                  amount_before_tax:
                    type: string
                  tax_amount:
                    type: string
        payment_method:
          type: [string, 'null']
          enum: [TM, CK, TM/CK, null]
        currency:
          type: string
        template_code:
          type: [string, 'null']
        symbol:
          type: [string, 'null']
        number:
          type: [string, 'null']
        cqt_code:
          type: [string, 'null']
          description: The tax authority's code
        lookup_code:
          type: [string, 'null']
        lookup_url:
          type: [string, 'null']
        issued_at:
          type: [string, 'null']
          format: date-time
        attempts:
          type: integer
        next_attempt_at:
          type: [string, 'null']
          format: date-time
        last_error:
          type: [string, 'null']
        buyer_link_open:
          type: boolean
          description: The buyer's own page still takes details
        buyer_token_expires_at:
          type: [string, 'null']
          format: date-time
        buyer_submitted_at:
          type: [string, 'null']
          format: date-time
        canceled_at:
          type: [string, 'null']
          format: date-time
        cancel_reason:
          type: [string, 'null']
        completed_at:
          type: [string, 'null']
          format: date-time
        total:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
