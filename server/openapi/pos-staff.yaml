              base_unit:
                type: string
              unit_cost:
                type: [string, 'null']
                description: Cost per stock unit now
              cost:
                type: [string, 'null']
    StockAlert:
      type: object
      additionalProperties: false
      required: [id, branch_id, variant_id, name, sku, options_text, base_unit, min_quantity, on_hand, low]
      properties:
        id:
          type: string
        branch_id:
          type: string
        variant_id:
          type: string
        name:
          type: [string, 'null']
        sku:
          type: [string, 'null']
        options_text:
          type: [string, 'null']
        base_unit:
          type: string
        min_quantity:
          type: integer
        on_hand:
          type: integer
        low:
          type: boolean
    IngredientUsageRow:
      type: object
      additionalProperties: false
      required: [business_date, ingredient, ingredient_sku, menu_item, quantity, unit, cost, cost_missing]
      properties:
        business_date:
          type: string
          format: date
        ingredient:
          type: string
        ingredient_sku:
          type: [string, 'null']
        menu_item:
          type: string
        quantity:
          type: integer
        unit:
          type: string
        cost:
          type: string
        cost_missing:
          type: boolean
