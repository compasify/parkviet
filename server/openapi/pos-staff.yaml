      required: [id, area_id, name, kind, capacity, shape, x, y, w, h, rotation, manual_status, state, guest_count, seated_minutes, subtotal, currency, payment_requested, edited_after_prebill, orders,
                 next_reservation, buffet_ends_at, timed]
      properties:
        timed:
          description: The room's clock of play time, when an open order has one.
          oneOf:
            - $ref: '#/components/schemas/ResourceBoardTimed'
            - type: 'null'
        next_reservation:
          description: The table's next active booking in the coming 12 hours.
          oneOf:
            - $ref: '#/components/schemas/ResourceNextReservation'
            - type: 'null'
        buffet_ends_at:
          type: [string, 'null']
          format: date-time
          description: The earliest buffet end of the table's open orders.
        id:
          type: string
        area_id:
          type: [string, 'null']
        name:
          type: string
        kind:
          type: string
          enum: [table, room, billiard, vip]
        capacity:
          type: integer
        shape:
          type: string
          enum: [rect, round]
        x:
          type: integer
        y:
          type: integer
        w:
          type: integer
        h:
          type: integer
        rotation:
          type: integer
        manual_status:
          type: string
          enum: [available, cleaning, out_of_service]
        state:
          type: string
          enum: [available, reserved, occupied, ordered, waiting_long, playing, ending_soon, payment_requested, prebilled, cleaning, out_of_service]
          description: >
            Strongest first: out_of_service, cleaning (no open order),
            payment_requested, prebilled, ending_soon (a running clock is
            within ten minutes of its planned end, or past the end of its
            package), waiting_long (a kitchen
            item waited past its station's threshold), playing (a clock is
            running), ordered, occupied, reserved (no open order and a
            booking starts within the hour), available.
        guest_count:
          type: [integer, 'null']
        seated_minutes:
          type: [integer, 'null']
          description: Minutes since the oldest open order was opened, on the server clock.
        subtotal:
          type: [string, 'null']
        currency:
          type: [string, 'null']
        payment_requested:
          type: boolean
        edited_after_prebill:
          type: boolean
        orders:
          type: array
          items:
            $ref: '#/components/schemas/ResourceBoardOrder'
    ResourceBoardTimed:
      type: object
      additionalProperties: false
      required: [id, workspace_id, status, started_at, stopped_at, planned_end_at, paused_at, prepaid_minutes, played_seconds, played_minutes,
                 quote_amount, ending_soon, package_ended, pause_too_long]
      properties:
        paused_at:
          type: [string, 'null']
          format: date-time
          description: Server time the clock was paused; null unless paused.
        prepaid_minutes:
          type: [integer, 'null']
          description: The minutes of the package the clock was sold with.
        played_seconds:
          type: [integer, 'null']
          description: Seconds played up to `server_now`, pauses not counted; null once stopped.
        package_ended:
          type: boolean
          description: A package clock still runs past its prepaid minutes.
        pause_too_long:
          type: boolean
          description: Paused longer than the branch's `max_pause_minutes`; resuming needs `pos.timed.edit` or an approval.
        id:
          type: string
        workspace_id:
          type: [string, 'null']
        status:
          type: string
          enum: [running, paused, stopped]
        started_at:
          type: string
          format: date-time
          description: Server time the clock started; show elapsed time from it with the server clock offset.
        stopped_at:
          type: [string, 'null']
          format: date-time
        planned_end_at:
          type: [string, 'null']
          format: date-time
        played_minutes:
          type: integer
        quote_amount:
          type: string
          description: The price of the time so far on the server clock; final once stopped.
        ending_soon:
          type: boolean
