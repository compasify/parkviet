                      id:
                        type: string
        '409':
          description: Refused; `error.details.reason` says why
  /api/v3/admin/pos/printers/{id}/test:
    post:
      operationId: posPrinterTest
      description: >
        A print station printer gets a queued test job. A printer the browser
        drives gets the test document back, to print from the browser.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 200
      responses:
        '200':
          description: The test job or document
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [print_job, document]
                    properties:
                      print_job:
                        oneOf:
                          - $ref: '#/components/schemas/PrintJob'
                          - type: 'null'
                      document:
                        oneOf:
                          - $ref: '#/components/schemas/PrintDocument'
                          - type: 'null'
        '409':
          description: Refused; `error.details.reason` says why
  /api/v3/admin/pos/print_jobs:
    get:
      operationId: posPrintJobs
      parameters:
        - name: branch_id
          in: query
          required: true
          schema:
            type: string
        - name: status
          in: query
          description: Comma-separated statuses
          schema:
            type: string
      responses:
        '200':
          description: The print queue of the branch, newest first
          content:
            application/json:
              schema:
