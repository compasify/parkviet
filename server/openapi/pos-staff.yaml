            type: string
            maxLength: 200
      responses:
        '200':
          description: The canceled job
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PrintJob'
        '409':
          description: Refused; `error.details.reason` says why
  /api/v3/admin/pos/receipts/{id}/prints/{print_id}/void:
    post:
      operationId: posReceiptPrintVoid
      description: >
        Takes back the caller's latest print recorded for a LAN printer, when
        delivery certainly failed, so it does not count as printed.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: print_id
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [mixed_content, no_address, printer_error, not_sent]
      responses:
        '200':
          description: The voided print
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [print, receipt]
                    properties:
                      print:
                        type: object
                      receipt:
                        type: object
        '409':
          description: Refused; `error.details.reason` says why
  /api/v3/pos_device/print_jobs/claim:
    post:
      operationId: posDevicePrintClaim
      description: >
        The next job of a printer bound to this print station, or null. A
        printer has one job out at a time, in id order. Printing is
        at-least-once: deliver the report of an attempt before claiming again,
        because an attempt whose lease ran out and whose job was claimed again
        can no longer be reported.
      responses:
        '200':
          description: A claimed job or null
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/PrintJobClaim'
                      - type: 'null'
  /api/v3/pos_device/print_jobs/{id}/report:
    post:
      operationId: posDevicePrintReport
      parameters:
        - $ref: '#/components/parameters/Id'
      description: >
        How one attempt ended. Repeating the same report is safe. A report for
        an attempt that is no longer current answers `print_claim_stale`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attempt, status]
              properties:
                attempt:
                  type: integer
                  minimum: 1
                status:
                  type: string
                  enum: [printed, failed]
                error:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: The job after the report
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PrintJob'
        '409':
          description: Refused; `error.details.reason` says why
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/kitchen_stations:
    get:
      operationId: posKitchenStations
