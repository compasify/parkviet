openapi: 3.1.0
info:
  title: Parkviet POS staff API
  version: '1'
  description: >
    Staff contract for context, catalog, workspaces and approvals, and the
    device channel. A paired device reaches the /admin/pos paths with
    `Authorization: Device <token>` and `X-Pos-Staff-Session`.
x-realtime:
  transport: Action Cable
  path: /cable
  channel: Spree::Pos::BranchChannel
  subscribeParams:
    branch_id: Prefixed id of the branch
  stream: pos:branch:<branch_prefixed_id>
  message:
    $ref: '#/components/schemas/RealtimeEvent'
  authentication:
    staff: Query `token` holding the Admin API JWT. Needs an allowed Origin.
    device: >
      Subprotocol `pos-device.<token>` or query `device_token`, and for a staff
      session subprotocol `pos-staff-session.<token>` or query
      `staff_session_token`. Origin may be absent. A native client offering
      subprotocols must also offer `actioncable-v1-json`, or the server selects
      no protocol for the socket.
  delivery: >
    Events only announce a change; read it through the API. Refetch every open
    query after a reconnect, because events sent while offline are not replayed.
paths:
  /api/v3/admin/pos/context:
    get:
      operationId: posContext
      parameters:
        - name: branch_id
          in: query
          description: The branch whose capabilities to list.
          schema:
            type: string
        - name: register_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Staff context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Context'
  /api/v3/admin/pos/catalog:
    get:
      operationId: posCatalog
      responses:
        '200':
          description: Products the branch may sell
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CatalogItem'
  /api/v3/admin/pos/workspaces:
    post:
      operationId: posWorkspaceCreate
      responses:
        '201':
          description: Draft workspace
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Workspace'
  /api/v3/admin/pos/workspaces/{id}:
    get:
      operationId: posWorkspaceShow
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Workspace
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Workspace'
  /api/v3/admin/pos/workspaces/{id}/items:
    post:
      operationId: posWorkspaceAddItem
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Workspace after the line change
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Workspace'
  /api/v3/admin/pos/approvals:
    post:
      operationId: posApprovalCreate
      responses:
        '201':
          description: Approval
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Approval'
  /api/v3/pos_device/pair:
    post:
      operationId: posDevicePair
      description: >
        Exchanges a single-use pairing code. Unauthenticated and rate limited
        per client address; an unknown or expired code answers 404
        `pairing_invalid`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, platform, name]
              properties:
                code:
                  type: string
                platform:
                  type: string
                  enum: [android, ios, web]
                name:
                  type: string
                  maxLength: 80
                app_version:
                  type: string
      responses:
        '201':
          description: Device token, shown once
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/DevicePairResult'
        '404':
          description: The code is invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many attempts from this address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/pos_device/me:
    get:
      operationId: posDeviceMe
      responses:
        '200':
          description: Paired device
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/DeviceSession'
  /api/v3/pos_device/staff:
    get:
      operationId: posDeviceStaff
      responses:
        '200':
          description: Names at the branch
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeviceStaffMember'
  /api/v3/pos_device/staff_sessions:
    post:
      operationId: posDeviceStaffSignIn
      description: >
        Five wrong PINs in 15 minutes lock that person on this device (429
        `pin_locked`); the device as a whole has a cap (429 `pin_rate_limited`).
        A wrong PIN answers 401 `pin_incorrect`, a person without a PIN 401
        `pin_not_set`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [membership_id, pin]
              properties:
                membership_id:
                  type: string
                pin:
                  type: string
      responses:
        '201':
          description: Staff session token, shown once
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/DeviceStaffSignIn'
        '401':
          description: Refused; `error.code` says why
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Locked; `error.code` says why
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: posDeviceStaffSignOut
      responses:
        '204':
          description: Signed out
  /api/v3/admin/pos/printers:
    get:
      operationId: posPrinters
      parameters:
        - name: branch_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Printers of the branch
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Printer'
    post:
      operationId: posPrinterCreate
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch_id, name, connection]
              properties:
                branch_id:
                  type: string
                name:
                  type: string
                  maxLength: 80
                connection:
                  type: string
                  enum: [escpos_lan, escpos_bluetooth, sunmi_builtin, epson_epos, star_webprnt, browser]
                address:
                  type: [string, 'null']
                  description: Host or IP with an optional port; no scheme or path.
                bluetooth_id:
                  type: [string, 'null']
                paper:
                  type: string
                  enum: [58mm, 80mm]
                command_language:
                  type: string
                  enum: [escpos, tspl]
                roles:
                  type: array
                  items:
                    type: string
                print_station_device_id:
                  type: [string, 'null']
                register_id:
                  type: [string, 'null']
                status:
                  type: string
                  enum: [active, disabled]
                settings:
                  type: object
      responses:
        '201':
          description: The new printer
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Printer'
  /api/v3/admin/pos/printers/stations:
    get:
      operationId: posPrinterStations
      parameters:
        - name: branch_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Active print station devices of the branch
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      properties:
                        id:
                          type: string
                        name:
                          type: string
  /api/v3/admin/pos/printers/{id}:
    patch:
      operationId: posPrinterUpdate
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 80
                connection:
                  type: string
                  enum: [escpos_lan, escpos_bluetooth, sunmi_builtin, epson_epos, star_webprnt, browser]
                address:
                  type: [string, 'null']
                  description: Host or IP with an optional port; no scheme or path.
                bluetooth_id:
                  type: [string, 'null']
                paper:
                  type: string
                  enum: [58mm, 80mm]
                command_language:
                  type: string
                  enum: [escpos, tspl]
                roles:
                  type: array
                  items:
                    type: string
                print_station_device_id:
                  type: [string, 'null']
                register_id:
                  type: [string, 'null']
                status:
                  type: string
                  enum: [active, disabled]
                settings:
                  type: object
      responses:
        '200':
          description: The changed printer
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Printer'
    delete:
      operationId: posPrinterDelete
      description: Refused with `printer_in_use` once the printer has print jobs; disable it instead.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 200
      responses:
        '200':
          description: The removed printer id
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id]
                    properties:
                      id:
                        type: string
        '409':
          description: Refused; `error.details.reason` says why
  /api/v3/admin/pos/printers/{id}/test:
    post:
      operationId: posPrinterTest
      description: >
        A print station printer gets a queued test job. A printer the browser
        drives gets the test document back, to print from the browser.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 200
      responses:
        '200':
          description: The test job or document
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [print_job, document]
                    properties:
                      print_job:
                        oneOf:
                          - $ref: '#/components/schemas/PrintJob'
                          - type: 'null'
                      document:
                        oneOf:
                          - $ref: '#/components/schemas/PrintDocument'
                          - type: 'null'
        '409':
          description: Refused; `error.details.reason` says why
  /api/v3/admin/pos/print_jobs:
    get:
      operationId: posPrintJobs
      parameters:
        - name: branch_id
          in: query
          required: true
          schema:
            type: string
        - name: status
          in: query
          description: Comma-separated statuses
          schema:
            type: string
      responses:
        '200':
          description: The print queue of the branch, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PrintJob'
    post:
      operationId: posPrintJobCreate
      description: >
        Queues a receipt (recording its print) or a pre-bill. A pre-bill of a
        revision already issued is refused with `prebill_already_printed`.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, printer_id]
              properties:
                kind:
                  type: string
                  enum: [receipt, prebill]
                printer_id:
                  type: string
                receipt_id:
                  type: string
                workspace_id:
                  type: string
                receipt_template_id:
                  type: string
                template_version:
                  type: string
                paper:
                  type: string
      responses:
        '201':
          description: The queued job
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PrintJobResult'
        '409':
          description: Refused; `error.details.reason` says why
  /api/v3/admin/pos/print_jobs/prebills:
    get:
      operationId: posPrintJobPrebills
      parameters:
        - name: branch_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The latest printed pre-bill of each open order, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PrintJob'
  /api/v3/admin/pos/print_jobs/{id}/reprint:
    post:
      operationId: posPrintJobReprint
      description: >
        A new job for the same document. A pre-bill needs an approval for
        `workspace.reprint_prebill` bound to the workspace and its revision,
        and answers `approval_required` without one.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                approval_id:
                  type: string
      responses:
        '201':
          description: The new job
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PrintJobResult'
        '409':
          description: Refused; `error.details.reason` says why
  /api/v3/admin/pos/print_jobs/{id}/cancel:
    post:
      operationId: posPrintJobCancel
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 200
      responses:
        '200':
          description: The canceled job
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PrintJob'
        '409':
          description: Refused; `error.details.reason` says why
  /api/v3/admin/pos/receipts/{id}/prints/{print_id}/void:
    post:
      operationId: posReceiptPrintVoid
      description: >
        Takes back the caller's latest print recorded for a LAN printer, when
        delivery certainly failed, so it does not count as printed.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: print_id
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [mixed_content, no_address, printer_error, not_sent]
      responses:
        '200':
          description: The voided print
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [print, receipt]
                    properties:
                      print:
                        type: object
                      receipt:
                        type: object
        '409':
          description: Refused; `error.details.reason` says why
  /api/v3/pos_device/print_jobs/claim:
    post:
      operationId: posDevicePrintClaim
      description: >
        The next job of a printer bound to this print station, or null. A
        printer has one job out at a time, in id order. Printing is
        at-least-once: deliver the report of an attempt before claiming again,
        because an attempt whose lease ran out and whose job was claimed again
        can no longer be reported.
      responses:
        '200':
          description: A claimed job or null
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/PrintJobClaim'
                      - type: 'null'
  /api/v3/pos_device/print_jobs/{id}/report:
    post:
      operationId: posDevicePrintReport
      parameters:
        - $ref: '#/components/parameters/Id'
      description: >
        How one attempt ended. Repeating the same report is safe. A report for
        an attempt that is no longer current answers `print_claim_stale`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attempt, status]
              properties:
                attempt:
                  type: integer
                  minimum: 1
                status:
                  type: string
                  enum: [printed, failed]
                error:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: The job after the report
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PrintJob'
        '409':
          description: Refused; `error.details.reason` says why
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/system_status:
    get:
      operationId: posSystemStatus
      description: >
        Server health for store administrators (`read_pos_topology` or
        `write_pos_topology`). Store-wide counts, ages and timestamps only.
      responses:
        '200':
          description: The server's address, TLS mode and health
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/SystemStatus'
        '403':
          description: Not a store administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    RealtimeEvent:
      type: object
      additionalProperties: false
      required: [event, id, branch_id, at, refs]
      properties:
        event:
          type: string
          enum:
            - workspace.updated
            - kitchen_ticket.updated
            - menu.sold_out
            - payment.requested
            - print_job.created
            - resource.updated
            - approval.requested
        id:
          type: string
        branch_id:
          type: string
        revision:
          type: integer
        lease_generation:
          type: integer
        at:
          type: string
          format: date-time
        refs:
          type: object
          additionalProperties:
            type: string
    Context:
      type: object
      additionalProperties: true
      required: [staff, store, administration, capabilities]
      properties:
        capabilities:
          type: array
          description: What the signed-in person may do at the selected branch, such as `pos.device.manage`.
          items:
            type: string
        staff:
          type: object
          additionalProperties: true
          required: [id, email]
          properties:
            id:
              type: string
            email:
              type: string
        store:
          type: object
          additionalProperties: true
          required: [id, currency]
          properties:
            id:
              type: string
            currency:
              type: string
        administration:
          type: object
          additionalProperties: true
          required: [read, write]
          properties:
            read:
              type: boolean
            write:
              type: boolean
    CatalogItem:
      type: object
      additionalProperties: true
      required: [product_id, price, stock_on_hand]
      properties:
        product_id:
          type: string
        price:
          type: string
        stock_on_hand:
          type: number
    TaxRow:
      type: object
      additionalProperties: true
      required: [rate, label, amount]
      properties:
        rate:
          type: string
        label:
          type: string
        amount:
          type: string
    Workspace:
      type: object
      additionalProperties: true
      required: [id, revision, operational_status, service_mode, business_date, totals]
      properties:
        id:
          type: string
        revision:
          type: integer
        operational_status:
          type: string
        service_mode:
          type: string
          enum: [counter, dine_in, takeaway, delivery, tab, timed]
        business_date:
          type: string
          format: date
        totals:
          type: object
          additionalProperties: true
          required: [taxes]
          properties:
            taxes:
              type: array
              items:
                type: object
                additionalProperties: true
                required: [rate, label, amount]
                properties:
                  rate:
                    type: string
                  label:
                    type: string
                  amount:
                    type: string
    Approval:
      type: object
      additionalProperties: true
      required: [id, branch_id, approver_id, requester_id, action, currency, revision, status, expires_at]
      properties:
        id:
          type: string
        branch_id:
          type: string
        approver_id:
          type: string
        requester_id:
          type: string
        action:
          type: string
        amount:
          type: [string, 'null']
        currency:
          type: string
        revision:
          type: [string, integer]
        status:
          type: string
        expires_at:
          type: string
    Device:
      type: object
      additionalProperties: true
      required: [id, name, mode, status, branch_id]
      properties:
        id:
          type: string
        name:
          type: string
        mode:
          type: string
          enum: [waiter, kds, expo, kiosk, print_station, owner, bridge]
        status:
          type: string
          enum: [active, revoked]
        branch_id:
          type: string
        platform:
          type: string
        last_seen_at:
          type: [string, 'null']
    DevicePairing:
      type: object
      additionalProperties: true
      required: [id, code, expires_at, mode, qr]
      properties:
        id:
          type: string
        code:
          type: string
        expires_at:
          type: string
        mode:
          type: string
        qr:
          type: object
          additionalProperties: true
          required: [v, kind, url, code]
          properties:
            v:
              type: integer
            kind:
              type: string
            url:
              type: string
            code:
              type: string
    DeviceSession:
      type: object
      additionalProperties: true
      required: [device, branch, server_time]
      properties:
        device:
          $ref: '#/components/schemas/Device'
        branch:
          type: object
          additionalProperties: true
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
            timezone:
              type: [string, 'null']
        register_id:
          type: [string, 'null']
        kitchen_station_id:
          type: [string, 'null']
        staff:
          description: The signed-in person, when the request carries a staff session.
          oneOf:
            - type: object
              additionalProperties: true
              required: [id]
              properties:
                id:
                  type: string
                name:
                  type: [string, 'null']
            - type: 'null'
        server_time:
          type: string
          format: date-time
          description: Shows clock skew for timers; a device never sends its own clock as data.
    DevicePairResult:
      type: object
      additionalProperties: true
      required: [device, token]
      properties:
        device:
          $ref: '#/components/schemas/Device'
        token:
          type: string
          description: 'Send as `Authorization: Device <token>`. Shown once.'
    DeviceStaffMember:
      type: object
      additionalProperties: true
      required: [id, name, pin_set]
      properties:
        id:
          type: string
          description: Staff membership id, sent back as `membership_id`.
        name:
          type: string
        pin_set:
          type: boolean
    DeviceStaffSignIn:
      type: object
      additionalProperties: true
      required: [token, expires_at, staff_id]
      properties:
        token:
          type: string
          description: Send as `X-Pos-Staff-Session`. Shown once.
        expires_at:
          type: string
          format: date-time
        staff_id:
          type: string
        name:
          type: [string, 'null']
    ErrorResponse:
      type: object
      additionalProperties: true
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: true
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
              description: >
                A 409 carries `reason` and, for a stale revision,
                `current_revision`.
              properties:
                reason:
                  type: string
                current_revision:
                  type: integer
                retry_after_seconds:
                  type: integer
    Printer:
      type: object
      additionalProperties: false
      required: [id, branch_id, name, connection, address, bluetooth_id, paper, command_language, roles, print_station_device_id, register_id, status, settings]
      properties:
        id:
          type: string
        branch_id:
          type: string
        name:
          type: string
        connection:
          type: string
          enum: [escpos_lan, escpos_bluetooth, sunmi_builtin, epson_epos, star_webprnt, browser]
        address:
          type: [string, 'null']
        bluetooth_id:
          type: [string, 'null']
        paper:
          type: string
          enum: [58mm, 80mm]
        command_language:
          type: string
          enum: [escpos, tspl]
        roles:
          type: array
          items:
            type: string
            enum: [receipt, prebill, kitchen_ticket, void_ticket, cup_label, checklist, table_qr]
        print_station_device_id:
          type: [string, 'null']
        register_id:
          type: [string, 'null']
        status:
          type: string
          enum: [active, disabled]
        settings:
          type: object
    PrintJob:
      type: object
      additionalProperties: false
      description: The queue view; a job's document goes only to its print station.
      required: [id, branch_id, printer_id, printer_name, kind, status, attempts, label, last_error, copy_of_id, created_at, printed_at, workspace_id, source_revision, printer_available, reprinted]
      properties:
        id:
          type: string
        branch_id:
          type: string
        printer_id:
          type: string
        printer_name:
          type: string
        kind:
          type: string
          enum: [receipt, prebill, kitchen_ticket, void_ticket, cup_label, checklist, table_qr, test]
        status:
          type: string
          enum: [queued, claimed, printed, failed, canceled]
        attempts:
          type: integer
        label:
          type: [string, 'null']
        last_error:
          type: [string, 'null']
        copy_of_id:
          type: [string, 'null']
        created_at:
          type: string
        printed_at:
          type: [string, 'null']
        workspace_id:
          type: [string, 'null']
          description: The order of a pre-bill.
        source_revision:
          type: [integer, 'null']
          description: The order's revision when the pre-bill was built.
        printer_available:
          type: boolean
          description: False when the printer is disabled or its print station is revoked, so a waiting job is stuck.
        reprinted:
          type: boolean
          description: A reprint of this job exists and was not canceled.
        reprint:
          type: object
          additionalProperties: false
          description: Listed pre-bills of open orders only. What the reader may do about reprinting.
          required: [workspace_revision, approval_id, requester_id, can_approve]
          properties:
            workspace_revision:
              type: integer
            approval_id:
              type: [string, 'null']
              description: A usable approval the reader can spend on this order.
            requester_id:
              type: [string, 'null']
              description: Who an approval would be granted to.
            can_approve:
              type: boolean
    PrintJobResult:
      type: object
      required: [print_job]
      properties:
        print_job:
          $ref: '#/components/schemas/PrintJob'
        print:
          type: object
        receipt:
          type: object
    PrintJobClaim:
      type: object
      additionalProperties: false
      required: [id, kind, attempt, claim_expires_at, printer, document]
      properties:
        id:
          type: string
        kind:
          type: string
        attempt:
          type: integer
          description: Send it back with the report.
        claim_expires_at:
          type: string
        printer:
          type: object
          additionalProperties: false
          required: [id, name, connection, address, bluetooth_id, paper, command_language, settings]
          properties:
            id:
              type: string
            name:
              type: string
            connection:
              type: string
            address:
              type: [string, 'null']
            bluetooth_id:
              type: [string, 'null']
            paper:
              type: string
            command_language:
              type: string
            settings:
              type: object
        document:
          $ref: '#/components/schemas/PrintDocument'
    PrintDocument:
      type: object
      additionalProperties: false
      description: >
        Version 1 of the neutral document a printer prints. Text is plain and
        unescaped: every printer language must escape it.
      required: [version, kind, documentType, page, banners, header, meta, lines, totals, payments, payQr, notes, footer, disclaimer]
      properties:
        version:
          const: 1
        kind:
          type: string
          enum: [receipt, prebill, kitchen_ticket, void_ticket, cup_label, checklist, table_qr, test]
        documentType:
          enum: [sale, prebill, payment_ticket, return, refund, shift_closure, null]
        page:
          $ref: '#/components/schemas/PrintPage'
        banners:
          type: array
          items:
            type: string
        header:
          type: array
          items:
            $ref: '#/components/schemas/PrintBlock'
        meta:
          type: array
          items:
            $ref: '#/components/schemas/PrintRow'
        lines:
          $ref: '#/components/schemas/PrintLines'
        totals:
          type: array
          items:
            $ref: '#/components/schemas/PrintRow'
        payments:
          type: array
          items:
            $ref: '#/components/schemas/PrintRow'
        payQr:
          oneOf:
            - $ref: '#/components/schemas/PrintPayQr'
            - type: 'null'
        notes:
          type: array
          items:
            type: string
        footer:
          type: array
          items:
            $ref: '#/components/schemas/PrintBlock'
        disclaimer:
          type: [string, 'null']
    PrintPage:
      type: object
      additionalProperties: false
      required: [margin_mm, font, font_size, line_spacing]
      properties:
        margin_mm:
          type: number
        font:
          enum: [sans, mono]
        font_size:
          enum: [s, m, l]
        line_spacing:
          type: number
        copies:
          type: integer
    PrintRow:
      type: object
      additionalProperties: false
      required: [label, value]
      properties:
        label:
          type: string
        value:
          type: string
        strong:
          type: boolean
    PrintPayQr:
      type: object
      additionalProperties: false
      required: [value, caption, lines]
      properties:
        value:
          type: string
        caption:
          type: string
        lines:
          type: array
          items:
            type: string
    PrintBlock:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, lines, align, bold, size]
          properties:
            kind:
              const: text
            lines:
              type: array
              items:
                type: string
            align:
              enum: [left, center, right]
            bold:
              type: boolean
            size:
              enum: [s, m, l]
        - type: object
          additionalProperties: false
          required: [kind, src, alt, widthPct, align, monochrome]
          properties:
            kind:
              const: image
            src:
              type: string
            alt:
              type: string
            widthPct:
              type: number
            align:
              enum: [left, center, right]
            monochrome:
              type: boolean
        - type: object
          additionalProperties: false
          required: [kind, value, caption, align]
          properties:
            kind:
              const: qr
            value:
              type: string
            caption:
              type: [string, 'null']
            align:
              enum: [left, center, right]
        - type: object
          additionalProperties: false
          required: [kind, value, align]
          properties:
            kind:
              const: barcode
            value:
              type: string
            align:
              enum: [left, center, right]
        - type: object
          additionalProperties: false
          required: [kind, parties]
          properties:
            kind:
              const: signatures
            parties:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [party, label]
                properties:
                  party:
                    enum: [buyer, seller, cashier]
                  label:
                    type: string
        - type: object
          additionalProperties: false
          required: [kind, title, number]
          properties:
            kind:
              const: title
            title:
              type: string
            number:
              type: [string, 'null']
        - type: object
          additionalProperties: false
          required: [kind, style]
          properties:
            kind:
              const: divider
            style:
              enum: [solid, dashed]
        - type: object
          additionalProperties: false
          required: [kind, mm]
          properties:
            kind:
              const: spacer
            mm:
              type: number
    PrintLines:
      oneOf:
        - type: object
          additionalProperties: false
          required: [layout, items]
          properties:
            layout:
              const: stacked
            items:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [index, name, amount, details]
                properties:
                  index:
                    type: [integer, 'null']
                  name:
                    type: string
                  amount:
                    type: [string, 'null']
                  details:
                    type: array
                    items:
                      type: string
        - type: object
          additionalProperties: false
          required: [layout, headings, columns, rows]
          properties:
            layout:
              const: table
            headings:
              type: object
              additionalProperties: false
              required: [index, name]
              properties:
                index:
                  type: [string, 'null']
                name:
                  type: string
            columns:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [key, label]
                properties:
                  key:
                    enum: [qty, price, discount, amount]
                  label:
                    type: string
            rows:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [index, name, cells, details]
                properties:
                  index:
                    type: [integer, 'null']
                  name:
                    type: string
                  cells:
                    type: array
                    items:
                      type: string
                  details:
                    type: array
                    items:
                      type: string
    SystemStatus:
      type: object
      additionalProperties: false
      required: [generated_at, version, server, database, jobs, realtime, printing, outbound, vietqr, backup]
      properties:
        generated_at:
          type: string
          format: date-time
        version:
          type: object
          additionalProperties: false
          required: [app, spree, rails]
          properties:
            app:
              type: string
              description: PARKVIET_VERSION baked into the image, `development` otherwise
            spree:
              type: string
            rails:
              type: string
        server:
          type: object
          additionalProperties: false
          required: [public_base_url, tls_mode]
          properties:
            public_base_url:
              type: [string, 'null']
              description: POS_PUBLIC_BASE_URL, the address in pairing QRs. Null when the QR uses the request origin.
            tls_mode:
              type: string
              enum: [none, internal, public, unset]
        database:
          type: object
          additionalProperties: false
          required: [ok, latency_ms]
          properties:
            ok:
              type: boolean
            latency_ms:
              type: [number, 'null']
        jobs:
          type: object
          additionalProperties: false
          required: [ok, in_puma, processes, ready, oldest_ready_age_seconds, failed]
          properties:
            ok:
              type: boolean
              description: A Solid Queue process heartbeated recently
            in_puma:
              type: [boolean, 'null']
            processes:
              type: [integer, 'null']
            ready:
              type: [integer, 'null']
            oldest_ready_age_seconds:
              type: [integer, 'null']
            failed:
              type: [integer, 'null']
        realtime:
          type: object
          additionalProperties: false
          required: [ok, adapter, probe_ms, measured_at]
          properties:
            ok:
              type: boolean
            adapter:
              type: string
            probe_ms:
              type: [number, 'null']
              description: One message through the pub/sub adapter, broadcast to delivery on the server. Excludes the hop to a device.
            measured_at:
              type: string
              format: date-time
        printing:
          type: object
          additionalProperties: false
          required: [pending, oldest_pending_age_seconds, failed_last_24h, failed_window_hours]
          properties:
            pending:
              type: integer
            oldest_pending_age_seconds:
              type: [integer, 'null']
            failed_last_24h:
              type: integer
            failed_window_hours:
              type: integer
        outbound:
          type: object
          additionalProperties: false
          required: [pending, failed, oldest_pending_age_seconds]
          description: Work waiting to leave the server (the outbox)
          properties:
            pending:
              type: integer
            failed:
              type: integer
            oldest_pending_age_seconds:
              type: [integer, 'null']
        vietqr:
          type: object
          additionalProperties: false
          required: [last_received_at, unmatched]
          properties:
            last_received_at:
              type: [string, 'null']
              format: date-time
            unmatched:
              type: integer
        backup:
          type: object
          additionalProperties: false
          required: [configured, last_at, count]
          properties:
            configured:
              type: boolean
              description: POS_BACKUP_DIR is set and mounted
            last_at:
              type: [string, 'null']
              format: date-time
            count:
              type: integer
