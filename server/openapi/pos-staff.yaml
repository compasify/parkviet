    post:
      operationId: posKitchenItemReady
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/KitchenTicketChanged'
        '409':
          $ref: '#/components/responses/KitchenRefused'
  /api/v3/admin/pos/kitchen/items/{id}/serve:
    post:
      operationId: posKitchenItemServe
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
