          type: object
          additionalProperties: false
          properties:
            name:
              type: [string, 'null']
            tax_code:
              type: [string, 'null']
            address:
              type: [string, 'null']
            outlet_code:
              type: [string, 'null']
            outlet_name:
              type: [string, 'null']
        lines:
          type: array
          items:
            $ref: '#/components/schemas/EinvoiceLine'
        totals:
          type: object
          additionalProperties: false
          properties:
            amount_before_tax:
              type: string
            tax_amount:
              type: string
            discount_total:
              type: string
            total:
              type: string
            taxes:
              type: array
