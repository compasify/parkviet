        warn_after_minutes:
          type: integer
        late_after_minutes:
          type: integer
        position:
          type: integer
        active:
          type: boolean
    KitchenStationInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
        kind:
          type: string
          enum: [prep, bar, expo]
        printer_id:
          type: [string, 'null']
        kds_enabled:
          type: boolean
        is_default:
          type: boolean
        warn_after_minutes:
          type: integer
          minimum: 1
          maximum: 240
        late_after_minutes:
          type: integer
          minimum: 1
          maximum: 240
        position:
          type: integer
          minimum: 0
        active:
          type: boolean
    KitchenStationList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/KitchenStation'
    KitchenStationResult:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/KitchenStation'
    StationRoute:
      type: object
      additionalProperties: false
      required: [id, branch_id, kitchen_station_id, product_id, product_name, kitchen_category, service_mode]
      properties:
        id:
          type: string
        branch_id:
          type: string
        kitchen_station_id:
          type: string
        product_id:
          type: [string, 'null']
        product_name:
          type: [string, 'null']
        kitchen_category:
          type: [string, 'null']
        service_mode:
          type: [string, 'null']
          description: Null for every service mode.
    StationRouteInput:
      type: object
      properties:
        kitchen_station_id:
          type: string
        product_id:
          type: [string, 'null']
        kitchen_category:
          type: [string, 'null']
        service_mode:
          type: [string, 'null']
    KitchenSettings:
      type: object
      additionalProperties: false
      required: [branch_id, kitchen_send_trigger, module_enabled]
      properties:
        branch_id:
          type: string
        kitchen_send_trigger:
          type: string
          enum: [on_complete, manual]
          description: >
            `on_complete` sends what is left as the sale completes; `manual`
            waits for "send to kitchen".
        module_enabled:
          type: boolean
          description: Whether `fnb.kitchen` is on at the branch.
    CallBoard:
      type: object
      additionalProperties: false
      required: [preparing, ready]
      description: >
        Call numbers of the business day. A number is preparing while any item
        is new or being made, and ready once every item is ready or served with
        some still waiting; it leaves when served or `pickup_minutes` after it
        became ready.
      properties:
        preparing:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [number, workspace_id]
            properties:
              number:
                type: integer
              workspace_id:
                type: string
        ready:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [number, workspace_id, guest_name, ready_at]
            properties:
              number:
                type: integer
              workspace_id:
                type: string
              guest_name:
                type: [string, 'null']
              ready_at:
                type: string
                format: date-time
    CupLabelSettings:
      type: object
      additionalProperties: false
      required: [branch_id, printer_id, size, fields, pickup_minutes, module_enabled, sizes, available_fields]
      properties:
        branch_id:
          type: string
        printer_id:
          type: [string, 'null']
        size:
          type: string
          enum: ['40x30', '50x30', '58x40']
          description: Label size in millimetres, width x height.
        fields:
          type: array
          description: Optional fields that print; the item and "n/N" always print.
          items:
            type: string
            enum: [call_number, options, note, guest_name, time, store_name]
        pickup_minutes:
          type: integer
          description: How long a ready call number stays on the call board.
        module_enabled:
          type: boolean
          description: Whether `fnb.cup_label` is on at the branch.
        sizes:
          type: array
          items:
            type: string
        available_fields:
          type: array
          items:
            type: string
    KitchenTicketItem:
      type: object
      additionalProperties: false
      required: [id, sale_line_id, name, modifiers, components, note, quantity, status, started_at, ready_at, served_at, voided_at]
      properties:
        id:
          type: string
        sale_line_id:
          type: string
        name:
          type: string
          description: The item and its size, as sold.
        modifiers:
          type: array
          items:
            type: object
            additionalProperties: true
            required: [name, quantity]
            properties:
              name:
                type: string
              group_name:
                type: [string, 'null']
              quantity:
                type: integer
        components:
          type: array
          description: The parts of a combo, when the combo shows them on the kitchen screen.
          items:
            type: object
            additionalProperties: true
            required: [name, quantity]
            properties:
              name:
                type: string
              quantity:
                type: string
        note:
          type: [string, 'null']
        quantity:
          type: string
        status:
          type: string
          enum: [new, preparing, ready, served, voided]
        started_at:
          type: [string, 'null']
          format: date-time
        ready_at:
          type: [string, 'null']
          format: date-time
        served_at:
          type: [string, 'null']
          format: date-time
        voided_at:
          type: [string, 'null']
          format: date-time
    KitchenTicket:
      type: object
      additionalProperties: false
      description: What one send told one station. Written once; only item statuses move.
      required: [id, workspace_id, branch_id, kitchen_station_id, station_name, station_kind, sequence, kind, service_mode, business_date, header, sent_at, done, done_at, items]
      properties:
        id:
          type: string
        workspace_id:
          type: string
        branch_id:
          type: string
        kitchen_station_id:
          type: string
        station_name:
          type: string
        station_kind:
          type: string
          enum: [prep, bar, expo]
        sequence:
          type: integer
          description: 1, 2, 3 … within the order.
        kind:
          type: string
          enum: [fire, void]
        service_mode:
          type: string
        business_date:
          type: string
          format: date
        header:
          type: object
          additionalProperties: true
          description: >
            Copied at the send - service mode, order source, customer name,
            note, register, and for counter service the call number
            (`order_number`) and the guest's name (`guest_name`). A delivery
            platform's order (`order_source` grabfood or shopeefood) adds the
            platform's order code (`platform_order_ref`) and the driver's
            pickup code (`pickup_code`).
        sent_at:
          type: string
          format: date-time
        done:
          type: boolean
        done_at:
          type: [string, 'null']
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/KitchenTicketItem'
    KitchenTicketResult:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/KitchenTicket'
