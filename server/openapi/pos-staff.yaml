          type: array
          items:
            type: string
        header:
          type: array
          items:
            $ref: '#/components/schemas/PrintBlock'
        meta:
          type: array
          items:
            $ref: '#/components/schemas/PrintRow'
        lines:
          $ref: '#/components/schemas/PrintLines'
        totals:
          type: array
          items:
            $ref: '#/components/schemas/PrintRow'
        payments:
          type: array
          items:
            $ref: '#/components/schemas/PrintRow'
