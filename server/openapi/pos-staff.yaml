        stations:
          type: array
          items:
            $ref: '#/components/schemas/KitchenStation'
        server_now:
          type: string
          format: date-time
          description: The database clock; screens run their timers from it.
        open:
          type: array
          description: Tickets with an item still to make, oldest first.
