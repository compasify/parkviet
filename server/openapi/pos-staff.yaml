    MenuMarginRow:
      type: object
      additionalProperties: false
      required: [menu_item, sku, quantity, revenue, cost, margin, margin_rate, costed]
      properties:
        menu_item:
          type: string
        sku:
          type: [string, 'null']
        quantity:
          type: integer
        revenue:
          type: string
        cost:
          type: string
        margin:
          type: string
        margin_rate:
          type: [string, 'null']
          description: Percent of revenue, one decimal
        costed:
          type: boolean
          description: Whether any recipe consumption was recorded for the size
    EinvoiceBuyer:
      type: object
      additionalProperties: false
      description: >
        Who the invoice is for. Empty is a sale to a consumer, printed with the
        store's consumer label. A tax code needs the registered name and address.
        `label` is set by the server when the invoice issues to a consumer.
      properties:
        tax_code:
          type: string
          pattern: '^\d{10}(-\d{3})?$'
        name:
          type: string
          maxLength: 400
        address:
          type: string
          maxLength: 400
        personal_id:
          type: string
          pattern: '^\d{12}$'
        phone:
          type: string
          maxLength: 15
        passport_no:
          type: string
          maxLength: 20
        nationality:
          type: string
          maxLength: 60
        email:
          type: string
          maxLength: 120
        buyer_note:
          type: string
          maxLength: 200
        label:
          type: string
    EinvoiceLine:
      type: object
      additionalProperties: false
      required: [position, kind, name, unit, quantity, unit_price, discount, tax_rate, tax_amount, amount_before_tax, amount,
                 price_includes_tax]
      properties:
        position:
          type: integer
        kind:
          type: string
          enum: [goods, service_charge, fee]
        name:
          type: string
        sku:
          type: [string, 'null']
        unit:
          type: string
        quantity:
          type: string
          description: Decimal; hours with two decimals for time-billed lines
        unit_price:
          type: string
          description: As sold; tax included when `price_includes_tax`
        discount:
          type: string
        tax_rate:
          type: [string, 'null']
          description: Percent, e.g. "8" or "10"; null when the line carries no tax line
        tax_amount:
          type: string
        amount_before_tax:
          type: string
        amount:
          type: string
          description: Paid amount with tax
        price_includes_tax:
          type: boolean
    Einvoice:
      type: object
      additionalProperties: false
      required: [id, order_id, order_number, workspace_id, branch_id, branch_name, relation, original_einvoice_id, invoice_type,
                 provider, status, buyer, seller, lines, totals, payment_method, currency, template_code, symbol, number,
                 cqt_code, lookup_code, lookup_url, issued_at, attempts, next_attempt_at, last_error, buyer_link_open,
                 buyer_token_expires_at, buyer_submitted_at, canceled_at, cancel_reason, completed_at, total, created_at]
      properties:
        id:
          type: string
        order_id:
          type: string
        order_number:
          type: string
        workspace_id:
          type: string
        branch_id:
          type: string
        branch_name:
          type: string
        relation:
          type: string
          enum: [original, replacement]
        original_einvoice_id:
          type: [string, 'null']
        invoice_type:
          type: string
          enum: [cash_register, coded]
        provider:
          type: [string, 'null']
        status:
          type: string
          enum: [pending, issuing, issued, failed, canceled, replaced, adjusted]
        buyer:
          $ref: '#/components/schemas/EinvoiceBuyer'
        seller:
          type: object
          additionalProperties: false
          properties:
            name:
              type: [string, 'null']
            tax_code:
              type: [string, 'null']
            address:
              type: [string, 'null']
            outlet_code:
              type: [string, 'null']
            outlet_name:
              type: [string, 'null']
        lines:
          type: array
          items:
            $ref: '#/components/schemas/EinvoiceLine'
        totals:
          type: object
          additionalProperties: false
          properties:
            amount_before_tax:
              type: string
            tax_amount:
              type: string
            discount_total:
              type: string
            total:
              type: string
            taxes:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [tax_rate, amount_before_tax, tax_amount]
                properties:
                  tax_rate:
                    type: [string, 'null']
                  amount_before_tax:
                    type: string
                  tax_amount:
                    type: string
        payment_method:
          type: [string, 'null']
          enum: [TM, CK, TM/CK, null]
        currency:
          type: string
        template_code:
          type: [string, 'null']
        symbol:
          type: [string, 'null']
        number:
          type: [string, 'null']
        cqt_code:
          type: [string, 'null']
          description: The tax authority's code
        lookup_code:
          type: [string, 'null']
        lookup_url:
          type: [string, 'null']
        issued_at:
          type: [string, 'null']
          format: date-time
        attempts:
          type: integer
        next_attempt_at:
          type: [string, 'null']
          format: date-time
        last_error:
          type: [string, 'null']
        buyer_link_open:
          type: boolean
          description: The buyer's own page still takes details
        buyer_token_expires_at:
          type: [string, 'null']
          format: date-time
        buyer_submitted_at:
          type: [string, 'null']
          format: date-time
        canceled_at:
          type: [string, 'null']
          format: date-time
        cancel_reason:
          type: [string, 'null']
        completed_at:
          type: [string, 'null']
          format: date-time
        total:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
    EinvoiceSettingInput:
      type: object
      additionalProperties: false
      properties:
        provider:
          type: string
          description: A registered provider key
        credentials:
          type: object
          description: Write-only provider fields; replaces the stored ones
          additionalProperties:
            type: string
        template_code:
          type: [string, 'null']
          pattern: '^[1-9]$'
        symbol:
          type: [string, 'null']
          pattern: '^[CKck]\d{2}[A-Za-z]{3}$'
        seller_name:
          type: [string, 'null']
        seller_tax_code:
          type: [string, 'null']
        seller_address:
          type: [string, 'null']
        consumer_label:
          type: [string, 'null']
          description: Printed for a buyer without details; default "Bán cho người tiêu dùng"
        lookup_url:
          type: [string, 'null']
        buyer_link_hours:
          type: [integer, 'null']
          minimum: 1
          maximum: 720
          description: Lifetime of the bill QR link; null keeps it until the end of the business day
        status:
          type: string
          enum: [active, disabled]
    EinvoiceSetting:
      type: object
      additionalProperties: false
      required: [id, branch_id, branch_name, provider, status, template_code, symbol, seller_name, seller_tax_code, seller_address,
                 consumer_label, lookup_url, buyer_link_hours, credential_fields, updated_at]
      properties:
        id:
          type: string
        branch_id:
          type: [string, 'null']
        branch_name:
          type: [string, 'null']
        provider:
          type: string
        status:
          type: string
          enum: [active, disabled]
        template_code:
          type: [string, 'null']
        symbol:
          type: [string, 'null']
        seller_name:
          type: [string, 'null']
        seller_tax_code:
          type: [string, 'null']
        seller_address:
          type: [string, 'null']
        consumer_label:
          type: [string, 'null']
        lookup_url:
          type: [string, 'null']
        buyer_link_hours:
          type: [integer, 'null']
        credential_fields:
          type: array
          description: Names of the credential fields that are set (never their values)
          items:
            type: string
        updated_at:
          type: [string, 'null']
          format: date-time
    EinvoiceSettings:
      type: object
      additionalProperties: false
      required: [einvoice_type, providers, settings, public_link]
      properties:
        einvoice_type:
          type: string
          enum: [none, cash_register, coded]
        providers:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [key, label, sandbox, credential_fields, tax_code_lookup]
            properties:
              key:
                type: string
              label:
                type: string
              sandbox:
                type: boolean
              credential_fields:
                type: array
                items:
                  type: string
              tax_code_lookup:
                type: boolean
        settings:
          type: array
          items:
            $ref: '#/components/schemas/EinvoiceSetting'
        public_link:
          type: boolean
          description: Whether the server has a public address for the bill QR (POS_PUBLIC_BASE_URL)
    EinvoiceSample:
      type: object
      additionalProperties: true
      required: [provider, number, symbol, lookup_code]
      properties:
        provider:
          type: string
        template_code:
          type: [string, 'null']
        symbol:
          type: [string, 'null']
        number:
          type: [string, 'null']
        cqt_code:
          type: [string, 'null']
        lookup_code:
          type: [string, 'null']
    EinvoiceSummary:
      type: object
      additionalProperties: false
      required: [einvoice_type, outstanding, counts, oldest_outstanding_at, revenue]
      properties:
        einvoice_type:
          type: string
          enum: [none, cash_register, coded]
        outstanding:
          type: integer
        counts:
          type: object
          additionalProperties:
            type: integer
        oldest_outstanding_at:
          type: [string, 'null']
          format: date-time
        revenue:
          type: object
          additionalProperties: false
          required: [year, total, threshold, share, level]
          properties:
            year:
              type: integer
            total:
              type: string
            threshold:
              type: string
            share:
              type: string
            level:
              type: string
              enum: [ok, warning, reached]
    ErrorResponse:
      type: object
      additionalProperties: true
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: true
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
              description: >
                A 409 carries `reason` and, for a stale revision,
                `current_revision`.
              properties:
                reason:
                  type: string
                current_revision:
                  type: integer
                retry_after_seconds:
                  type: integer
    Printer:
      type: object
