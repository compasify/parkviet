      type: object
      additionalProperties: false
      required: [margin_mm, font, font_size, line_spacing]
      properties:
        margin_mm:
          type: number
        font:
          enum: [sans, mono]
        font_size:
          enum: [s, m, l]
        line_spacing:
          type: number
        copies:
          type: integer
    PrintRow:
      type: object
      additionalProperties: false
      required: [label, value]
      properties:
        label:
          type: string
        value:
          type: string
        strong:
          type: boolean
    PrintPayQr:
      type: object
      additionalProperties: false
      required: [value, caption, lines]
      properties:
        value:
          type: string
        caption:
          type: string
        lines:
          type: array
          items:
            type: string
    PrintBlock:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, lines, align, bold, size]
          properties:
            kind:
              const: text
            lines:
              type: array
              items:
                type: string
            align:
              enum: [left, center, right]
            bold:
              type: boolean
            size:
              enum: [s, m, l]
        - type: object
          additionalProperties: false
          required: [kind, src, alt, widthPct, align, monochrome]
          properties:
            kind:
              const: image
            src:
              type: string
            alt:
              type: string
            widthPct:
              type: number
            align:
              enum: [left, center, right]
            monochrome:
              type: boolean
        - type: object
          additionalProperties: false
          required: [kind, value, caption, align]
          properties:
            kind:
              const: qr
            value:
              type: string
            caption:
              type: [string, 'null']
            align:
              enum: [left, center, right]
        - type: object
          additionalProperties: false
          required: [kind, value, align]
          properties:
            kind:
              const: barcode
            value:
              type: string
            align:
              enum: [left, center, right]
        - type: object
          additionalProperties: false
          required: [kind, parties]
          properties:
            kind:
              const: signatures
            parties:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [party, label]
                properties:
                  party:
                    enum: [buyer, seller, cashier]
                  label:
                    type: string
        - type: object
          additionalProperties: false
          required: [kind, title, number]
          properties:
            kind:
              const: title
            title:
              type: string
            number:
              type: [string, 'null']
        - type: object
          additionalProperties: false
          required: [kind, style]
          properties:
            kind:
              const: divider
            style:
              enum: [solid, dashed]
        - type: object
          additionalProperties: false
          required: [kind, mm]
          properties:
            kind:
              const: spacer
            mm:
              type: number
    PrintLines:
      oneOf:
        - type: object
          additionalProperties: false
          required: [layout, items]
          properties:
            layout:
              const: stacked
            items:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [index, name, amount, details]
                properties:
                  index:
                    type: [integer, 'null']
                  name:
                    type: string
                  amount:
                    type: [string, 'null']
                  details:
                    type: array
                    items:
                      type: string
        - type: object
          additionalProperties: false
          required: [layout, headings, columns, rows]
          properties:
            layout:
              const: table
            headings:
              type: object
              additionalProperties: false
              required: [index, name]
              properties:
                index:
                  type: [string, 'null']
                name:
                  type: string
            columns:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [key, label]
                properties:
                  key:
                    enum: [qty, price, discount, amount]
                  label:
                    type: string
            rows:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [index, name, cells, details]
                properties:
                  index:
                    type: [integer, 'null']
                  name:
                    type: string
                  cells:
                    type: array
                    items:
                      type: string
                  details:
                    type: array
                    items:
                      type: string
    SystemStatus:
      type: object
      additionalProperties: false
      required: [generated_at, version, server, database, jobs, realtime, printing, outbound, vietqr, backup]
      properties:
        generated_at:
          type: string
          format: date-time
        version:
          type: object
          additionalProperties: false
          required: [app, spree, rails]
          properties:
            app:
              type: string
              description: PARKVIET_VERSION baked into the image, `development` otherwise
            spree:
              type: string
            rails:
              type: string
        server:
          type: object
          additionalProperties: false
          required: [public_base_url, tls_mode]
          properties:
            public_base_url:
              type: [string, 'null']
              description: POS_PUBLIC_BASE_URL, the address in pairing QRs. Null when the QR uses the request origin.
            tls_mode:
              type: string
              enum: [none, internal, public, unset]
        database:
          type: object
          additionalProperties: false
          required: [ok, latency_ms]
          properties:
            ok:
              type: boolean
            latency_ms:
              type: [number, 'null']
        jobs:
          type: object
          additionalProperties: false
          required: [ok, in_puma, processes, ready, oldest_ready_age_seconds, failed]
          properties:
            ok:
              type: boolean
              description: A Solid Queue process heartbeated recently
            in_puma:
              type: [boolean, 'null']
            processes:
              type: [integer, 'null']
            ready:
              type: [integer, 'null']
            oldest_ready_age_seconds:
              type: [integer, 'null']
            failed:
              type: [integer, 'null']
        realtime:
          type: object
          additionalProperties: false
          required: [ok, adapter, probe_ms, measured_at]
          properties:
            ok:
              type: boolean
            adapter:
              type: string
            probe_ms:
              type: [number, 'null']
              description: One message through the pub/sub adapter, broadcast to delivery on the server. Excludes the hop to a device.
            measured_at:
              type: string
              format: date-time
        printing:
          type: object
          additionalProperties: false
          required: [pending, oldest_pending_age_seconds, failed_last_24h, failed_window_hours]
          properties:
            pending:
              type: integer
            oldest_pending_age_seconds:
              type: [integer, 'null']
            failed_last_24h:
              type: integer
            failed_window_hours:
              type: integer
        outbound:
          type: object
          additionalProperties: false
          required: [pending, failed, oldest_pending_age_seconds]
          description: Work waiting to leave the server (the outbox)
          properties:
            pending:
              type: integer
            failed:
              type: integer
            oldest_pending_age_seconds:
              type: [integer, 'null']
        vietqr:
          type: object
          additionalProperties: false
          required: [last_received_at, unmatched]
          properties:
            last_received_at:
              type: [string, 'null']
              format: date-time
            unmatched:
              type: integer
        backup:
          type: object
          additionalProperties: false
          required: [configured, last_at, count]
          properties:
            configured:
              type: boolean
              description: POS_BACKUP_DIR is set and mounted
            last_at:
              type: [string, 'null']
              format: date-time
            count:
              type: integer
