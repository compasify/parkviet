              type: string
              description: PARKVIET_VERSION baked into the image, `development` otherwise
            spree:
              type: string
            rails:
              type: string
        server:
          type: object
          additionalProperties: false
          required: [public_base_url, tls_mode]
          properties:
            public_base_url:
              type: [string, 'null']
              description: POS_PUBLIC_BASE_URL, the address in pairing QRs. Null when the QR uses the request origin.
            tls_mode:
              type: string
              enum: [none, internal, public, unset]
        database:
          type: object
          additionalProperties: false
          required: [ok, latency_ms]
          properties:
            ok:
              type: boolean
            latency_ms:
              type: [number, 'null']
        jobs:
          type: object
          additionalProperties: false
          required: [ok, in_puma, processes, ready, oldest_ready_age_seconds, failed]
          properties:
            ok:
              type: boolean
              description: A Solid Queue process heartbeated recently
            in_puma:
              type: [boolean, 'null']
            processes:
              type: [integer, 'null']
            ready:
              type: [integer, 'null']
            oldest_ready_age_seconds:
              type: [integer, 'null']
            failed:
              type: [integer, 'null']
        realtime:
          type: object
          additionalProperties: false
          required: [ok, adapter, probe_ms, measured_at]
          properties:
            ok:
              type: boolean
            adapter:
              type: string
            probe_ms:
              type: [number, 'null']
              description: One message through the pub/sub adapter, broadcast to delivery on the server. Excludes the hop to a device.
            measured_at:
              type: string
              format: date-time
        printing:
          type: object
          additionalProperties: false
          required: [pending, oldest_pending_age_seconds, failed_last_24h, failed_window_hours]
          properties:
            pending:
              type: integer
            oldest_pending_age_seconds:
              type: [integer, 'null']
            failed_last_24h:
              type: integer
            failed_window_hours:
              type: integer
        outbound:
          type: object
          additionalProperties: false
          required: [pending, failed, oldest_pending_age_seconds]
          description: Work waiting to leave the server (the outbox)
          properties:
            pending:
              type: integer
            failed:
              type: integer
            oldest_pending_age_seconds:
              type: [integer, 'null']
        vietqr:
          type: object
          additionalProperties: false
          required: [last_received_at, unmatched]
          properties:
            last_received_at:
              type: [string, 'null']
              format: date-time
            unmatched:
              type: integer
        backup:
          type: object
          additionalProperties: false
          required: [configured, last_at, count]
          properties:
            configured:
              type: boolean
              description: POS_BACKUP_DIR is set and mounted
            last_at:
              type: [string, 'null']
              format: date-time
            count:
              type: integer
