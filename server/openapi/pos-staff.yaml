      required: [id, branch_id, name, connection, address, bluetooth_id, paper, command_language, roles, print_station_device_id, register_id, status, settings]
      properties:
        id:
          type: string
        branch_id:
          type: string
        name:
          type: string
        connection:
          type: string
          enum: [escpos_lan, escpos_bluetooth, sunmi_builtin, epson_epos, star_webprnt, browser]
        address:
          type: [string, 'null']
        bluetooth_id:
          type: [string, 'null']
        paper:
          type: string
          enum: [58mm, 80mm]
        command_language:
          type: string
          enum: [escpos, tspl]
        roles:
          type: array
          items:
            type: string
            enum: [receipt, prebill, kitchen_ticket, void_ticket, cup_label, checklist, table_qr]
        print_station_device_id:
          type: [string, 'null']
        register_id:
          type: [string, 'null']
        status:
          type: string
          enum: [active, disabled]
        settings:
          type: object
    PrintJob:
      type: object
      additionalProperties: false
      description: The queue view; a job's document goes only to its print station.
      required: [id, branch_id, printer_id, printer_name, kind, status, attempts, label, last_error, copy_of_id, created_at, printed_at, workspace_id, source_revision, printer_available, reprinted]
      properties:
        id:
          type: string
        branch_id:
          type: string
        printer_id:
          type: string
        printer_name:
          type: string
        kind:
          type: string
          enum: [receipt, prebill, kitchen_ticket, void_ticket, cup_label, checklist, table_qr, test]
        status:
          type: string
          enum: [queued, claimed, printed, failed, canceled]
        attempts:
          type: integer
        label:
          type: [string, 'null']
        last_error:
          type: [string, 'null']
        copy_of_id:
          type: [string, 'null']
        created_at:
          type: string
        printed_at:
          type: [string, 'null']
        workspace_id:
          type: [string, 'null']
          description: The order of a pre-bill.
        source_revision:
          type: [integer, 'null']
          description: The order's revision when the pre-bill was built.
        printer_available:
          type: boolean
          description: False when the printer is disabled or its print station is revoked, so a waiting job is stuck.
        reprinted:
          type: boolean
          description: A reprint of this job exists and was not canceled.
        reprint:
          type: object
          additionalProperties: false
          description: Listed pre-bills of open orders only. What the reader may do about reprinting.
          required: [workspace_revision, approval_id, requester_id, can_approve]
          properties:
            workspace_revision:
              type: integer
            approval_id:
              type: [string, 'null']
              description: A usable approval the reader can spend on this order.
            requester_id:
              type: [string, 'null']
              description: Who an approval would be granted to.
            can_approve:
              type: boolean
    PrintJobResult:
      type: object
      required: [print_job]
      properties:
