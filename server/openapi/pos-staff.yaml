        kind:
          type: string
          enum: [receipt, prebill, kitchen_ticket, void_ticket, cup_label, checklist, table_qr, test]
        status:
          type: string
          enum: [queued, claimed, printed, failed, canceled]
        attempts:
          type: integer
        label:
          type: [string, 'null']
        last_error:
          type: [string, 'null']
        copy_of_id:
          type: [string, 'null']
        created_at:
          type: string
        printed_at:
          type: [string, 'null']
        workspace_id:
          type: [string, 'null']
          description: The order of a pre-bill.
        source_revision:
          type: [integer, 'null']
          description: The order's revision when the pre-bill was built.
        printer_available:
          type: boolean
          description: False when the printer is disabled or its print station is revoked, so a waiting job is stuck.
        reprinted:
          type: boolean
          description: A reprint of this job exists and was not canceled.
        reprint:
          type: object
          additionalProperties: false
          description: Listed pre-bills of open orders only. What the reader may do about reprinting.
          required: [workspace_revision, approval_id, requester_id, can_approve]
          properties:
            workspace_revision:
              type: integer
            approval_id:
              type: [string, 'null']
              description: A usable approval the reader can spend on this order.
            requester_id:
              type: [string, 'null']
              description: Who an approval would be granted to.
            can_approve:
              type: boolean
    PrintJobResult:
      type: object
      required: [print_job]
      properties:
        print_job:
          $ref: '#/components/schemas/PrintJob'
        print:
          type: object
        receipt:
          type: object
    PrintJobClaim:
      type: object
      additionalProperties: false
      required: [id, kind, attempt, claim_expires_at, printer, document]
      properties:
        id:
          type: string
        kind:
          type: string
        attempt:
          type: integer
          description: Send it back with the report.
        claim_expires_at:
          type: string
        printer:
          type: object
          additionalProperties: false
          required: [id, name, connection, address, bluetooth_id, paper, command_language, settings]
          properties:
            id:
              type: string
            name:
              type: string
            connection:
              type: string
            address:
              type: [string, 'null']
            bluetooth_id:
              type: [string, 'null']
            paper:
              type: string
            command_language:
              type: string
            settings:
              type: object
        document:
          $ref: '#/components/schemas/PrintDocument'
    PrintDocument:
      type: object
      additionalProperties: false
      description: >
        Version 1 of the neutral document a printer prints. Text is plain and
        unescaped: every printer language must escape it.
      required: [version, kind, documentType, page, banners, header, meta, lines, totals, payments, payQr, notes, footer, disclaimer]
      properties:
        version:
          const: 1
        kind:
          type: string
          enum: [receipt, prebill, kitchen_ticket, void_ticket, cup_label, checklist, table_qr, test]
        documentType:
          enum: [sale, prebill, payment_ticket, return, refund, shift_closure, null]
        page:
          $ref: '#/components/schemas/PrintPage'
        banners:
          type: array
          items:
            type: string
        header:
          type: array
          items:
            $ref: '#/components/schemas/PrintBlock'
        meta:
          type: array
          items:
            $ref: '#/components/schemas/PrintRow'
        lines:
          $ref: '#/components/schemas/PrintLines'
        totals:
          type: array
          items:
            $ref: '#/components/schemas/PrintRow'
        payments:
          type: array
          items:
            $ref: '#/components/schemas/PrintRow'
        payQr:
          oneOf:
            - $ref: '#/components/schemas/PrintPayQr'
            - type: 'null'
        notes:
          type: array
          items:
            type: string
        footer:
          type: array
          items:
            $ref: '#/components/schemas/PrintBlock'
        disclaimer:
          type: [string, 'null']
    PrintPage:
      type: object
      additionalProperties: false
      required: [margin_mm, font, font_size, line_spacing]
      properties:
        margin_mm:
          type: number
        font:
          enum: [sans, mono]
        font_size:
          enum: [s, m, l]
        line_spacing:
          type: number
        copies:
          type: integer
        label:
          type: object
          additionalProperties: false
          required: [width_mm, height_mm]
          description: Label stock a label printer feeds (cup labels); absent for a roll.
          properties:
            width_mm:
              type: integer
            height_mm:
              type: integer
    PrintRow:
      type: object
      additionalProperties: false
      required: [label, value]
      properties:
        label:
          type: string
        value:
          type: string
        strong:
          type: boolean
    PrintPayQr:
      type: object
      additionalProperties: false
      required: [value, caption, lines]
      properties:
        value:
          type: string
        caption:
          type: string
        lines:
          type: array
          items:
            type: string
    PrintBlock:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, lines, align, bold, size]
          properties:
            kind:
              const: text
            lines:
              type: array
              items:
                type: string
            align:
              enum: [left, center, right]
            bold:
              type: boolean
            size:
              enum: [s, m, l]
            invert:
              type: boolean
              description: White on black (a kitchen note). Absent means false.
        - type: object
          additionalProperties: false
          required: [kind, src, alt, widthPct, align, monochrome]
          properties:
            kind:
              const: image
            src:
              type: string
            alt:
              type: string
            widthPct:
              type: number
            align:
              enum: [left, center, right]
            monochrome:
              type: boolean
        - type: object
          additionalProperties: false
          required: [kind, value, caption, align]
          properties:
            kind:
              const: qr
            value:
              type: string
            caption:
              type: [string, 'null']
            align:
              enum: [left, center, right]
        - type: object
          additionalProperties: false
          required: [kind, value, align]
          properties:
            kind:
              const: barcode
            value:
              type: string
            align:
              enum: [left, center, right]
        - type: object
          additionalProperties: false
          required: [kind, parties]
          properties:
            kind:
              const: signatures
            parties:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [party, label]
                properties:
                  party:
                    enum: [buyer, seller, cashier]
                  label:
                    type: string
        - type: object
          additionalProperties: false
          required: [kind, title, number]
          properties:
            kind:
              const: title
            title:
              type: string
            number:
              type: [string, 'null']
        - type: object
          additionalProperties: false
          required: [kind, style]
          properties:
            kind:
              const: divider
            style:
              enum: [solid, dashed]
        - type: object
          additionalProperties: false
          required: [kind, mm]
          properties:
            kind:
              const: spacer
            mm:
              type: number
    PrintLines:
      oneOf:
        - type: object
          additionalProperties: false
          required: [layout, items]
          properties:
            layout:
              const: stacked
            items:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [index, name, amount, details]
                properties:
                  index:
                    type: [integer, 'null']
                  name:
                    type: string
                  amount:
                    type: [string, 'null']
                  details:
                    type: array
                    items:
                      type: string
        - type: object
          additionalProperties: false
          required: [layout, headings, columns, rows]
          properties:
            layout:
              const: table
            headings:
              type: object
              additionalProperties: false
              required: [index, name]
              properties:
                index:
                  type: [string, 'null']
                name:
                  type: string
            columns:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [key, label]
                properties:
                  key:
                    enum: [qty, price, discount, amount]
                  label:
                    type: string
            rows:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [index, name, cells, details]
                properties:
                  index:
                    type: [integer, 'null']
                  name:
                    type: string
                  cells:
                    type: array
                    items:
                      type: string
                  details:
                    type: array
                    items:
                      type: string
    KitchenStation:
      type: object
      additionalProperties: false
      required: [id, branch_id, name, kind, printer_id, printer_name, kds_enabled, is_default, warn_after_minutes, late_after_minutes, position, active,
                 expo_station_id]
      properties:
        expo_station_id:
          type: [string, 'null']
          description: The pass (an `expo` station of the branch) this station hands its finished items to.
        id:
          type: string
        branch_id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [prep, bar, expo]
        printer_id:
          type: [string, 'null']
        printer_name:
          type: [string, 'null']
        kds_enabled:
          type: boolean
        is_default:
          type: boolean
          description: Where a menu item goes when no route names it.
        warn_after_minutes:
          type: integer
        late_after_minutes:
          type: integer
        position:
          type: integer
        active:
          type: boolean
    KitchenStationInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
        kind:
          type: string
          enum: [prep, bar, expo]
        printer_id:
          type: [string, 'null']
        expo_station_id:
          type: [string, 'null']
          description: An `expo` station of the same branch; null hands nothing to a pass.
        kds_enabled:
          type: boolean
        is_default:
          type: boolean
        warn_after_minutes:
          type: integer
          minimum: 1
          maximum: 240
        late_after_minutes:
          type: integer
          minimum: 1
          maximum: 240
        position:
          type: integer
          minimum: 0
        active:
          type: boolean
    KitchenStationList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/KitchenStation'
    KitchenStationResult:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/KitchenStation'
    StationRoute:
      type: object
      additionalProperties: false
      required: [id, branch_id, kitchen_station_id, product_id, product_name, kitchen_category, service_mode]
      properties:
        id:
          type: string
        branch_id:
          type: string
        kitchen_station_id:
          type: string
        product_id:
          type: [string, 'null']
        product_name:
          type: [string, 'null']
        kitchen_category:
          type: [string, 'null']
        service_mode:
          type: [string, 'null']
          description: Null for every service mode.
    StationRouteInput:
      type: object
      properties:
        kitchen_station_id:
          type: string
        product_id:
          type: [string, 'null']
        kitchen_category:
          type: [string, 'null']
        service_mode:
          type: [string, 'null']
    KitchenSettings:
      type: object
      additionalProperties: false
      required: [branch_id, kitchen_send_trigger, module_enabled, void_reasons]
      properties:
        branch_id:
          type: string
        kitchen_send_trigger:
          type: string
          enum: [on_complete, manual]
          description: >
            `on_complete` sends what is left as the sale completes; `manual`
            waits for "send to kitchen".
        module_enabled:
          type: boolean
          description: Whether `fnb.kitchen` is on at the branch.
        void_reasons:
          type: array
          description: Reasons a sent item may be voided for, in order; `khac` with a note is always offered.
          items:
            type: string
    MenuItemsMeta:
      type: object
      additionalProperties: false
      required: [tax_defaults]
      properties:
        tax_defaults:
          $ref: '#/components/schemas/MenuTaxDefaults'
    MenuTaxDefaults:
      type: object
      additionalProperties: false
      required: [food, alcohol]
      description: Tax categories new menu items start with, chosen in the F&B setup step.
      properties:
        food:
          type: string
          nullable: true
        alcohol:
          type: string
          nullable: true
    HardwareStatus:
      type: object
      additionalProperties: false
      required: [branch_id, generated_at, checks, printers, stations, devices, customer_displays, server, einvoice]
      properties:
        branch_id:
          type: string
        generated_at:
          type: string
          format: date-time
        checks:
          type: array
          items:
            $ref: '#/components/schemas/HardwareCheck'
        printers:
          type: array
          items:
            $ref: '#/components/schemas/HardwarePrinter'
        stations:
          type: array
          items:
            $ref: '#/components/schemas/HardwareStation'
        devices:
          type: array
          items:
            $ref: '#/components/schemas/HardwareDevice'
        customer_displays:
          $ref: '#/components/schemas/HardwareDisplays'
        server:
          $ref: '#/components/schemas/HardwareServer'
        einvoice:
          $ref: '#/components/schemas/HardwareEinvoice'
    HardwareCheck:
      type: object
      additionalProperties: false
      required: [key, status]
      properties:
        key:
          type: string
          enum: [receipt_printer, kitchen_printer, cup_label_printer, kitchen_stations, print_station, customer_display,
                 server, einvoice]
        status:
          type: string
          enum: [ok, attention, not_needed]
          description: >
            `not_needed` when the branch does not use it (module or feature
            off, no printer behind a print station, no e-invoices).
    HardwarePrinter:
      type: object
      additionalProperties: false
      required: [id, name, connection, roles, via_print_station, last_job_status, last_job_kind, last_job_at, last_error]
      properties:
        id:
          type: string
        name:
          type: string
        connection:
          type: string
        roles:
          type: array
          items:
            type: string
        via_print_station:
          type: boolean
        last_job_status:
          type: string
          nullable: true
          description: queued, claimed, printed, failed or canceled; null before the first job.
        last_job_kind:
          type: string
          nullable: true
        last_job_at:
          type: string
          format: date-time
          nullable: true
        last_error:
          type: string
          nullable: true
    HardwareStation:
      type: object
      additionalProperties: false
      required: [id, name, kind, printer_id, kds_devices, ok]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [prep, bar, expo]
        printer_id:
          type: string
          nullable: true
          description: Its printer, when that printer is active.
        kds_devices:
          type: integer
          description: Kitchen screens showing it (a screen with no station shows every station).
        ok:
          type: boolean
    HardwareDevice:
      type: object
      additionalProperties: false
      required: [id, name, mode, kitchen_station_id, last_seen_at, online]
      properties:
        id:
          type: string
        name:
          type: string
        mode:
          type: string
          enum: [kds, expo, print_station]
        kitchen_station_id:
          type: string
          nullable: true
        last_seen_at:
          type: string
          format: date-time
          nullable: true
        online:
          type: boolean
    HardwareDisplays:
      type: object
      additionalProperties: false
      required: [live]
      properties:
        live:
          type: integer
          description: Customer displays paired and not expired.
    HardwareServer:
      type: object
      additionalProperties: false
      required: [public_base_url, tls_mode, outbound_pending, outbound_failed, outbound_oldest_pending_age_seconds,
                 vietqr_last_received_at]
      properties:
        public_base_url:
          type: string
          nullable: true
        tls_mode:
          type: string
        outbound_pending:
          type: integer
        outbound_failed:
          type: integer
        outbound_oldest_pending_age_seconds:
          type: integer
          nullable: true
        vietqr_last_received_at:
          type: string
          format: date-time
          nullable: true
    HardwareEinvoice:
      type: object
      additionalProperties: false
      required: [type, provider, configured, missing_fields]
      properties:
        type:
          type: string
          enum: [none, cash_register, coded]
        provider:
          type: string
          nullable: true
        configured:
          type: boolean
        missing_fields:
          type: array
          items:
            type: string
    CallBoard:
      type: object
      additionalProperties: false
      required: [preparing, ready]
      description: >
        Call numbers of the business day. A number is preparing while any item
        is new or being made, and ready once every item is ready or served with
        some still waiting; it leaves when served or `pickup_minutes` after it
        became ready.
      properties:
        preparing:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [number, workspace_id]
            properties:
              number:
                type: integer
              workspace_id:
                type: string
        ready:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [number, workspace_id, guest_name, ready_at]
            properties:
              number:
                type: integer
              workspace_id:
                type: string
              guest_name:
                type: [string, 'null']
              ready_at:
                type: string
                format: date-time
    CupLabelSettings:
      type: object
      additionalProperties: false
      required: [branch_id, printer_id, size, fields, pickup_minutes, module_enabled, sizes, available_fields]
      properties:
        branch_id:
          type: string
        printer_id:
          type: [string, 'null']
        size:
          type: string
          enum: ['40x30', '50x30', '58x40']
          description: Label size in millimetres, width x height.
        fields:
          type: array
          description: Optional fields that print; the item and "n/N" always print.
          items:
            type: string
            enum: [call_number, options, note, guest_name, time, store_name]
        pickup_minutes:
          type: integer
          description: How long a ready call number stays on the call board.
        module_enabled:
          type: boolean
          description: Whether `fnb.cup_label` is on at the branch.
        sizes:
          type: array
          items:
            type: string
        available_fields:
          type: array
          items:
            type: string
    KitchenTicketItem:
      type: object
      additionalProperties: false
      required: [id, sale_line_id, name, modifiers, components, note, quantity, status, started_at, ready_at, served_at, voided_at,
                 recalled_at, recall_count, prep_seconds, late, seat, course]
      properties:
        seat:
          type: [integer, 'null']
          description: The seat that ordered it, from its sale line.
        course:
          type: [integer, 'null']
          description: The course of its sale line (1 starter, 2 main…).
        recalled_at:
          type: [string, 'null']
          format: date-time
          description: The last time the item was called back to the kitchen.
        recall_count:
          type: integer
          minimum: 0
        prep_seconds:
          type: [integer, 'null']
          description: From the send to ready, written when the item became ready.
        late:
          type: boolean
          description: It took longer than its station's red threshold.
        id:
          type: string
        sale_line_id:
          type: [string, 'null']
          description: Null once the line was voided off the order; the ticket keeps what it said.
        name:
          type: string
          description: The item and its size, as sold.
        modifiers:
          type: array
          items:
            type: object
            additionalProperties: true
            required: [name, quantity]
            properties:
              name:
                type: string
              group_name:
                type: [string, 'null']
              quantity:
                type: integer
        components:
          type: array
          description: The parts of a combo, when the combo shows them on the kitchen screen.
          items:
            type: object
            additionalProperties: true
            required: [name, quantity]
            properties:
              name:
                type: string
              quantity:
                type: string
        note:
          type: [string, 'null']
        quantity:
          type: string
        status:
          type: string
          enum: [new, preparing, ready, served, voided]
        started_at:
          type: [string, 'null']
          format: date-time
        ready_at:
          type: [string, 'null']
          format: date-time
        served_at:
          type: [string, 'null']
          format: date-time
        voided_at:
          type: [string, 'null']
          format: date-time
    KitchenTicket:
      type: object
      additionalProperties: false
      description: What one send told one station. Written once; only item statuses move.
      required: [id, workspace_id, branch_id, kitchen_station_id, station_name, station_kind, sequence, kind, service_mode, business_date, header, sent_at, done, done_at, items]
      properties:
        id:
          type: string
        workspace_id:
          type: string
        branch_id:
          type: string
        kitchen_station_id:
          type: string
        station_name:
          type: string
        station_kind:
          type: string
          enum: [prep, bar, expo]
        sequence:
          type: integer
          description: 1, 2, 3 … within the order.
        kind:
          type: string
          enum: [fire, void]
        service_mode:
          type: string
        business_date:
          type: string
          format: date
        header:
          type: object
          additionalProperties: true
          description: >
            Copied at the send - service mode, order source, customer name,
            note, register, and for counter service the call number
            (`order_number`) and the guest's name (`guest_name`). A delivery
            platform's order (`order_source` grabfood or shopeefood) adds the
            platform's order code (`platform_order_ref`) and the driver's
            pickup code (`pickup_code`). A table order names its table and
            order letter (`table`). A `void` ticket lists the items taken
            back, with the reason as their note.
        sent_at:
          type: string
          format: date-time
        done:
          type: boolean
        done_at:
          type: [string, 'null']
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/KitchenTicketItem'
    KitchenTicketResult:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/KitchenTicket'
    KitchenOrderServedResult:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [workspace_id, tickets]
          properties:
            workspace_id:
              type: string
            tickets:
              type: array
              items:
                $ref: '#/components/schemas/KitchenTicket'
    KitchenBoard:
      type: object
      additionalProperties: false
      required: [branch_id, station, stations, service_mode, server_now, open, done, all_day, expo, held]
      properties:
        branch_id:
          type: string
        station:
          description: The one station shown; null for several or every station.
          oneOf:
            - $ref: '#/components/schemas/KitchenStation'
            - type: 'null'
        stations:
          type: array
          description: The stations shown.
          items:
            $ref: '#/components/schemas/KitchenStation'
        service_mode:
          type: [string, 'null']
          description: The way of serving the board is narrowed to; null for all.
        server_now:
          type: string
          format: date-time
          description: The database clock; screens run their timers from it.
        open:
          type: array
          description: >
            Tickets with an item still to make: tickets past their station's
            red threshold first, then the oldest.
          items:
            $ref: '#/components/schemas/KitchenTicket'
        done:
          type: array
          description: Tickets finished in the last 30 minutes, newest first.
          items:
            $ref: '#/components/schemas/KitchenTicket'
        all_day:
          type: array
          description: The open items added up by dish and options, in the order the oldest of each was sent.
          items:
            $ref: '#/components/schemas/KitchenAllDayRow'
        expo:
          type: array
          description: >
            Ready items waiting at the pass, by order: from the stations that
            hand to the shown `expo` stations, or every ready item when no
            station is chosen. Items leave once served or after two hours.
          items:
            $ref: '#/components/schemas/KitchenExpoOrder'
        held:
          type: array
          description: >
            Held courses of open table orders, waiting at the pass for their
            fire, one row per order and course, oldest first. Only on the
            board of every station or of a chosen `expo` station; nothing of
            them has reached a station yet.
          items:
