openapi: 3.1.0
info:
  title: Parkviet POS staff API
  version: '1'
  description: >
    Staff contract for context, catalog, workspaces and approvals, and the
    device channel. A paired device reaches the /admin/pos paths with
    `Authorization: Device <token>` and `X-Pos-Staff-Session`.
x-realtime:
  transport: Action Cable
  path: /cable
  channel: Spree::Pos::BranchChannel
  subscribeParams:
    branch_id: Prefixed id of the branch
  stream: pos:branch:<branch_prefixed_id>
  message:
    $ref: '#/components/schemas/RealtimeEvent'
  authentication:
    staff: Query `token` holding the Admin API JWT. Needs an allowed Origin.
    device: >
      Subprotocol `pos-device.<token>` or query `device_token`, and for a staff
      session subprotocol `pos-staff-session.<token>` or query
      `staff_session_token`. Origin may be absent. A native client offering
      subprotocols must also offer `actioncable-v1-json`, or the server selects
      no protocol for the socket.
  delivery: >
    Events only announce a change; read it through the API. Refetch every open
    query after a reconnect, because events sent while offline are not replayed.
paths:
  /api/v3/admin/pos/context:
    get:
      operationId: posContext
      parameters:
        - name: branch_id
          in: query
          description: The branch whose capabilities to list.
          schema:
            type: string
        - name: register_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Staff context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Context'
  /api/v3/admin/pos/catalog:
    get:
      operationId: posCatalog
      responses:
        '200':
          description: Products the branch may sell
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CatalogItem'
  /api/v3/admin/pos/workspaces:
    post:
      operationId: posWorkspaceCreate
      responses:
        '201':
          description: Draft workspace
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Workspace'
  /api/v3/admin/pos/workspaces/{id}:
    get:
      operationId: posWorkspaceShow
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Workspace
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Workspace'
  /api/v3/admin/pos/workspaces/{id}/items:
    post:
      operationId: posWorkspaceAddItem
      description: >
        Adds a line. A menu item at a branch running `fnb.menu` is priced by
        the server from its options: send `modifiers` ([ModifierSelection],
        omitted for the item's default options) and `note`, never a price.
        Two lines merge (`merge: true`) only with the same options and note.
        Refused with 409 `menu_item_sold_out`, `menu_item_hidden`,
        `modifier_min`, `modifier_max`, `modifier_unknown`, or
        `module_disabled` when options are sent where the menu is off.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Workspace after the line change
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Workspace'
  /api/v3/admin/pos/workspaces/{workspace_id}/items/{id}/modifiers:
    patch:
      operationId: posWorkspaceLineModifiers
      description: >
        Replaces the options and note of a menu line. The line keeps its base
        price; a line that ends up with the same options as another merges
        into it. Refused with 409 `module_disabled`, `modifier_min`,
        `modifier_max`, `modifier_unknown` or `snapshot_locked`.
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_revision, lease_generation, editor_id, modifiers]
              properties:
                expected_revision:
                  type: integer
                lease_generation:
                  type: integer
                editor_id:
                  type: string
                  format: uuid
                modifiers:
                  type: array
                  items:
                    $ref: '#/components/schemas/ModifierSelection'
                note:
                  type: string
                  maxLength: 200
      responses:
        '200':
          description: Workspace after the change
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Workspace'
        '409':
          description: Refused; `error.details.reason` says why
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/menu:
    get:
      operationId: posMenu
      description: >
        The menu a branch sells from now: a running time-of-day menu applied,
        hidden items left out, today's sold-out items marked. Send the last
        `etag` as `If-None-Match` to get 304 when nothing changed. Read again
        on `menu.sold_out`.
      parameters:
        - name: branch_id
          in: query
          required: true
          schema:
            type: string
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        '200':
          description: Menu
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Menu'
        '304':
          description: Unchanged since the etag sent
  /api/v3/admin/pos/menu_availabilities:
    put:
      operationId: posMenuSoldOut
      description: >
        Marks a menu item sold out at a branch for the current business day,
        or back on sale. Needs `pos.menu.sold_out`, `pos.menu.manage`, or a
        kitchen screen (device mode `kds`) of the branch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch_id, menu_item_id, sold_out]
              properties:
                branch_id:
                  type: string
                menu_item_id:
                  type: string
                sold_out:
                  type: boolean
      responses:
        '200':
          description: Sold-out state
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/MenuAvailability'
        '409':
          description: Refused; `error.details.reason` says why
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/menu_favorites:
    put:
      operationId: posMenuFavorites
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch_id, menu_item_ids]
              properties:
                branch_id:
                  type: string
                menu_item_ids:
                  type: array
                  maxItems: 20
                  items:
                    type: string
      responses:
        '200':
          description: The branch's favourites, in order
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [branch_id, menu_item_ids]
                    properties:
                      branch_id:
                        type: string
                      menu_item_ids:
                        type: array
                        items:
                          type: string
  /api/v3/admin/pos/menu_categories:
    get:
      operationId: posMenuCategories
      responses:
        '200':
          description: Categories of the store's menu
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MenuCategory'
  /api/v3/admin/pos/menu_items:
    get:
      operationId: posMenuItems
      responses:
        '200':
          description: Items of the store's menu, inactive ones included
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MenuItemConfig'
  /api/v3/admin/pos/modifier_groups:
    get:
      operationId: posModifierGroups
      responses:
        '200':
          description: Modifier groups of the store with their options
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ModifierGroup'
  /api/v3/admin/pos/recipes:
    get:
      operationId: posRecipe
      description: >
        The recipe of one menu size (`variant_id`) or one modifier option
        (`modifier_option_id`): the active version with its estimated cost at
        today's cost prices, and every version, newest first.
      parameters:
        - name: variant_id
          in: query
          schema:
            type: string
        - name: modifier_option_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Recipe and history
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/RecipeOwner'
    put:
      operationId: posRecipeSave
      description: >
        Saves a new version and retires the active one; an empty list retires
        the recipe. Quantities must be a whole number of the ingredient's stock
        unit. A size with a recipe stops tracking its own stock, so a size with
        stock on hand needs `confirm_stock_write_off` (409
        `recipe_variant_has_stock` otherwise). Needs `pos.inventory.manage`
        and `fnb.recipes` on at a branch of the store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ingredients]
              properties:
                variant_id:
                  type: string
                modifier_option_id:
                  type: string
                confirm_stock_write_off:
                  type: boolean
                ingredients:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    required: [variant_id, quantity, unit_code]
                    properties:
                      variant_id:
                        type: string
                      quantity:
                        type: string
                        pattern: '^\d+(\.\d{1,4})?$'
                      unit_code:
                        type: string
      responses:
        '200':
          description: Recipe and history after the change
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/RecipeOwner'
        '409':
          description: >
            Refused; `error.details.reason` is one of `recipe_ingredient_tracked`,
            `recipe_unit_dimension`, `recipe_unit_unknown`, `recipe_quantity_inexact`,
            `recipe_quantity_invalid`, `recipe_ingredient_duplicate`, `recipe_ingredient_self`,
            `recipe_variant_has_stock`, `recipe_rows_limit` or `module_disabled`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/stock_alerts:
    get:
      operationId: posStockAlerts
      description: Low-stock thresholds of a branch with its shelf now, low ones first.
      parameters:
        - name: branch_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thresholds
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StockAlert'
    put:
      operationId: posStockAlertSet
      description: >
        Sets the threshold of one variant at a branch, in its stock unit, or
        removes it when `min_quantity` is null. Needs `pos.inventory.manage`
        at the branch and `fnb.recipes` on there. Answers with the branch's list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch_id, variant_id]
              properties:
                branch_id:
                  type: string
                variant_id:
                  type: string
                min_quantity:
                  type: [integer, 'null']
                  minimum: 1
      responses:
        '200':
          description: Thresholds after the change
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StockAlert'
        '409':
          description: Refused; `error.details.reason` is `stock_alert_invalid` or `module_disabled`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/reports/ingredient_usage:
    get:
      operationId: posReportIngredientUsage
      description: >
        Ingredients completed sales used, by business date, ingredient and
        menu item, in stock units, at the cost copied at completion.
      parameters:
        - $ref: '#/components/parameters/ReportBranch'
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
      responses:
        '200':
          description: One page of rows
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/IngredientUsageRow'
                  meta:
                    type: object
  /api/v3/admin/pos/reports/menu_margin:
    get:
      operationId: posReportMenuMargin
      description: >
        Gross margin by menu size over completed sales: line revenue after
        line promotions and before added tax, less what the recipes consumed.
      parameters:
        - $ref: '#/components/parameters/ReportBranch'
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
      responses:
        '200':
          description: One page of rows
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MenuMarginRow'
                  meta:
                    type: object
  /api/v3/admin/pos/einvoice_settings:
    get:
      operationId: posEinvoiceSettings
      description: >
        Which e-invoice the store issues, the providers it may pick (only those
        with an adapter), and its settings rows (store default first, then
        branch rows). Credentials are never returned, only which fields are
        set. Store administration (`write_pos_topology`) only.
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/EinvoiceSettings'
    put:
      operationId: posEinvoiceSettingsSave
      description: >
        Sets the store's e-invoice type and/or one settings row: the store
        default (no `branch_id`) or a branch's own row (`status: disabled`
        makes the branch use the default). `setting.credentials` replaces the
        stored credentials when present and is write-only. Issuing (`einvoice_type`
        other than `none`) needs an active store default.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                einvoice_type:
                  type: string
                  enum: [none, cash_register, coded]
                branch_id:
                  type: string
                setting:
                  $ref: '#/components/schemas/EinvoiceSettingInput'
      responses:
        '200':
          description: Settings after the change
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/EinvoiceSettings'
        '409':
          description: >
            Refused; `error.details.reason` is `einvoice_provider_unknown`,
            `einvoice_setting_invalid` (with `details.field`), `einvoice_type_invalid`,
            `einvoice_not_configured` or `store_profile_required`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/einvoice_settings/test:
    post:
      operationId: posEinvoiceSample
      description: >
        Issues one made-up invoice through a sandbox provider with the store
        default (or `branch_id`'s) settings and saves nothing. Refused for a
        real provider (`einvoice_sample_sandbox_only`).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                branch_id:
                  type: string
      responses:
        '200':
          description: What the provider answered
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/EinvoiceSample'
        '409':
          description: Refused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/einvoices:
    get:
      operationId: posEinvoices
      description: >
        E-invoices of completed orders, newest first, at the branches where the
        person has `pos.einvoice.manage` (every branch for POS administration).
        `status=outstanding` lists orders without an issued invoice yet
        (pending, issuing, failed).
      parameters:
        - name: branch_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [outstanding, pending, issuing, issued, failed, canceled, replaced, adjusted]
        - name: q
          in: query
          description: Part of the order number
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: One page of invoices
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Einvoice'
                  meta:
                    type: object
  /api/v3/admin/pos/einvoices/summary:
    get:
      operationId: posEinvoiceSummary
      description: >
        Invoices still waiting, by status, and the store's turnover of the
        year so far against the 1 billion VND mark (`level` is `warning` from
        80% and `reached` from 100%).
      parameters:
        - name: branch_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/EinvoiceSummary'
  /api/v3/admin/pos/einvoices/retry:
    post:
      operationId: posEinvoiceRetry
      description: >
        Queues `ids` (up to 100), or every failed invoice of `branch_id`, for
        an immediate try. Invoices that are not pending or failed are skipped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  maxItems: 100
                  items:
                    type: string
                branch_id:
                  type: string
      responses:
        '200':
          description: What was queued
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [queued, skipped]
                    properties:
                      queued:
                        type: array
                        items:
                          type: string
                      skipped:
                        type: integer
  /api/v3/admin/pos/einvoices/{id}:
    get:
      operationId: posEinvoice
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The invoice
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Einvoice'
  /api/v3/admin/pos/einvoices/{id}/buyer:
    put:
      operationId: posEinvoiceBuyer
      description: >
        Sets the buyer an invoice that has not gone to the provider will carry
        (empty: a sale to a consumer). A failed invoice is queued again.
        Refused with `einvoice_already_issued` once issued: request a replacement.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [buyer]
              properties:
                buyer:
                  $ref: '#/components/schemas/EinvoiceBuyer'
      responses:
        '200':
          description: The invoice
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Einvoice'
        '409':
          description: >
            Refused; `error.details.reason` is `einvoice_buyer_invalid` (with
            `details.field`), `einvoice_issuing` or `einvoice_already_issued`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/einvoices/{id}/cancel:
    post:
      operationId: posEinvoiceCancel
      description: Stops an invoice that never reached the provider. An issued invoice is replaced instead.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  maxLength: 200
      responses:
        '200':
          description: The cancelled invoice
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Einvoice'
        '409':
          description: Refused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/einvoices/{id}/replace:
    post:
      operationId: posEinvoiceReplace
      description: >
        Requests a replacement of an issued invoice with a new buyer, for
        example company details the buyer asked for later. The replacement is
        issued through the queue; the original becomes `replaced` then.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [buyer, reason]
              properties:
                buyer:
                  $ref: '#/components/schemas/EinvoiceBuyer'
                reason:
                  type: string
                  maxLength: 200
      responses:
        '201':
          description: The replacement invoice
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Einvoice'
        '409':
          description: >
            Refused; `error.details.reason` is `einvoice_not_issued`,
            `einvoice_replacement_pending`, `einvoice_reason_required` or `einvoice_buyer_invalid`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/approvals:
    post:
      operationId: posApprovalCreate
      responses:
        '201':
          description: Approval
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Approval'
  /api/v3/pos_device/pair:
    post:
      operationId: posDevicePair
      description: >
        Exchanges a single-use pairing code. Unauthenticated and rate limited
        per client address; an unknown or expired code answers 404
        `pairing_invalid`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, platform, name]
              properties:
                code:
                  type: string
                platform:
                  type: string
                  enum: [android, ios, web]
                name:
                  type: string
                  maxLength: 80
                app_version:
                  type: string
      responses:
        '201':
          description: Device token, shown once
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/DevicePairResult'
        '404':
          description: The code is invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many attempts from this address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/pos_device/me:
    get:
      operationId: posDeviceMe
      responses:
        '200':
          description: Paired device
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/DeviceSession'
  /api/v3/pos_device/staff:
    get:
      operationId: posDeviceStaff
      responses:
        '200':
          description: Names at the branch
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeviceStaffMember'
  /api/v3/pos_device/staff_sessions:
    post:
      operationId: posDeviceStaffSignIn
      description: >
        Five wrong PINs in 15 minutes lock that person on this device (429
        `pin_locked`); the device as a whole has a cap (429 `pin_rate_limited`).
        A wrong PIN answers 401 `pin_incorrect`, a person without a PIN 401
        `pin_not_set`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [membership_id, pin]
              properties:
                membership_id:
                  type: string
                pin:
                  type: string
      responses:
        '201':
          description: Staff session token, shown once
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/DeviceStaffSignIn'
        '401':
          description: Refused; `error.code` says why
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Locked; `error.code` says why
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: posDeviceStaffSignOut
      responses:
        '204':
          description: Signed out
  /api/v3/admin/pos/printers:
    get:
      operationId: posPrinters
      parameters:
        - name: branch_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Printers of the branch
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Printer'
    post:
      operationId: posPrinterCreate
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch_id, name, connection]
              properties:
                branch_id:
                  type: string
                name:
                  type: string
                  maxLength: 80
                connection:
                  type: string
                  enum: [escpos_lan, escpos_bluetooth, sunmi_builtin, epson_epos, star_webprnt, browser]
                address:
                  type: [string, 'null']
                  description: Host or IP with an optional port; no scheme or path.
                bluetooth_id:
                  type: [string, 'null']
                paper:
                  type: string
                  enum: [58mm, 80mm]
                command_language:
                  type: string
                  enum: [escpos, tspl]
                roles:
                  type: array
                  items:
                    type: string
                print_station_device_id:
                  type: [string, 'null']
                register_id:
                  type: [string, 'null']
                status:
                  type: string
                  enum: [active, disabled]
                settings:
                  type: object
      responses:
        '201':
          description: The new printer
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Printer'
  /api/v3/admin/pos/printers/stations:
    get:
      operationId: posPrinterStations
      parameters:
        - name: branch_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Active print station devices of the branch
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      properties:
                        id:
                          type: string
                        name:
                          type: string
  /api/v3/admin/pos/printers/{id}:
    patch:
      operationId: posPrinterUpdate
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 80
                connection:
                  type: string
                  enum: [escpos_lan, escpos_bluetooth, sunmi_builtin, epson_epos, star_webprnt, browser]
                address:
                  type: [string, 'null']
                  description: Host or IP with an optional port; no scheme or path.
                bluetooth_id:
                  type: [string, 'null']
                paper:
                  type: string
                  enum: [58mm, 80mm]
                command_language:
                  type: string
                  enum: [escpos, tspl]
                roles:
                  type: array
                  items:
                    type: string
                print_station_device_id:
                  type: [string, 'null']
                register_id:
                  type: [string, 'null']
                status:
                  type: string
                  enum: [active, disabled]
                settings:
                  type: object
      responses:
        '200':
          description: The changed printer
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Printer'
    delete:
      operationId: posPrinterDelete
      description: Refused with `printer_in_use` once the printer has print jobs; disable it instead.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 200
      responses:
        '200':
          description: The removed printer id
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id]
                    properties:
                      id:
                        type: string
        '409':
          description: Refused; `error.details.reason` says why
  /api/v3/admin/pos/printers/{id}/test:
    post:
      operationId: posPrinterTest
      description: >
        A print station printer gets a queued test job. A printer the browser
        drives gets the test document back, to print from the browser.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 200
      responses:
        '200':
          description: The test job or document
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [print_job, document]
                    properties:
                      print_job:
                        oneOf:
                          - $ref: '#/components/schemas/PrintJob'
                          - type: 'null'
                      document:
                        oneOf:
                          - $ref: '#/components/schemas/PrintDocument'
                          - type: 'null'
        '409':
          description: Refused; `error.details.reason` says why
  /api/v3/admin/pos/print_jobs:
    get:
      operationId: posPrintJobs
      parameters:
        - name: branch_id
          in: query
          required: true
          schema:
            type: string
        - name: status
          in: query
          description: Comma-separated statuses
          schema:
            type: string
      responses:
        '200':
          description: The print queue of the branch, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PrintJob'
    post:
      operationId: posPrintJobCreate
      description: >
        Queues a receipt (recording its print) or a pre-bill. A pre-bill of a
        revision already issued is refused with `prebill_already_printed`.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, printer_id]
              properties:
                kind:
                  type: string
                  enum: [receipt, prebill]
                printer_id:
                  type: string
                receipt_id:
                  type: string
                workspace_id:
                  type: string
                receipt_template_id:
                  type: string
                template_version:
                  type: string
                paper:
                  type: string
      responses:
        '201':
          description: The queued job
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PrintJobResult'
        '409':
          description: Refused; `error.details.reason` says why
  /api/v3/admin/pos/print_jobs/prebills:
    get:
      operationId: posPrintJobPrebills
      parameters:
        - name: branch_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The latest printed pre-bill of each open order, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PrintJob'
  /api/v3/admin/pos/print_jobs/{id}/reprint:
    post:
      operationId: posPrintJobReprint
      description: >
        A new job for the same document. A pre-bill needs an approval for
        `workspace.reprint_prebill` bound to the workspace and its revision,
        and answers `approval_required` without one.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                approval_id:
                  type: string
      responses:
        '201':
          description: The new job
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PrintJobResult'
        '409':
          description: Refused; `error.details.reason` says why
  /api/v3/admin/pos/print_jobs/{id}/cancel:
    post:
      operationId: posPrintJobCancel
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 200
      responses:
        '200':
          description: The canceled job
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PrintJob'
        '409':
          description: Refused; `error.details.reason` says why
  /api/v3/admin/pos/receipts/{id}/prints/{print_id}/void:
    post:
      operationId: posReceiptPrintVoid
      description: >
        Takes back the caller's latest print recorded for a LAN printer, when
        delivery certainly failed, so it does not count as printed.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: print_id
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [mixed_content, no_address, printer_error, not_sent]
      responses:
        '200':
          description: The voided print
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [print, receipt]
                    properties:
                      print:
                        type: object
                      receipt:
                        type: object
        '409':
          description: Refused; `error.details.reason` says why
  /api/v3/pos_device/print_jobs/claim:
    post:
      operationId: posDevicePrintClaim
      description: >
        The next job of a printer bound to this print station, or null. A
        printer has one job out at a time, in id order. Printing is
        at-least-once: deliver the report of an attempt before claiming again,
        because an attempt whose lease ran out and whose job was claimed again
        can no longer be reported.
      responses:
        '200':
          description: A claimed job or null
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/PrintJobClaim'
                      - type: 'null'
  /api/v3/pos_device/print_jobs/{id}/report:
    post:
      operationId: posDevicePrintReport
      parameters:
        - $ref: '#/components/parameters/Id'
      description: >
        How one attempt ended. Repeating the same report is safe. A report for
        an attempt that is no longer current answers `print_claim_stale`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attempt, status]
              properties:
                attempt:
                  type: integer
                  minimum: 1
                status:
                  type: string
                  enum: [printed, failed]
                error:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: The job after the report
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PrintJob'
        '409':
          description: Refused; `error.details.reason` says why
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/system_status:
    get:
      operationId: posSystemStatus
      description: >
        Server health for store administrators (`read_pos_topology` or
        `write_pos_topology`). Store-wide counts, ages and timestamps only.
      responses:
        '200':
          description: The server's address, TLS mode and health
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/SystemStatus'
        '403':
          description: Not a store administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    ReportBranch:
      name: branch_id
      in: query
      required: true
      schema:
        type: string
    ReportFrom:
      name: from
      in: query
      description: First business date, YYYY-MM-DD; today by default
      schema:
        type: string
        format: date
    ReportTo:
      name: to
      in: query
      description: Last business date, YYYY-MM-DD; the start date by default
      schema:
        type: string
        format: date
  schemas:
    RealtimeEvent:
      type: object
      additionalProperties: false
      required: [event, id, branch_id, at, refs]
      properties:
        event:
          type: string
          enum:
            - workspace.updated
            - kitchen_ticket.updated
            - menu.sold_out
            - payment.requested
            - print_job.created
            - resource.updated
            - approval.requested
        id:
          type: string
        branch_id:
          type: string
        revision:
          type: integer
        lease_generation:
          type: integer
        at:
          type: string
          format: date-time
        refs:
          type: object
          additionalProperties:
            type: string
    Context:
      type: object
      additionalProperties: true
      required: [staff, store, administration, capabilities]
      properties:
        capabilities:
          type: array
          description: What the signed-in person may do at the selected branch, such as `pos.device.manage`.
          items:
            type: string
        staff:
          type: object
          additionalProperties: true
          required: [id, email]
          properties:
            id:
              type: string
            email:
              type: string
        store:
          type: object
          additionalProperties: true
          required: [id, currency]
          properties:
            id:
              type: string
            currency:
              type: string
        administration:
          type: object
          additionalProperties: true
          required: [read, write]
          properties:
            read:
              type: boolean
            write:
              type: boolean
        einvoice_type:
          type: string
          enum: [none, cash_register, coded]
          description: E-invoice the store issues for completed orders; the counter offers buyer details unless it is none.
    CatalogItem:
      type: object
      additionalProperties: true
      required: [product_id, price, stock_on_hand]
      properties:
        product_id:
          type: string
        price:
          type: string
        stock_on_hand:
          type: number
    TaxRow:
      type: object
      additionalProperties: true
      required: [rate, label, amount]
      properties:
        rate:
          type: string
        label:
          type: string
        amount:
          type: string
    Workspace:
      type: object
      additionalProperties: true
      required: [id, revision, operational_status, service_mode, business_date, totals]
      properties:
        id:
          type: string
        revision:
          type: integer
        operational_status:
          type: string
        service_mode:
          type: string
          enum: [counter, dine_in, takeaway, delivery, tab, timed]
        business_date:
          type: string
          format: date
        line_items:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceLine'
        totals:
          type: object
          additionalProperties: true
          required: [taxes]
          properties:
            taxes:
              type: array
              items:
                type: object
                additionalProperties: true
                required: [rate, label, amount]
                properties:
                  rate:
                    type: string
                  label:
                    type: string
                  amount:
                    type: string
    WorkspaceLine:
      type: object
      additionalProperties: true
      required: [id, variant_id, name, quantity, price, amount, sale_line_id]
      properties:
        id:
          type: string
        variant_id:
          type: string
        name:
          type: string
        quantity:
          type: integer
        price:
          type: string
        amount:
          type: string
        sale_line_id:
          type: [string, 'null']
        kind:
          type: string
          enum: [ordinary, measured, tracked, menu, timed, cover]
        unit_price:
          type: string
        note:
          type: [string, 'null']
        modifiers:
          type: array
          items:
            $ref: '#/components/schemas/LineModifier'
        components:
          type: array
          items:
            $ref: '#/components/schemas/LineComponent'
    LineModifier:
      type: object
      additionalProperties: false
      description: An option a line was sold with, copied at the time of sale.
      required: [id, option_id, name, group_name, price_delta, quantity]
      properties:
        id:
          type: string
        option_id:
          type: [string, 'null']
          description: Null once the option itself was deleted.
        name:
          type: string
        group_name:
          type: string
        price_delta:
          type: string
        quantity:
          type: integer
          minimum: 1
    LineComponent:
      type: object
      additionalProperties: false
      description: What one unit of a combo line contained when it was sold.
      required: [id, variant_id, name, quantity]
      properties:
        id:
          type: string
        variant_id:
          type: string
        name:
          type: string
        quantity:
          type: integer
          minimum: 1
    ModifierSelection:
      type: object
      additionalProperties: false
      required: [option_id]
      properties:
        option_id:
          type: string
        quantity:
          type: integer
          minimum: 1
          maximum: 10
          description: Above 1 only in a group with `allow_quantity`.
    Menu:
      type: object
      additionalProperties: false
      required: [branch_id, currency, business_date, module_enabled, categories, items, modifier_groups, schedules, favorites, etag]
      properties:
        branch_id:
          type: string
        currency:
          type: string
        business_date:
          type: string
          format: date
        module_enabled:
          type: boolean
        categories:
          type: array
          items:
            $ref: '#/components/schemas/MenuCategory'
        items:
          type: array
          items:
            $ref: '#/components/schemas/MenuItem'
        modifier_groups:
          type: array
          items:
            $ref: '#/components/schemas/ModifierGroup'
        schedules:
          type: array
          description: Time-of-day menus running now.
          items:
            type: object
            additionalProperties: false
            required: [id, name]
            properties:
              id:
                type: string
              name:
                type: string
        favorites:
          type: array
          description: Menu item ids of the favourites row, in order.
          items:
            type: string
        etag:
          type: string
    MenuCategory:
      type: object
      additionalProperties: false
      required: [id, name, position, color, active]
      properties:
        id:
          type: string
        name:
          type: string
        position:
          type: integer
        color:
          type: [string, 'null']
        active:
          type: boolean
    MenuItemConfig:
      type: object
      additionalProperties: true
      required: [id, product_id, name, kind, menu_category_id, kitchen_category, cup_label, show_components_on_kds, position, active,
                 tax_category_id, modifier_group_ids, components]
      properties:
        id:
          type: string
        product_id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [single, combo]
        menu_category_id:
          type: [string, 'null']
        kitchen_category:
          type: [string, 'null']
          pattern: '^[a-z_]{2,40}$'
        cup_label:
          type: boolean
        show_components_on_kds:
          type: boolean
        position:
          type: integer
        active:
          type: boolean
        tax_category_id:
          type: [string, 'null']
        modifier_group_ids:
          type: array
          items:
            type: string
        components:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, variant_id, name, quantity]
            properties:
              id:
                type: string
              variant_id:
                type: string
              name:
                type: string
              quantity:
                type: integer
    MenuItem:
      allOf:
        - $ref: '#/components/schemas/MenuItemConfig'
        - type: object
          required: [image_url, sold_out, variants]
          properties:
            image_url:
              type: [string, 'null']
            sold_out:
              type: boolean
            variants:
              type: array
              minItems: 1
              description: Sizes, each at its price now.
              items:
                type: object
                additionalProperties: false
                required: [id, name, sku, barcode, price, list_price, schedule_id]
                properties:
                  id:
                    type: string
                  name:
                    type: [string, 'null']
                  sku:
                    type: [string, 'null']
                  barcode:
                    type: [string, 'null']
                  price:
                    type: string
                  list_price:
                    type: [string, 'null']
                  schedule_id:
                    type: [string, 'null']
                    description: The time-of-day menu that sets `price`, if any.
    ModifierGroup:
      type: object
      additionalProperties: false
      required: [id, name, min_select, max_select, allow_quantity, position, required, options]
      properties:
        id:
          type: string
        name:
          type: string
        min_select:
          type: integer
          minimum: 0
        max_select:
          type: integer
          minimum: 1
        allow_quantity:
          type: boolean
        position:
          type: integer
        required:
          type: boolean
        options:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, price_delta, variant_id, default_selected, position, active]
            properties:
              id:
                type: string
              name:
                type: string
              price_delta:
                type: string
              variant_id:
                type: [string, 'null']
              default_selected:
                type: boolean
              position:
                type: integer
              active:
                type: boolean
    MenuAvailability:
      type: object
      additionalProperties: false
      required: [menu_item_id, branch_id, sold_out, business_date]
      properties:
        menu_item_id:
          type: string
        branch_id:
          type: string
        sold_out:
          type: boolean
        business_date:
          type: string
          format: date
    Approval:
      type: object
      additionalProperties: true
      required: [id, branch_id, approver_id, requester_id, action, currency, revision, status, expires_at]
      properties:
        id:
          type: string
        branch_id:
          type: string
