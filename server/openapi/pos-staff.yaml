      properties:
        id:
          type: string
        version:
          type: integer
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        estimated_cost:
          type: [string, 'null']
          description: At today's cost prices; null while an ingredient has none
        ingredients:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, variant_id, name, sku, options_text, quantity, unit_code, base_quantity, base_unit, unit_cost, cost]
