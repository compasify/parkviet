              properties:
                branch_id:
                  type: string
                printer_id:
                  type: [string, 'null']
                size:
                  type: string
                  enum: ['40x30', '50x30', '58x40']
                fields:
                  type: array
                  items:
                    type: string
                    enum: [call_number, options, note, guest_name, time, store_name]
                pickup_minutes:
                  type: integer
                  minimum: 1
                  maximum: 120
      responses:
        '200':
          description: The settings
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/CupLabelSettings'
        '409':
          description: Refused; `error.details.reason` is `cup_label_settings_invalid` or `printer_not_queued`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/cup_label_settings/test:
    post:
      operationId: posCupLabelTest
      description: A sample label on the branch's cup label printer.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch_id]
              properties:
                branch_id:
                  type: string
      responses:
        '201':
          description: The queued job
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PrintJob'
        '409':
          description: Refused; `error.details.reason` is `cup_label_printer_missing` or a printer reason
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/platform_orders:
    get:
      operationId: posPlatformOrders
      description: >
        Delivery platform orders of a branch. `open` (the default) lists
        accepted and ready orders oldest first for the counter; the others
        list newest first. Dates are the sale's business date, both ends
        included.
      parameters:
        - $ref: '#/components/parameters/ReportBranch'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, completed, canceled, unsettled]
        - name: platform
          in: query
          required: false
          schema:
            type: string
            enum: [grabfood, shopeefood]
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: One page of orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformOrderList'
        '422':
          description: An unknown filter value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: posPlatformOrderEnter
      description: >
        Enters a platform order read off the platform's tablet: a delivery
        sale on the cashier's open shift with the platform as its order
        source, menu lines only, each at the platform's price when given
        (audited as a price override with the reason `platform_price`). It
        gets its call number and goes to the kitchen at once. Needs
        `fnb.delivery_platforms` and the platform turned on at the branch.
        One order per platform code at a branch.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformOrderInput'
      responses:
        '201':
          description: The order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformOrderResult'
        '409':
          description: >
            Refused; `error.details.reason` is `platform_disabled`,
            `platform_order_duplicate` (with `platform_order_id`),
            `platform_item_not_menu`, `platform_price_invalid`,
            `platform_order_ref_invalid`, `platform_order_empty`,
            `module_disabled` or a workspace reason
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/platform_orders/{id}/ready:
    post:
      operationId: posPlatformOrderReady
      description: >
        Marks the order ready for the driver by hand. The kitchen marks it
        ready by itself when its last item is ready; a second tap changes
        nothing.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformOrderResult'
        '409':
          description: Refused; `error.details.reason` is `platform_order_completed` or `platform_order_canceled`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/platform_orders/{id}/complete:
    post:
      operationId: posPlatformOrderComplete
      description: >
        The driver took the order. The sale is paid with one
        `platform_receivable` tender for its total (received funds with the
        platform order as evidence, no drawer movement) and completed, which
        issues the receipt. Shift owner with `pos.payment.collect`.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformOrderEditor'
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformOrderResult'
        '409':
          description: Refused; `error.details.reason` is `platform_order_completed`, `platform_order_canceled` or a tender reason
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/platform_orders/{id}/cancel:
    post:
      operationId: posPlatformOrderCancel
      description: >
        The platform canceled the order. Items the kitchen still has are
        voided with the reason `platform_canceled`, which needs an approval
        (`approval_id`) or a cashier with `pos.approve`; then the sale is
        canceled.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformOrderCancelInput'
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformOrderResult'
        '409':
          description: >
            Refused; `error.details.reason` is `approval_required`,
            `platform_order_completed` or `platform_order_canceled`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/platform_orders/settle:
    post:
      operationId: posPlatformOrdersSettle
      description: >
        Records that the platform paid for completed orders, with the
        commission it actually kept where it differs from the estimate. Only
        the platform orders change; the sales and their receipts do not.
        Store administration or `pos.discrepancy.resolve`.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformSettleInput'
      responses:
        '200':
          description: The settled orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformOrderSettled'
        '409':
          description: >
            Refused; `error.details.reason` is `platform_order_open`,
            `platform_order_settled`, `platform_commission_invalid` or
            `platform_settle_empty`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/platform_settings:
    get:
      operationId: posPlatformSettings
      parameters:
        - $ref: '#/components/parameters/ReportBranch'
      responses:
        '200':
          description: Every platform of the branch, configured or not
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformSettingsResult'
    put:
      operationId: posPlatformSettingUpdate
      description: >
        Turns one platform on or off at the branch and sets the percent it
        keeps. Entered orders keep the rate they were entered with. Turning
        one on needs `fnb.delivery_platforms`. Audited as
        `platform_setting.change`.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformSettingInput'
      responses:
        '200':
          description: The platform's setting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformSettingResult'
        '409':
          description: Refused; `error.details.reason` is `platform_invalid`, `platform_rate_invalid` or `module_disabled`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/workspaces/{workspace_id}/guest_name:
    post:
      operationId: posWorkspaceGuestName
      description: >
        The name called out with the call number. Same editor rules as the
        order source; it moves no money, so it can change while a payment is
        under way. Blank clears it. Needs `fnb.order_number` or `fnb.cup_label`.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_revision, lease_generation, editor_id, guest_name]
              properties:
                expected_revision:
                  type: integer
                lease_generation:
                  type: integer
                editor_id:
                  type: string
                guest_name:
                  type: [string, 'null']
                  maxLength: 60
      responses:
        '200':
          description: The workspace
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Workspace'
        '409':
          description: Refused; `error.details.reason` says why
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/workspaces/{workspace_id}/cup_labels:
    post:
      operationId: posWorkspaceCupLabelsReprint
      description: >
        Prints the cup labels of one line (`sale_line_id`), or of the whole
        order, again: only cups that already had a label. Needs
        `pos.payment.collect`; audited as `cup_label.reprint`.
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sale_line_id:
                  type: string
      responses:
        '201':
          description: The queued jobs, one per cup
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [jobs]
                    properties:
                      jobs:
                        type: array
                        items:
                          $ref: '#/components/schemas/PrintJob'
        '409':
          description: >
            Refused; `error.details.reason` is `cup_label_printer_missing`,
            `cup_label_nothing`, `workspace_canceled` or a printer reason
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/workspaces/{workspace_id}/kitchen_sends:
    post:
      operationId: posKitchenSend
      description: >
        "Send to kitchen": one ticket per station for the part of every menu
        line not sent yet. Same editor rules as other draft commands. Answers
        the workspace, with the tickets of this send in `meta.tickets` (empty
        when nothing was left to send).
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_revision, lease_generation, editor_id]
              properties:
                expected_revision:
                  type: integer
                lease_generation:
                  type: integer
                editor_id:
                  type: string
      responses:
        '201':
          description: The workspace after the send
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/Workspace'
                  meta:
                    type: object
                    required: [tickets]
                    properties:
                      tickets:
                        type: array
                        items:
                          $ref: '#/components/schemas/KitchenTicket'
        '409':
          description: Refused; `error.details.reason` says why
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/workspaces/{workspace_id}/kitchen_tickets:
    get:
      operationId: posWorkspaceKitchenTickets
      description: What the kitchen was told about an order, send by send.
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tickets by sequence
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/KitchenTicket'
  /api/v3/pos_device/kitchen/stations:
    get:
      operationId: posDeviceKitchenStations
      description: Active stations of the screen's branch. Device modes `kds` and `expo`.
      responses:
        '200':
          description: Stations by position
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KitchenStationList'
  /api/v3/pos_device/kitchen/station:
    put:
      operationId: posDeviceKitchenSelectStation
      description: The station this screen shows; blank or absent `station_id` for every station.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                station_id:
                  type: [string, 'null']
      responses:
        '200':
          description: The device
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Device'
  /api/v3/pos_device/kitchen/board:
    get:
      operationId: posDeviceKitchenBoard
      description: >
        The board of the screen's station (or `station_id`; empty for every
        station). Poll it when the socket is down.
      parameters:
        - name: station_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The board
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KitchenBoardResult'
  /api/v3/pos_device/kitchen/menu_items:
    get:
      operationId: posDeviceKitchenMenuItems
      description: >
        Menu items the station makes and whether each is sold out today. Marking
        one sold out names a person: PUT /admin/pos/menu_availabilities with a
        staff session on the device.
      parameters:
        - name: station_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Items
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/KitchenMenuItem'
  /api/v3/pos_device/kitchen/items/{id}/start:
    post:
      operationId: posDeviceKitchenItemStart
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/KitchenTicketChanged'
        '409':
          $ref: '#/components/responses/KitchenRefused'
  /api/v3/pos_device/kitchen/items/{id}/ready:
    post:
      operationId: posDeviceKitchenItemReady
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/KitchenTicketChanged'
        '409':
          $ref: '#/components/responses/KitchenRefused'
  /api/v3/pos_device/kitchen/items/{id}/serve:
    post:
      operationId: posDeviceKitchenItemServe
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/KitchenTicketChanged'
        '409':
          $ref: '#/components/responses/KitchenRefused'
  /api/v3/pos_device/kitchen/items/{id}/recall:
    post:
      operationId: posDeviceKitchenItemRecall
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/KitchenTicketChanged'
        '409':
          $ref: '#/components/responses/KitchenRefused'
  /api/v3/pos_device/kitchen/tickets/{id}/bump:
    post:
      operationId: posDeviceKitchenTicketBump
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/KitchenTicketChanged'
  /api/v3/pos_device/kitchen/orders/{workspace_id}/serve:
    post:
      operationId: posDeviceKitchenOrderServe
      description: >
        "Handed over" from the finished tickets: every ready item of the order
        becomes served and its call number leaves the board.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          $ref: '#/components/responses/KitchenOrderServed'
  /api/v3/admin/pos/system_status:
    get:
      operationId: posSystemStatus
      description: >
        Server health for store administrators (`read_pos_topology` or
        `write_pos_topology`). Store-wide counts, ages and timestamps only.
      responses:
        '200':
          description: The server's address, TLS mode and health
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/SystemStatus'
        '403':
          description: Not a store administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    ReportBranch:
      name: branch_id
      in: query
      required: true
      schema:
        type: string
    WorkspaceId:
      name: workspace_id
      in: path
      required: true
      schema:
        type: string
    KitchenIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 200
    ReportFrom:
      name: from
      in: query
      description: First business date, YYYY-MM-DD; today by default
      schema:
        type: string
        format: date
    ReportTo:
      name: to
      in: query
      description: Last business date, YYYY-MM-DD; the start date by default
      schema:
        type: string
        format: date
  responses:
    KitchenTicketChanged:
      description: The ticket after the change; repeating a change answers the same ticket
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/KitchenTicketResult'
    KitchenOrderServed:
      description: The tickets whose items were served; empty when nothing was ready
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/KitchenOrderServedResult'
    KitchenRefused:
      description: >
        Refused; `error.details.reason` is `kitchen_status_invalid`,
        `kitchen_action_invalid` or `kitchen_recall_expired`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    RealtimeEvent:
      type: object
      additionalProperties: false
      required: [event, id, branch_id, at, refs]
      properties:
        event:
          type: string
          enum:
            - workspace.updated
            - kitchen_ticket.updated
            - menu.sold_out
            - payment.requested
            - print_job.created
            - resource.updated
            - approval.requested
        id:
          type: string
        branch_id:
          type: string
        revision:
          type: integer
        lease_generation:
          type: integer
        at:
          type: string
          format: date-time
        refs:
          type: object
          additionalProperties:
            type: string
    Context:
      type: object
      additionalProperties: true
      required: [staff, store, administration, capabilities]
      properties:
        capabilities:
          type: array
          description: What the signed-in person may do at the selected branch, such as `pos.device.manage`.
          items:
            type: string
        staff:
          type: object
          additionalProperties: true
          required: [id, email]
          properties:
            id:
              type: string
            email:
              type: string
        store:
          type: object
          additionalProperties: true
          required: [id, currency]
          properties:
            id:
              type: string
            currency:
              type: string
        administration:
          type: object
          additionalProperties: true
          required: [read, write]
          properties:
            read:
              type: boolean
            write:
              type: boolean
        einvoice_type:
          type: string
          enum: [none, cash_register, coded]
          description: E-invoice the store issues for completed orders; the counter offers buyer details unless it is none.
    CatalogItem:
      type: object
      additionalProperties: true
      required: [product_id, price, stock_on_hand]
      properties:
        product_id:
          type: string
        price:
          type: string
        stock_on_hand:
          type: number
    TaxRow:
      type: object
      additionalProperties: true
      required: [rate, label, amount]
      properties:
        rate:
          type: string
        label:
          type: string
        amount:
          type: string
    Workspace:
      type: object
      additionalProperties: true
      required: [id, revision, operational_status, service_mode, business_date, totals]
      properties:
        id:
          type: string
        revision:
          type: integer
        operational_status:
          type: string
        service_mode:
          type: string
          enum: [counter, dine_in, takeaway, delivery, tab, timed]
        business_date:
          type: string
          format: date
        order_number:
          type: [integer, 'null']
          description: >
            Call number (`fnb.order_number`), 1, 2, 3… per branch and business
            date, given at the first kitchen send or at completion and kept.
        guest_name:
          type: [string, 'null']
          maxLength: 60
          description: The name the counter calls out with the call number.
        line_items:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceLine'
        totals:
          type: object
          additionalProperties: true
          required: [taxes]
          properties:
            taxes:
              type: array
              items:
                type: object
                additionalProperties: true
                required: [rate, label, amount]
                properties:
                  rate:
                    type: string
                  label:
                    type: string
                  amount:
                    type: string
    WorkspaceLine:
      type: object
      additionalProperties: true
      required: [id, variant_id, name, quantity, price, amount, sale_line_id]
      properties:
        id:
          type: string
        variant_id:
          type: string
        name:
          type: string
        quantity:
          type: integer
        price:
          type: string
        amount:
          type: string
        sale_line_id:
          type: [string, 'null']
        kind:
          type: string
          enum: [ordinary, measured, tracked, menu, timed, cover]
        unit_price:
          type: string
        note:
          type: [string, 'null']
        modifiers:
          type: array
          items:
            $ref: '#/components/schemas/LineModifier'
        components:
          type: array
          items:
            $ref: '#/components/schemas/LineComponent'
        kitchen_sent_quantity:
          type: string
          description: How much of the line the kitchen has been told about. The line cannot go lower.
    LineModifier:
      type: object
      additionalProperties: false
      description: An option a line was sold with, copied at the time of sale.
      required: [id, option_id, name, group_name, price_delta, quantity]
      properties:
        id:
          type: string
        option_id:
          type: [string, 'null']
          description: Null once the option itself was deleted.
        name:
          type: string
        group_name:
          type: string
        price_delta:
          type: string
        quantity:
          type: integer
          minimum: 1
    LineComponent:
      type: object
      additionalProperties: false
      description: What one unit of a combo line contained when it was sold.
      required: [id, variant_id, name, quantity]
      properties:
        id:
          type: string
        variant_id:
          type: string
        name:
          type: string
        quantity:
          type: integer
          minimum: 1
    ModifierSelection:
      type: object
      additionalProperties: false
      required: [option_id]
      properties:
        option_id:
          type: string
        quantity:
          type: integer
          minimum: 1
          maximum: 10
          description: Above 1 only in a group with `allow_quantity`.
