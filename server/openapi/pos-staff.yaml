            properties:
              id:
                type: string
              version:
                type: integer
              active:
                type: boolean
              created_at:
                type: string
                format: date-time
              ingredients:
                type: integer
    Recipe:
      type: object
      additionalProperties: false
      required: [id, version, active, created_at, ingredients, estimated_cost]
      properties:
        id:
          type: string
        version:
          type: integer
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        estimated_cost:
          type: [string, 'null']
