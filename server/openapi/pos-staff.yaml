              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/StationRoute'
        '409':
          description: Refused; `error.details.reason` says why
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/admin/pos/station_routes/{id}:
    patch:
      operationId: posStationRouteUpdate
      parameters:
        - $ref: '#/components/parameters/KitchenIdempotencyKey'
        - $ref: '#/components/parameters/Id'
