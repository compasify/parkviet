    EinvoiceBuyer:
      type: object
      additionalProperties: false
      description: >
        Who the invoice is for. Empty is a sale to a consumer, printed with the
        store's consumer label. A tax code needs the registered name and address.
        `label` is set by the server when the invoice issues to a consumer.
      properties:
        tax_code:
          type: string
          pattern: '^\d{10}(-\d{3})?$'
        name:
          type: string
          maxLength: 400
        address:
          type: string
          maxLength: 400
        personal_id:
          type: string
          pattern: '^\d{12}$'
        phone:
          type: string
          maxLength: 15
        passport_no:
          type: string
          maxLength: 20
        nationality:
          type: string
          maxLength: 60
        email:
          type: string
          maxLength: 120
        buyer_note:
          type: string
          maxLength: 200
        label:
          type: string
    EinvoiceLine:
      type: object
      additionalProperties: false
      required: [position, kind, name, unit, quantity, unit_price, discount, tax_rate, tax_amount, amount_before_tax, amount,
                 price_includes_tax]
      properties:
        position:
          type: integer
        kind:
          type: string
          enum: [goods, service_charge, fee]
        name:
          type: string
        sku:
          type: [string, 'null']
        unit:
          type: string
        quantity:
          type: string
