        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, printer_id]
              properties:
                kind:
                  type: string
                  enum: [receipt, prebill]
                printer_id:
                  type: string
                receipt_id:
                  type: string
                workspace_id:
                  type: string
                receipt_template_id:
                  type: string
                template_version:
                  type: string
                paper:
                  type: string
      responses:
        '201':
          description: The queued job
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PrintJobResult'
        '409':
          description: Refused; `error.details.reason` says why
  /api/v3/admin/pos/print_jobs/prebills:
    get:
      operationId: posPrintJobPrebills
      parameters:
        - name: branch_id
          in: query
