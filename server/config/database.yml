default: &default
  adapter: postgresql
  encoding: unicode
  # With the Solid Queue supervisor inside Puma (the default), this pool
  # serves Puma's threads, the job worker threads, and ~3 Solid Queue
  # internals (dispatcher, scheduler, supervisor), plus Action Cable's 4
  # worker threads and Solid Cable's listener, writer and trim threads:
  #   pool = RAILS_MAX_THREADS + JOB_THREADS + JOB_IMAGE_THREADS + 3 + 4 + 3
  pool: <%= Integer(ENV.fetch("RAILS_MAX_THREADS", 3)) + Integer(ENV.fetch("JOB_THREADS", 3)) + Integer(ENV.fetch("JOB_IMAGE_THREADS", 1)) + 3 + 4 + 3 %>

development:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME") { "spree_development" } %>
  username: <%= ENV.fetch("DATABASE_USERNAME") { 'postgres' } %>
  password: <%= ENV.fetch("DATABASE_PASSWORD") { '' } %>
  host: <%= ENV.fetch("DATABASE_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DATABASE_PORT") { 5432 }.to_i %>

test:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME_TEST") { "spree_test" } %>
  username: <%= ENV.fetch("DATABASE_USERNAME") { 'postgres' } %>
  password: <%= ENV.fetch("DATABASE_PASSWORD") { '' } %>
  host: <%= ENV.fetch("DATABASE_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DATABASE_PORT") { 5432 }.to_i %>

production:
  <<: *default
  url: <%= ENV['DATABASE_URL'] %>
