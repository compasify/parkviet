# Industry profiles offered when a store sets up the POS. Loaded and
# validated at boot by Spree::Pos::BusinessProfiles; a bad entry stops the
# app from booting and fails spec/services/spree/pos/business_profiles_spec.rb.
#
# A profile is a preset for a branch, never a lock: it lists the modules to
# turn on, suggested branch defaults, how the catalog is shown, which risky
# features the industry usually uses (only shown as a hint; never turned on
# by the profile) and sample units to add. Code checks modules, never the
# profile key. Labels are not here: clients translate `profiles.<key>.label`
# and `profiles.<key>.description`.
#
# `status` is computed: available when every module is available and the
# group is open (BusinessProfiles::OPEN_GROUPS), otherwise coming_soon.
#
# Fields
#   group                 retail | fnb
#   order                 position in the picker, unique
#   modules               keys registered in config/initializers/pos_modules.rb
#   branch_defaults       return_window_days | lot_selection | variance_threshold |
#                         adjustment_approval_threshold | kitchen_send_trigger,
#                         valid for Spree::Pos::Branch.
#                         A field left out means the profile has no opinion: a new
#                         branch keeps the column default (returns off,
#                         lot_selection fefo) and a profile change proposes nothing.
#   display               catalog_view: cards | list
#                         surface: catalog | menu_grid, the selling screen
#                         (menu_grid needs fnb.menu)
#   recommended_features  Spree::Pos::FeatureFlag::FEATURES
#   sample_units          default unit codes or codes in config/pos/sample_units.yml
#   kitchen_stations      station kinds (prep | bar) the F&B setup step proposes;
#                         needs fnb.kitchen. Clients name them by kind.
#
# Bump `version` when a change to a profile should be offered to branches
# already set up with it.
version: 1
profiles:
  tap_hoa_sieu_thi:
    group: retail
    order: 1
    modules: [retail.units, retail.measured, retail.traceability]
    branch_defaults: { return_window_days: 7, lot_selection: fefo }
    display: { catalog_view: list }
    recommended_features: [credit, vietqr, customer_display]
    sample_units: [pack, case, kg]

  thoi_trang:
